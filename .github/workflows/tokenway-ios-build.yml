name: TokenWay iOS Native Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-ios-build.yml"

permissions:
  contents: read

concurrency:
  group: tokenway-ios-native-build
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout CI runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout TokenWay mobile source
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: feat/flutter-mobile-app
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: tokenway-source
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available >/dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project and resolve packages
        working-directory: tokenway-source/mobile
        run: |
          set -euo pipefail
          bash scripts/bootstrap_platforms.sh
          flutter pub get
          dart run scripts/prepare_brand_icon.dart
          dart run flutter_launcher_icons
          python3 scripts/validate_ios_scaffold.py

      - name: Analyze and run targeted mobile tests
        working-directory: tokenway-source/mobile
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub

      - name: Compile iOS Simulator app without signing
        working-directory: tokenway-source/mobile
        run: flutter build ios --simulator --no-codesign --release

      - name: Verify compiled iOS app and bundle metadata
        working-directory: tokenway-source/mobile
        run: |
          set -euo pipefail
          test -d build/ios/iphonesimulator/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphonesimulator/Runner.app/Info.plist | grep -Fx 'TokenWay AI'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist

      - name: Archive unsigned iOS Simulator app
        run: |
          cd tokenway-source/mobile/build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app TokenWay-iOS-Simulator.zip

      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: TokenWay-iOS-Simulator
          path: tokenway-source/mobile/build/ios/iphonesimulator/TokenWay-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

# Rebuild against latest TokenWay mobile source commit after API Key lifecycle changes.

