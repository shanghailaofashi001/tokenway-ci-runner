name: TokenWay Mobile Targeted Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-mobile-targeted-tests.yml"

permissions:
  contents: read

concurrency:
  group: tokenway-mobile-targeted-tests
  cancel-in-progress: true

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CI runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout latest TokenWay mobile source
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: feat/flutter-mobile-app
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: tokenway-source
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore original TokenWay brand asset and bootstrap platforms
        working-directory: tokenway-source/mobile
        run: bash scripts/bootstrap_platforms.sh

      - name: Resolve Flutter dependencies
        working-directory: tokenway-source/mobile
        run: flutter pub get

      - name: Run affected mobile regression tests
        working-directory: tokenway-source/mobile
        run: flutter test --no-pub test/tokenway_api_contract_test.dart test/wallet_payment_test.dart test/subscriptions_screen_test.dart

      - name: Analyze only changed mobile Dart modules
        working-directory: tokenway-source/mobile
        run: flutter analyze --no-pub --no-fatal-infos lib/services/tokenway_api.dart lib/screens/chat_screen.dart lib/screens/task_history_screen.dart lib/screens/access_tokens_screen.dart lib/screens/wallet_screen.dart lib/screens/subscriptions_screen.dart lib/screens/payment_webview_screen.dart

      - name: Verify API Key screen is connected
        working-directory: tokenway-source/mobile
        run: |
          set -euo pipefail
          test -s lib/screens/access_tokens_screen.dart
          grep -Fq "AccessTokensScreen(api: widget.api, language: widget.language)" lib/screens/profile_screen.dart
          grep -Fq "access token creation obtains operation-bound proof" test/tokenway_api_contract_test.dart
          grep -Fq "access token revoke consumes a proof bound to the target id" test/tokenway_api_contract_test.dart
          grep -Fq "requestNowPaymentsTopup" lib/services/tokenway_api.dart
          grep -Fq "requestSubscriptionEpay" lib/services/tokenway_api.dart
          grep -Fq "CNY" lib/screens/subscriptions_screen.dart
          grep -Fq "PaymentWebViewScreen" lib/screens/wallet_screen.dart

# Root-cause fix: bootstrap the base64 TokenWay brand asset before Flutter test asset bundling.

# Recheck the latest profile-to-API-Key navigation regression coverage.

# Re-run affected chat attachment, artifact download, API Key UI and API contract checks.

# Retest the corrected SSE fixture for multimodal image attachment payloads.

# Validate the latest proof-bound API Key permission editor and file-transfer modules.

# Target only changed wallet, subscription, payment and API contract modules; previously passed home/smoke tests are not rerun.
