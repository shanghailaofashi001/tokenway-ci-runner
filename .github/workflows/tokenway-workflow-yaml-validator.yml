name: TokenWay Workflow YAML Validator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-workflow-yaml-validator.yml"

permissions:
  contents: read

jobs:
  parse-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CI workflows
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflow semantics
        run: actionlint .github/workflows/tokenway-finance-r7-validation.yml .github/workflows/tokenway-autonomous-watchdog.yml .github/workflows/tokenway-mobile-targeted-tests.yml

      - name: Parse every workflow YAML file
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'yaml'
          Dir.glob('.github/workflows/*.yml').sort.each do |path|
            begin
              YAML.load_file(path, aliases: true)
              puts "PASS: #{path}"
            rescue Psych::Exception => error
              warn "FAIL: #{path}: #{error.message}"
              exit 1
            end
          end
          RUBY
# Force validation on the already-created workflow definition.
# Run actionlint as well as YAML syntax parsing to catch GitHub-specific workflow errors.
# Revalidate restored finance package workflow after reconstructing full source packaging steps.
