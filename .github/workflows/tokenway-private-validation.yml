name: TOKENWAY private-source validation

# Source restoration verification revision 4 - standalone service test file
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-private-validation.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-private-validation.yml"

permissions:
  contents: read

concurrency:
  group: tokenway-private-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full frontend, Go, and database validation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tokenway-test
          MYSQL_DATABASE: tokenway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptokenway-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokenway
          POSTGRES_PASSWORD: tokenway-test
          POSTGRES_DB: tokenway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tokenway -d tokenway_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      TEST_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable

    steps:
      - name: Checkout public CI configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned private TokenWay source and validation overlays
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: codex/fix-task-artifact-backfill-session # reset reused GORM destination IDs in regression tests
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned upstream New API base
        uses: actions/checkout@v4
        with:
          repository: QuantumNous/new-api
          ref: 48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Restore private validation materials into runner workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d private/.tokenway-validation
          test -d private/.tokenway-patches
          cp -a private/.tokenway-validation .
          cp -a private/.tokenway-patches .
          test -s .tokenway-validation/repair-ci-source.py
          test -s .tokenway-validation/apply-host-artifact-projection.py
          test -s .tokenway-validation/image-creator.patch
          test -s .tokenway-patches/p2-legacy-video-download/task-artifacts.patch
          echo "Private validation inputs restored; source contents are not printed or uploaded."

      - name: Set up Go and Bun
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore TokenWay source overlays and missing source archives
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p .tokenway-validation/overlay-extract
            cat .tokenway-validation/overlay/part-*.txt | base64 -d | gzip -dc | tar -xf - -C .tokenway-validation/overlay-extract
            cp -a .tokenway-validation/overlay-extract/files/. source/
            base64 -d .tokenway-validation/missing-source-definitions.tar.gz.base64 | tar -xz -C source
            base64 -d .tokenway-validation/ratio-validation-source.tar.gz.base64 | tar -xz -C source
            base64 -d .tokenway-validation/wallet-redemption-subscription-source.tar.gz.base64 | tar -xz -C source
            cat .tokenway-validation/personal-qr-source.part* | base64 -d | tar -xz -C source
            cat .tokenway-validation/billing-session.part* | base64 -d | tar -xz -C source
            test -s source/model/subscription.go
            test -s source/setting/ratio_setting/pricing_ratio_validation.go
            test -s source/model/request_billing_journal.go
            test -s source/model/subscription_usage_ledger.go
            test -s private/.tokenway-validation/source/model/task_billing_recovery.go
            if [[ ! -s source/model/task_billing_recovery.go ]]; then
              install -D -m 0644 private/.tokenway-validation/source/model/task_billing_recovery.go source/model/task_billing_recovery.go
            fi
            test -s source/model/task_billing_recovery.go
            grep -q 'func ValidatePersistedModelPricingOptions' source/model/model_pricing_config.go
            grep -q 'func ValidateCheckinQuotaRange' source/setting/operation_setting/checkin_setting.go
            grep -q 'func CheckGroupGroupRatio' source/setting/ratio_setting/group_ratio.go
            grep -q 'func ValidateTopupGroupRatioJSON' source/common/topup-ratio.go
          } >/tmp/tokenway-restore.log 2>&1
          echo "Private source restoration passed."

      - name: Compile source restoration scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .tokenway-validation/repair-ci-source.py .tokenway-validation/apply-host-artifact-projection.py .tokenway-validation/add-creator-route-tree.py
          echo "PASS: all source restoration scripts compile"
      - name: Repair TokenWay source contracts
        working-directory: source
        shell: bash
        run: |
          if python3 ../.tokenway-validation/repair-ci-source.py >/tmp/tokenway-repair.log 2>&1; then
            echo "PASS: source contract repair"
          else
            echo "FAIL: source contract repair; sanitized exception follows:"
            tail -n 30 /tmp/tokenway-repair.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Apply host artifact source projection
        working-directory: source
        shell: bash
        run: |
          if python3 ../.tokenway-validation/apply-host-artifact-projection.py >/tmp/tokenway-host-projection.log 2>&1; then
            echo "PASS: host artifact projection"
          else
            echo "FAIL: host artifact projection; sanitized exception follows:"
            tail -n 2 /tmp/tokenway-host-projection.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Adapt task artifact capture database fixture
        working-directory: source
        shell: bash
        run: |
          if python3 - <<'PY' >/tmp/tokenway-capture-fixture.log 2>&1
          from pathlib import Path
          p = Path("controller/task_artifact_capture_test.go")
          s = p.read_text()
          start = s.find("func TestTaskArtifactCaptureClaimUsesFreshLeasePerSerialItem(t *testing.T) {")
          if start >= 0:
              end = s.find("\nfunc ", start + 1)
              if end < 0:
                  end = len(s)
              region = s[start:end]
              if "openTaskDialectDatabase" not in region:
                  old_line = "require.NoError(t, model.InitDB())"
                  new_lines = "previousDB := model.DB\ndatabase, _ := openTaskDialectDatabase(t, &model.Task{})\nmodel.DB = database\nt.Cleanup(func() { model.DB = previousDB })"
                  if region.count(old_line) != 1:
                      raise SystemExit("capture test fixture cannot be safely adapted")
                  s = s[:start] + region.replace(old_line, new_lines, 1) + s[end:]
                  p.write_text(s)
          PY
          then
            echo "PASS: task artifact capture fixture adaptation"
          else
            echo "FAIL: task artifact capture fixture adaptation (private details withheld)"
            exit 1
          fi

      - name: Format task billing and artifact source files
        working-directory: source
        shell: bash
        run: |
          if gofmt -w controller/task.go controller/video_proxy.go controller/task_artifact_capture.go controller/task_generic_test.go controller/task_artifact_capture_test.go relay/relay_task.go >/tmp/tokenway-gofmt-task.log 2>&1; then
            echo "PASS: task billing and artifact gofmt"
          else
            echo "FAIL: task billing and artifact gofmt; sanitized formatter diagnostics:"
            tail -n 12 /tmp/tokenway-gofmt-task.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Format billing recovery and artifact service files
        working-directory: source
        shell: bash
        run: |
          if gofmt -w model/wallet_ledger.go model/wallet_ledger_test.go model/task_billing_recovery.go service/task_polling.go service/task_polling_test.go service/task_artifact_store.go service/task_artifact_s3_test.go service/task_artifact_metadata_dialect_test.go service/task_artifact_s3_roundtrip_test.go >/tmp/tokenway-gofmt-service.log 2>&1; then
            echo "PASS: billing recovery and artifact service gofmt"
          else
            echo "FAIL: billing recovery and artifact service gofmt (file/path or syntax issue)"
            exit 1
          fi

      - name: Apply image creator integration patch
        working-directory: source
        shell: bash
        run: |
          if git apply --recount ../.tokenway-validation/image-creator.patch >/tmp/tokenway-image-creator-patch.log 2>&1; then
            echo "PASS: image creator integration patch"
          else
            echo "FAIL: image creator integration patch; sanitized git apply diagnostics:"
            tail -n 20 /tmp/tokenway-image-creator-patch.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Register image creator route tree
        working-directory: source
        shell: bash
        run: |
          if python3 ../.tokenway-validation/add-creator-route-tree.py >/tmp/tokenway-creator-route.log 2>&1; then
            echo "PASS: image creator route tree"
          else
            echo "FAIL: image creator route tree (private details withheld)"
            exit 1
          fi

      - name: Apply legacy video download integration patch
        working-directory: source
        shell: bash
        run: |
          if git apply --recount ../.tokenway-patches/p2-legacy-video-download/task-artifacts.patch >/tmp/tokenway-legacy-video-patch.log 2>&1; then
            echo "PASS: legacy video download integration patch"
          else
            echo "FAIL: legacy video download integration patch (context mismatch or already-applied change)"
            exit 1
          fi

      - name: Install legacy video download frontend regression test
        working-directory: source
        shell: bash
        run: |
          if mkdir -p web/src/features/usage-logs/components/__tests__ && cp ../.tokenway-patches/p2-legacy-video-download/legacy-video-download.test.tsx web/src/features/usage-logs/components/__tests__/legacy-video-download.test.tsx; then
            echo "PASS: legacy video download regression test installed"
          else
            echo "FAIL: legacy video download regression test installation"
            exit 1
          fi

      - name: Isolate Gin global mode for parallel relay tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python ../.tokenway-validation/apply-gin-race-isolation.py
      - name: Format remaining integration source files
        working-directory: source
        shell: bash
        run: |
          if gofmt -w constant/task.go controller/playground.go relay/channel/minimax/adaptor.go relay/channel/minimax/adaptor_test.go relay/channel/minimax/image.go relay/common/relay_info.go relay/constant/relay_mode.go relay/constant/relay_mode_test.go relay/image_handler.go router/relay-router.go router/relay_router_test.go service/billing.go service/generated_image_task.go service/generated_image_task_test.go >/tmp/tokenway-gofmt-integration.log 2>&1; then
            echo "PASS: remaining integration gofmt"
          else
            echo "FAIL: remaining integration gofmt (file/path or syntax issue)"
            exit 1
          fi

      - name: Make subscription extra-reserve refund atomic and install regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python ../.tokenway-validation/apply-subscription-extra-refund-once.py
      - name: Restore and vendor Go modules
        id: go_vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-vendor-${label}.log"
            echo "===== Go module: $d ====="

            # Always build a fresh vendor tree. A failed vendor command must
            # never be mistaken for success because an older modules.txt exists.
            rm -rf "$d/vendor"

            if (
              cd "$d"
              export GOWORK=off GOFLAGS= GOTOOLCHAIN=local
              echo "+ go mod download all"
              go mod download all || { status=$?; echo "FAILED: go mod download all ($status)"; exit "$status"; }
              echo "+ go mod verify"
              go mod verify || { status=$?; echo "FAILED: go mod verify ($status)"; exit "$status"; }
              echo "+ go mod vendor"
              go mod vendor || { status=$?; echo "FAILED: go mod vendor ($status)"; exit "$status"; }
              test -s vendor/modules.txt || { echo "FAILED: vendor/modules.txt missing or empty after go mod vendor"; exit 1; }
            ) >"$log" 2>&1; then
              echo "PASS: fresh vendor generated for $d"
            else
              status=$?
              echo "FAIL: Go dependency restore/vendor for $d (exit $status). Diagnostics:"
              tail -n 180 "$log" | sed -E \
                's#(https?://)[^/@ ]+:[^/@ ]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g'
              exit "$status"
            fi
          done

          # The root module vendor tree is consumed by the subsequent offline
          # graph check; verify it is the newly generated tree, not a stale copy.
          test -s source/vendor/modules.txt || { echo "FAIL: root vendor/modules.txt missing"; exit 1; }
      - name: Export Go dependency vendor cache
        if: ${{ steps.go_vendor.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tokenway-go-vendor-${{ github.run_id }}
          path: |
            source/vendor/
            source/relaykit/vendor/
            source/tokenkit/vendor/
            source/go.mod
            source/go.sum
            source/relaykit/go.mod
            source/relaykit/go.sum
            source/tokenkit/go.mod
            source/tokenkit/go.sum
          if-no-files-found: error
          retention-days: 2
      - name: Prepare embedded web assets for Go-only validation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/dist
          if [[ ! -s web/dist/index.html ]]; then
            printf '%s\\n' '<!doctype html><html><head><meta charset="utf-8"></head><body>Go validation placeholder; frontend build runs later.</body></html>' > web/dist/index.html
          fi
          test -s web/dist/index.html
          echo "PASS: Go embed path is present; this placeholder is only for Go validation and the actual frontend build runs later."
      - name: Verify offline dependency graph
        id: offline_graph
        shell: bash
        run: |
          set -euo pipefail
          export GOPROXY=off GOSUMDB=off GOFLAGS=-mod=vendor GOTOOLCHAIN=local
          for d in source source/relaykit source/tokenkit; do
            echo "===== Offline dependency graph: $d ====="
            if (cd "$d" && go list -deps -test ./... >/dev/null) 2>/tmp/tokenway-go-list.err; then
              echo "Offline dependency graph passed: $d"
            else
              status=$?
              echo "Offline dependency graph failed: $d (exit $status)"
              echo "Go diagnostic:"
              sed -E 's#(https?://)[^/@ ]+:[^/@ ]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g' /tmp/tokenway-go-list.err | tail -n 220
              exit "$status"
            fi
          done
      - name: Full Go tests, build, and vet
        id: full_go
        shell: bash
        run: |
          set -Eeuo pipefail
          export GOWORK=off GOPROXY=off GOSUMDB=off GOFLAGS=-mod=vendor GOTOOLCHAIN=local
          validation_failed=0

          sanitize_go_log() {
            sed -E \
              's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1<redacted>@#g; s#([[:alnum:]_.-]+):[^@[:space:]]+@tcp#\1:<redacted>@tcp#g; s#(postgres(ql)?://)[^:/@[:space:]]+:[^@/[:space:]]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g; s#(/home/runner/[^ ]*)#<runner-path>#g'
          }

          emit_test_failure() {
            python3 - "$1" <<'PY' | sanitize_go_log
          import json
          import sys

          events = []
          with open(sys.argv[1], encoding="utf-8", errors="replace") as stream:
              for raw in stream:
                  try:
                      events.append(json.loads(raw))
                  except json.JSONDecodeError:
                      continue

          failures = [event for event in events if event.get("Action") == "fail"]
          failed_packages = sorted({event.get("Package", "") for event in failures if event.get("Package")})
          named = {}
          for event in failures:
              package = event.get("Package", "")
              test = event.get("Test", "")
              if package and test:
                  named.setdefault(package, set()).add(test)

          if not failures:
              print("No structured Go test failure event found; final raw diagnostics:")
              for event in events[-120:]:
                  if event.get("Action") == "output":
                      print(event.get("Output", "").rstrip())
          for package in failed_packages:
              tests = sorted(named.get(package, set()))
              print(f"FAILED PACKAGE: {package}")
              if tests:
                  for test in tests:
                      print(f"FAILED TEST: {test}")
                  selected = []
                  for event in events:
                      if event.get("Package") != package or event.get("Action") != "output":
                          continue
                      test = event.get("Test", "")
                      if not test or any(
                          test == failure or test.startswith(failure + "/") or failure.startswith(test + "/")
                          for failure in tests
                      ):
                          selected.append(event.get("Output", "").rstrip())
                  for output in selected[-260:]:
                      if output:
                          print(output)
              else:
                  print("No named test event; package output follows:")
                  selected = [
                      event.get("Output", "").rstrip()
                      for event in events
                      if event.get("Package") == package and event.get("Action") == "output"
                  ]
                  for output in selected[-260:]:
                      if output:
                          print(output)
          PY
          }

          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-go-test-${label}.jsonl"
            if (cd "$d" && go test -json -p=1 ./... -count=1) >"$log" 2>&1; then
              echo "PASS: full Go tests for $d"
            else
              status=$?
              echo "FAIL: full Go tests for $d (exit $status); failing test names and associated diagnostics:"
              emit_test_failure "$log"
              validation_failed=1
            fi
          done

          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-go-build-${label}.log"
            if (cd "$d" && go build -p=3 ./...) >"$log" 2>&1; then
              echo "PASS: full Go build for $d"
            else
              status=$?
              echo "FAIL: full Go build for $d (exit $status); sanitized diagnostics:"
              tail -n 140 "$log" | sanitize_go_log
              validation_failed=1
            fi
          done

          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-go-vet-${label}.log"
            if (cd "$d" && go vet -p=3 ./...) >"$log" 2>&1; then
              echo "PASS: full Go vet for $d"
            else
              status=$?
              echo "FAIL: full Go vet for $d (exit $status); sanitized diagnostics:"
              tail -n 140 "$log" | sanitize_go_log
              validation_failed=1
            fi
          done

          if (( validation_failed != 0 )); then
            echo "One or more Go test/build/vet checks failed; all modules and check types were still executed."
            exit 1
          fi
          echo "All three Go modules passed full tests, build, and vet."
      - name: Race-check logger rotation, video polling, and parallel provider tests
        if: ${{ always() && steps.go_vendor.outcome == 'success' && steps.offline_graph.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export GOWORK=off GOPROXY=off GOSUMDB=off GOFLAGS=-mod=vendor GOTOOLCHAIN=local
          go test -race -count=1 -p=2 ./service ./relay/channel/gemini ./relay/channel/minimax
      - name: Database migration, billing, task settlement, and artifact metadata matrix
        if: ${{ always() && steps.go_vendor.outcome == 'success' && steps.offline_graph.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          export GOWORK=off GOPROXY=off GOSUMDB=off GOFLAGS=-mod=vendor GOTOOLCHAIN=local
          matrix_failed=0

          sanitize_db_log() {
            sed -E \
              's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1<redacted>@#g; s#([[:alnum:]_.-]+):[^@[:space:]]+@tcp#\1:<redacted>@tcp#g; s#(postgres(ql)?://)[^:/@[:space:]]+:[^@/[:space:]]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g; s#(/home/runner/[^ ]*)#<runner-path>#g'
          }

          run_quiet() {
            label="$1"; shift
            log="/tmp/tokenway-db-matrix-$(printf '%s' "$label" | tr ' /' '__').log"
            if "$@" >"$log" 2>&1; then
              echo "PASS: $label"
            else
              status=$?
              echo "FAIL: $label (exit $status); sanitized diagnostics:"
              {
                grep -E -B 3 -A 14 '(^--- FAIL:|^FAIL[[:space:]]|Error Trace:|Test:[[:space:]]|panic:|fatal error:|^# )' "$log" || true
                tail -n 80 "$log"
              } | sanitize_db_log
              matrix_failed=1
            fi
          }

          run_quiet "schema migration compatibility" go test ./model -run '^TestMigrationSchemaStability$' -count=1
          run_quiet "fixed-price billing database matrix" go test ./service -run '^TestFixedPriceBillingDatabaseMatrix$' -count=1
          run_quiet "wallet cache and opening balance regressions" go test ./model -run 'TestWalletDeltaPreservesReservationsAcrossUserCacheSchemaRefresh|TestBackfillWalletOpeningBalances' -count=1
          run_quiet "task settlement and capture on MySQL" env TEST_TASK_DB_DIALECT=mysql go test ./controller -run 'TestImmediateTaskSettlementDatabase|TestTaskArtifactCaptureClaimUsesFreshLeasePerSerialItem' -count=1
          run_quiet "task settlement and capture on PostgreSQL" env TEST_TASK_DB_DIALECT=postgres go test ./controller -run 'TestImmediateTaskSettlementDatabase|TestTaskArtifactCaptureClaimUsesFreshLeasePerSerialItem' -count=1
          run_quiet "task artifact metadata on MySQL" env TEST_TASK_DB_DIALECT=mysql go test ./service -run '^TestTaskArtifactMetadataDatabaseDialectRoundTrip$' -count=1
          run_quiet "task artifact metadata on PostgreSQL" env TEST_TASK_DB_DIALECT=postgres go test ./service -run '^TestTaskArtifactMetadataDatabaseDialectRoundTrip$' -count=1

          if (( matrix_failed != 0 )); then
            echo "One or more database matrix checks failed; all independent checks were still executed."
            exit 1
          fi
          echo "All database matrix checks passed."
      - name: Install frontend dependencies
        working-directory: source/web
        shell: bash
        run: |
          if bun install --frozen-lockfile >/tmp/tokenway-bun-install.log 2>&1; then echo "Frontend dependencies installed."; else echo "Frontend dependency installation failed."; exit 1; fi

      - name: Frontend typecheck, tests, and production build
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail
          if bun run typecheck >/tmp/tokenway-typecheck.log 2>&1; then
            echo "Frontend typecheck passed."
          else
            echo "Frontend typecheck failed; sanitized TypeScript diagnostics:"
            grep -E 'error TS[0-9]+' /tmp/tokenway-typecheck.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g' | cut -c1-320 | head -n 40
            exit 1
          fi
          if bun run test >/tmp/tokenway-frontend-tests.log 2>&1; then
            echo "Frontend tests passed."
          else
            echo "Frontend tests failed; sanitized Vitest failure output:"
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' /tmp/tokenway-frontend-tests.log \
              | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(/tmp/[^ ]*)#<temp-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g' \
              | tail -n 140 | cut -c1-320
            exit 1
          fi
          if bun run build >/tmp/tokenway-frontend-build.log 2>&1; then echo "Frontend production build passed."; else echo "Frontend production build failed."; exit 1; fi
          test -s dist/index.html
