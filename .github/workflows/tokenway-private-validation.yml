name: TOKENWAY private-source validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-private-validation.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-private-validation.yml"

permissions:
  contents: read

concurrency:
  group: tokenway-private-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full frontend, Go, and database validation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tokenway-test
          MYSQL_DATABASE: tokenway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptokenway-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokenway
          POSTGRES_PASSWORD: tokenway-test
          POSTGRES_DB: tokenway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tokenway -d tokenway_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      TEST_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable

    steps:
      - name: Checkout public CI configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned private TokenWay source and validation overlays
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: 36d78757e948500a4970017915f29abb3aaa233a
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned upstream New API base
        uses: actions/checkout@v4
        with:
          repository: QuantumNous/new-api
          ref: 48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Restore private validation materials into runner workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d private/.tokenway-validation
          test -d private/.tokenway-patches
          cp -a private/.tokenway-validation .
          cp -a private/.tokenway-patches .
          test -s .tokenway-validation/repair-ci-source.py
          test -s .tokenway-validation/apply-host-artifact-projection.py
          test -s .tokenway-validation/image-creator.patch
          test -s .tokenway-patches/p2-legacy-video-download/task-artifacts.patch
          echo "Private validation inputs restored; source contents are not printed or uploaded."

      - name: Set up Go and Bun
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore TokenWay source overlays and missing source archives
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p .tokenway-validation/overlay-extract
            cat .tokenway-validation/overlay/part-*.txt | base64 -d | gzip -dc | tar -xf - -C .tokenway-validation/overlay-extract
            cp -a .tokenway-validation/overlay-extract/files/. source/
            base64 -d .tokenway-validation/missing-source-definitions.tar.gz.base64 | tar -xz -C source
            base64 -d .tokenway-validation/ratio-validation-source.tar.gz.base64 | tar -xz -C source
            base64 -d .tokenway-validation/wallet-redemption-subscription-source.tar.gz.base64 | tar -xz -C source
            cat .tokenway-validation/personal-qr-source.part* | base64 -d | tar -xz -C source
            cat .tokenway-validation/billing-session.part* | base64 -d | tar -xz -C source
            cat .tokenway-validation/batch3-subscription-model.part* | base64 -d | tar -xz -C source
            test -s source/model/subscription.go
            grep -q 'func ApplySubscriptionPreConsumeExtraReserve' source/model/subscription.go
            grep -q 'func refundSubscriptionPreConsumeTx' source/model/subscription.go
            test -s source/setting/ratio_setting/pricing_ratio_validation.go
            test -s source/model/request_billing_journal.go
            test -s source/model/subscription_usage_ledger.go
            test -s private/.tokenway-validation/source/model/task_billing_recovery.go
            if [[ ! -s source/model/task_billing_recovery.go ]]; then
              install -D -m 0644 private/.tokenway-validation/source/model/task_billing_recovery.go source/model/task_billing_recovery.go
            fi
            test -s source/model/task_billing_recovery.go
            grep -q 'func ValidatePersistedModelPricingOptions' source/model/model_pricing_config.go
            grep -q 'func ValidateCheckinQuotaRange' source/setting/operation_setting/checkin_setting.go
            grep -q 'func CheckGroupGroupRatio' source/setting/ratio_setting/group_ratio.go
            grep -q 'func ValidateTopupGroupRatioJSON' source/common/topup-ratio.go
          } >/tmp/tokenway-restore.log 2>&1
          echo "Private source restoration passed."

      - name: Restore TokenWay production Docker and deployment files
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in Dockerfile .dockerignore docker-compose.yml .env.production.example docs/TOKENWAY-AI-DEPLOYMENT.md scripts/validate-tokenway-docker.sh; do
            test -s "private/$path" || { echo "Missing private deployment source: $path" >&2; exit 1; }
          done
          install -D -m 0644 private/Dockerfile source/Dockerfile
          install -D -m 0644 private/.dockerignore source/.dockerignore
          install -D -m 0644 private/VERSION source/VERSION
          test "$(tr -d '\r\n' < source/VERSION)" = "1.0.0-rc.52"
          install -D -m 0644 private/docker-compose.yml source/docker-compose.yml
          install -D -m 0644 private/.env.production.example source/.env.production.example
          install -D -m 0644 private/docs/TOKENWAY-AI-DEPLOYMENT.md source/docs/TOKENWAY-AI-DEPLOYMENT.md
          install -D -m 0755 private/scripts/validate-tokenway-docker.sh source/scripts/validate-tokenway-docker.sh
          grep -q 'dockerfile: Dockerfile' source/docker-compose.yml
          grep -q 'go build -pgo=off' source/Dockerfile
          ! grep -q 'go list -m.*default.pgo' source/Dockerfile
          ! grep -q 'calciumion/new-api:latest' source/docker-compose.yml
          grep -Fq "grep -Eq 'success[^a-zA-Z]+true'" source/docker-compose.yml
          ! grep -Fq ' |       test:' source/docker-compose.yml
          grep -q 'TASK_ARTIFACT_STORE_MODE=s3' source/.env.production.example
          bash -n source/scripts/validate-tokenway-docker.sh
          echo "PASS: TokenWay Compose builds its own Dockerfile; production env and verifier restored."

      - name: Apply TokenWay AI brand and MiniMax H3 candidate patches
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          jobs = [
              ('../private/.tokenway-validation/brand-h3/TOKENWAY-AI-BRANDED-WEBSITE.patch', '--- a/setting/operation_setting/general_setting.go', '/tmp/tokenway-brand.patch'),
              ('../private/.tokenway-validation/brand-h3/TOKENWAY-AI-REFERENCE-H3-READY.patch', '--- a/plugins/builtin_plugins_test.go', '/tmp/tokenway-h3.patch'),
          ]
          for source, marker, destination in jobs:
              content = Path(source).read_text(encoding='utf-8')
              offset = content.find(marker)
              if offset < 0:
                  raise SystemExit(f'Expected patch section boundary not found: {source}')
              filtered = content[offset:]
              if not filtered.endswith("\n"):
                  filtered += "\n"
              Path(destination).write_text(filtered, encoding='utf-8')
          PY
          patch --batch --forward --dry-run -p1 < /tmp/tokenway-brand.patch
          patch --batch --forward -p1 < /tmp/tokenway-brand.patch
          patch --batch --forward --dry-run -p1 < /tmp/tokenway-h3.patch
          patch --batch --forward -p1 < /tmp/tokenway-h3.patch
          base64 -d ../private/.tokenway-validation/brand-h3/TOKENWAY-RC52-S3-H3-SAFETY-FIX.patch.gz.b64 | gzip -dc > /tmp/tokenway-s3-h3-safety.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          patch = Path('/tmp/tokenway-s3-h3-safety.patch')
          source = patch.read_text(encoding='utf-8')
          start = source.find('diff --git a/controller/task.go ')
          if start >= 0:
              end = source.find('diff --git a/docs/TOKENWAY-AI-DEPLOYMENT.md ', start)
              if end < 0:
                  raise SystemExit('controller patch section has no following boundary')
              source = source[:start] + source[end:]
          # These sections are already supplied by the approved brand/H3 patch
          # and deployment-file restore. Reapplying them creates reversed or
          # conflicting hunks; retain the remaining S3 regression changes.
          blocked = {'docs/TOKENWAY-AI-DEPLOYMENT.md', 'plugins/hailuo_responses_test.go'}
          sections = re.split(r'(?=^diff --git a/)', source, flags=re.MULTILINE)
          kept = []
          for section in sections:
              match = re.search(r'^diff --git a/(\\S+) b/', section, flags=re.MULTILINE)
              if match and match.group(1) in blocked:
                  continue
              kept.append(section)
          patch.write_text(''.join(kept), encoding='utf-8')
          PY
          patch --batch --forward --dry-run -p1 < /tmp/tokenway-s3-h3-safety.patch
          patch --batch --forward -p1 < /tmp/tokenway-s3-h3-safety.patch
          python3 ../private/.tokenway-validation/brand-h3/apply-rc52-s3-config-fail-closed.py
          patch --batch --forward --dry-run -p1 < ../private/.tokenway-validation/brand-h3/TOKENWAY-FRONTEND-TYPECHECK-FIX.patch
          patch --batch --forward -p1 < ../private/.tokenway-validation/brand-h3/TOKENWAY-FRONTEND-TYPECHECK-FIX.patch
          grep -Fq "TEST_USD_CURRENCY_CONFIG" web/src/test-setup.ts
          test -s web/src/test-utils/currency.ts
          echo "PASS: CNY default test fixture is already included in the H3 reference patch"
          grep -Fq "TEST_USD_CURRENCY_CONFIG" web/src/features/usage-logs/components/__tests__/detail-preview.test.tsx
          grep -Fq "TEST_USD_CURRENCY_CONFIG" web/src/features/usage-logs/components/__tests__/quota-adjustment.test.tsx
          patch --batch --forward --dry-run -p1 < ../private/.tokenway-validation/brand-h3/TOKENWAY-CNY-TEST-STATE-FIX.patch
          patch --batch --forward -p1 < ../private/.tokenway-validation/brand-h3/TOKENWAY-CNY-TEST-STATE-FIX.patch
          patch --batch --forward --dry-run -p1 < ../private/.tokenway-validation/brand-h3/TOKENWAY-CNY-TEST-ISOLATION-FIX.patch
          patch --batch --forward -p1 < ../private/.tokenway-validation/brand-h3/TOKENWAY-CNY-TEST-ISOLATION-FIX.patch
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          html = Path('../private/.tokenway-validation/brand-h3/TOKENWAY-AI-REFERENCE-H3-READY-PREVIEW.html').read_text(encoding='utf-8')
          images = re.findall(r"""data:image/webp;base64,([^"']+)""", html)
          names = ['hero-scene.webp','brand-mark.webp','gpt.webp','claude.webp','gemini.webp','grok.webp','mistral.webp','deepseek.webp','kimi.webp','qwen.webp','doubao.webp','minimax.webp','glm.webp','image-art.webp','video-art.webp','audio-art.webp']
          if len(images) != 17:
              raise SystemExit(f'Expected 17 embedded WebP references, found {len(images)}')
          target = Path('web/public/tokenway-home')
          target.mkdir(parents=True, exist_ok=True)
          for name, encoded in zip(names, images):
              data = base64.b64decode(encoded, validate=True)
              if not data.startswith(b'RIFF') or data[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP payload: {name}')
              (target / name).write_bytes(data)
          source_assets = Path('web/src/assets/tokenway-home')
          source_assets.mkdir(parents=True, exist_ok=True)
          (source_assets / 'hero-scene.webp').write_bytes((target / 'hero-scene.webp').read_bytes())
          expected = ['hero-scene.webp','brand-mark.webp','gpt.webp','claude.webp','gemini.webp','grok.webp','mistral.webp','deepseek.webp','kimi.webp','qwen.webp','doubao.webp','minimax.webp','glm.webp','image-art.webp','video-art.webp','audio-art.webp']
          if any(not (target / name).is_file() or (target / name).stat().st_size < 1000 for name in expected):
              raise SystemExit('One or more homepage WebP assets are missing or truncated')
          print('PASS: 16 TokenWay homepage WebP assets restored from the preserved visual reference')
          PY
          node --check plugins/tasks/hailuo/plugin.js
          grep -q 'h3_context_ir' plugins/tasks/hailuo/plugin.js
          grep -q 'video_regeneration' plugins/tasks/hailuo/plugin.js
          grep -Fq 'Context-IR is temporarily disabled' plugins/tasks/hailuo/plugin.js
          grep -Fq 'An explicitly requested but invalid S3 configuration remains in S3 mode' setting/system_setting/task_artifact_store.go
          ! grep -Fq 'task artifact S3 storage is not implemented; using upstream mode' setting/system_setting/task_artifact_store.go
          grep -Fq 'deployment placeholder' setting/system_setting/task_artifact_store.go
          echo "PASS: TokenWay reference homepage and MiniMax H3 source patches applied."

      - name: Compile source restoration scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .tokenway-validation/repair-ci-source.py .tokenway-validation/apply-host-artifact-projection.py .tokenway-validation/add-creator-route-tree.py .tokenway-validation/apply-subscription-extra-refund-once.py .tokenway-validation/apply-subscription-extra-reserve-idempotency.py
          echo "PASS: all source restoration scripts compile"
      - name: Repair TokenWay source contracts
        working-directory: source
        shell: bash
        run: |
          if python3 ../.tokenway-validation/repair-ci-source.py >/tmp/tokenway-repair.log 2>&1; then
            echo "PASS: source contract repair"
          else
            echo "FAIL: source contract repair; sanitized exception follows:"
            tail -n 30 /tmp/tokenway-repair.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Apply Batch 3 subscription reserve and refund repairs
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../.tokenway-validation/apply-subscription-extra-refund-once.py
          python3 ../.tokenway-validation/apply-subscription-extra-reserve-idempotency.py
          grep -q 'TestBillingSessionSubscriptionExtraReserveRefundsOnce' service/subscription_refund_once_test.go
          grep -q 'TestSubscriptionRefundEscapesRequestIDLikeWildcards' model/subscription_billing_atomic_test.go

      - name: Apply host artifact source projection
        working-directory: source
        shell: bash
        run: |
          if python3 ../.tokenway-validation/apply-host-artifact-projection.py >/tmp/tokenway-host-projection.log 2>&1; then
            echo "PASS: host artifact projection"
          else
            echo "FAIL: host artifact projection; sanitized exception follows:"
            tail -n 2 /tmp/tokenway-host-projection.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Guard artifact downloads when explicit S3 storage is unavailable
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../private/.tokenway-validation/brand-h3/apply-rc52-controller-artifact-fail-closed.py
          grep -Fq 'TaskArtifactStoreFailClosed()' controller/task.go
          grep -Fq 'TaskArtifactStoreFailClosed()' controller/video_proxy.go

      - name: Guard runtime artifact persistence failures
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../private/.tokenway-validation/brand-h3/apply-rc52-s3-runtime-write-fail-closed.py
          python3 ../private/.tokenway-validation/brand-h3/apply-rc52-s3-runtime-range-safe.py
          grep -Fq 'proxyTaskMediaWithArtifactUsingStore' controller/video_proxy.go
          grep -Fq 'TestProxyTaskMediaFailsClosedWhenS3PersistFails' controller/task_generic_test.go

      - name: Initialize S3 store after dotenv
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../private/.tokenway-validation/brand-h3/apply-rc52-s3-env-load-order.py
          grep -Fq 'service.InitTaskArtifactStore()' main.go
          grep -Fq 'TestTaskArtifactStoreInitializesAfterDotEnvLoad' service/task_artifact_store_test.go
          grep -Fq 'taskArtifactStoreInitMu sync.RWMutex' service/task_artifact_store.go

      - name: Persist JSON ContentPath artifacts before serving
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../private/.tokenway-validation/brand-h3/apply-rc52-s3-contentpath-fail-closed.py
          grep -Fq 'persistTaskMediaContentPath(' controller/video_proxy.go
          grep -Fq 'TestProxyTaskMediaContentPathPersistsBeforeServing' controller/task_generic_test.go
          grep -Fq 'TestProxyTaskMediaContentPathFailsClosedWhenS3PersistFails' controller/task_generic_test.go

      - name: Adapt task artifact capture database fixture
        working-directory: source
        shell: bash
        run: |
          if python3 - <<'PY' >/tmp/tokenway-capture-fixture.log 2>&1
          from pathlib import Path
          p = Path("controller/task_artifact_capture_test.go")
          s = p.read_text()
          start = s.find("func TestTaskArtifactCaptureClaimUsesFreshLeasePerSerialItem(t *testing.T) {")
          if start >= 0:
              end = s.find("\nfunc ", start + 1)
              if end < 0:
                  end = len(s)
              region = s[start:end]
              if "openTaskDialectDatabase" not in region:
                  old_line = "require.NoError(t, model.InitDB())"
                  new_lines = "previousDB := model.DB\ndatabase, _ := openTaskDialectDatabase(t, &model.Task{})\nmodel.DB = database\nt.Cleanup(func() { model.DB = previousDB })"
                  if region.count(old_line) != 1:
                      raise SystemExit("capture test fixture cannot be safely adapted")
                  s = s[:start] + region.replace(old_line, new_lines, 1) + s[end:]
                  p.write_text(s)
          PY
          then
            echo "PASS: task artifact capture fixture adaptation"
          else
            echo "FAIL: task artifact capture fixture adaptation (private details withheld)"
            exit 1
          fi

      - name: Format task billing and artifact source files
        working-directory: source
        shell: bash
        run: |
          if gofmt -w controller/task.go controller/video_proxy.go controller/task_artifact_capture.go controller/task_generic_test.go controller/task_artifact_capture_test.go relay/relay_task.go >/tmp/tokenway-gofmt-task.log 2>&1; then
            echo "PASS: task billing and artifact gofmt"
          else
            echo "FAIL: task billing and artifact gofmt; sanitized formatter diagnostics:"
            tail -n 12 /tmp/tokenway-gofmt-task.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Format billing recovery and artifact service files
        working-directory: source
        shell: bash
        run: |
          if gofmt -w main.go model/wallet_ledger.go model/wallet_ledger_test.go model/task_billing_recovery.go service/task_polling.go service/task_polling_test.go service/task_artifact_store.go service/task_artifact_store_test.go service/task_artifact_s3_test.go service/task_artifact_metadata_dialect_test.go service/task_artifact_s3_roundtrip_test.go setting/system_setting/task_artifact_store.go >/tmp/tokenway-gofmt-service.log 2>&1; then
            echo "PASS: billing recovery and artifact service gofmt"
          else
            echo "FAIL: billing recovery and artifact service gofmt (file/path or syntax issue)"
            exit 1
          fi

      - name: Repair TokenWay homepage interactions, language labels and AI Chat terminology
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../private/.tokenway-validation/brand-h3/apply-tokenway-ui-followup.py
          grep -Fq "changeLanguage('zhCN')" web/src/features/home/tokenway-landing.tsx
          ! grep -Fq "changeLanguage('zh-CN')" web/src/features/home/tokenway-landing.tsx
          ! grep -Fq "docs.newapi.pro" web/src/features/home/tokenway-landing.tsx
          grep -Fq "to='/docs'" web/src/features/home/tokenway-landing.tsx
          grep -Fq 'AI Image Generation' web/src/features/home/tokenway-landing.tsx
          grep -Fq 'AI Audio Creation' web/src/features/home/tokenway-landing.tsx
          grep -Fq '"Playground": "AI Chat"' web/src/i18n/locales/en.json
          grep -Fq '"Playground": "AI聊天"' web/src/i18n/locales/zh.json
          grep -Fq 'DocsLink:                   "/docs"' setting/operation_setting/general_setting.go
          echo "PASS: TokenWay UI interaction and AI Chat follow-up"

      - name: Apply image creator integration patch
        working-directory: source
        shell: bash
        run: |
          if git apply --recount ../.tokenway-validation/image-creator.patch >/tmp/tokenway-image-creator-patch.log 2>&1; then
            echo "PASS: image creator integration patch"
          else
            echo "FAIL: image creator integration patch; sanitized git apply diagnostics:"
            tail -n 20 /tmp/tokenway-image-creator-patch.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g'
            exit 1
          fi

      - name: Register image creator route tree
        working-directory: source
        shell: bash
        run: |
          if python3 ../.tokenway-validation/add-creator-route-tree.py >/tmp/tokenway-creator-route.log 2>&1; then
            echo "PASS: image creator route tree"
          else
            echo "FAIL: image creator route tree (private details withheld)"
            exit 1
          fi

      - name: Apply final TokenWay brand/runtime hardening
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../private/.tokenway-validation/apply-tokenway-brand-runtime-fix.py
          test -s web/src/features/brand/tokenway-brand-links.ts
          grep -Fq "href: '/creator'" web/src/features/brand/tokenway-brand-links.ts
          grep -Fq "to='/creator'" web/src/features/home/tokenway-landing.tsx
          grep -Fq "href='/sign-in'" web/src/features/home/tokenway-landing.tsx
          grep -Fq "applyFaviconToDom('/favicon.svg')" web/src/main.tsx
          grep -Fq "src='/tokenway-icon.svg'" web/src/features/brand/tokenway-brand.tsx
          test -s web/public/tokenway-home/brand-wordmark.webp
          test -s web/public/tokenway-icon.svg
          grep -Fq "tokenway-reference-models mt-6 mx-6" web/src/features/home/tokenway-landing.tsx
          grep -Fq "min-h-0 overflow-y-auto" web/src/routes/_authenticated/creator/index.tsx
          echo "PASS: final brand runtime hardening; authenticated Creator route kept."

      - name: Apply legacy video download integration patch
        working-directory: source
        shell: bash
        run: |
          if git apply --recount ../.tokenway-patches/p2-legacy-video-download/task-artifacts.patch >/tmp/tokenway-legacy-video-patch.log 2>&1; then
            echo "PASS: legacy video download integration patch"
          else
            echo "FAIL: legacy video download integration patch (context mismatch or already-applied change)"
            exit 1
          fi

      - name: Install legacy video download frontend regression test
        working-directory: source
        shell: bash
        run: |
          if mkdir -p web/src/features/usage-logs/components/__tests__ && cp ../.tokenway-patches/p2-legacy-video-download/legacy-video-download.test.tsx web/src/features/usage-logs/components/__tests__/legacy-video-download.test.tsx; then
            echo "PASS: legacy video download regression test installed"
          else
            echo "FAIL: legacy video download regression test installation"
            exit 1
          fi

      - name: Format remaining integration source files
        working-directory: source
        shell: bash
        run: |
          if gofmt -w constant/task.go controller/playground.go relay/channel/minimax/adaptor.go relay/channel/minimax/adaptor_test.go relay/channel/minimax/image.go relay/common/relay_info.go relay/constant/relay_mode.go relay/constant/relay_mode_test.go relay/image_handler.go router/relay-router.go router/relay_router_test.go service/billing.go service/generated_image_task.go service/generated_image_task_test.go >/tmp/tokenway-gofmt-integration.log 2>&1; then
            echo "PASS: remaining integration gofmt"
          else
            echo "FAIL: remaining integration gofmt (file/path or syntax issue)"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: source/web
        shell: bash
        run: |
          if bun install --frozen-lockfile >/tmp/tokenway-bun-install.log 2>&1; then echo "Frontend dependencies installed."; else echo "Frontend dependency installation failed."; exit 1; fi

      - name: Frontend typecheck, tests, and production build
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail
          if bun run typecheck >/tmp/tokenway-typecheck.log 2>&1; then
            echo "Frontend typecheck passed."
          else
            echo "Frontend typecheck failed; sanitized TypeScript diagnostics:"
            grep -E 'error TS[0-9]+' /tmp/tokenway-typecheck.log | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g' | cut -c1-320 | head -n 40
            exit 1
          fi
          if bun run test --reporter=verbose >/tmp/tokenway-frontend-tests.log 2>&1; then
            echo "Frontend tests passed."
          else
            echo "Frontend tests failed; sanitized Vitest failure output:"
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' /tmp/tokenway-frontend-tests.log \
              | sed -E 's#(/home/runner/[^ ]*)#<runner-path>#g; s#(/tmp/[^ ]*)#<temp-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g' \
              | grep -E '(^ FAIL |^ ❯ src/|Test Files|Tests |TestingLibraryElementError|Unable to find|Expected|Received|AssertionError|TOKENWAY_DEBUG_MODEL_PRICING)' | tail -n 160 | cut -c1-320
            exit 1
          fi
          if bun run build >/tmp/tokenway-frontend-build.log 2>&1; then
            echo "Frontend production build passed."
          else
            status=$?
            echo "Frontend production build failed; sanitized diagnostics follow:"
            tail -n 140 /tmp/tokenway-frontend-build.log | sed -E \
              's#(/home/runner/[^ ]*)#<runner-path>#g; s#(/tmp/[^ ]*)#<temp-path>#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g'
            exit "$status"
          fi
          test -s dist/index.html

      - name: Restore and vendor Go modules
        id: go_vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-vendor-${label}.log"
            echo "===== Go module: $d ====="

            # Always build a fresh vendor tree. A failed vendor command must
            # never be mistaken for success because an older modules.txt exists.
            rm -rf "$d/vendor"

            if (
              cd "$d"
              export GOWORK=off GOFLAGS= GOTOOLCHAIN=local
              echo "+ go mod download all"
              go mod download all || { status=$?; echo "FAILED: go mod download all ($status)"; exit "$status"; }
              echo "+ go mod verify"
              go mod verify || { status=$?; echo "FAILED: go mod verify ($status)"; exit "$status"; }
              echo "+ go mod vendor"
              go mod vendor || { status=$?; echo "FAILED: go mod vendor ($status)"; exit "$status"; }
              test -s vendor/modules.txt || { echo "FAILED: vendor/modules.txt missing or empty after go mod vendor"; exit 1; }
            ) >"$log" 2>&1; then
              echo "PASS: fresh vendor generated for $d"
            else
              status=$?
              echo "FAIL: Go dependency restore/vendor for $d (exit $status). Diagnostics:"
              tail -n 180 "$log" | sed -E \
                's#(https?://)[^/@ ]+:[^/@ ]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g'
              exit "$status"
            fi
          done

          # The root module vendor tree is consumed by the subsequent offline
          # graph check; verify it is the newly generated tree, not a stale copy.
          test -s source/vendor/modules.txt || { echo "FAIL: root vendor/modules.txt missing"; exit 1; }
      - name: Verify offline dependency graph
        id: offline_graph
        shell: bash
        run: |
          set -euo pipefail
          export GOPROXY=off GOSUMDB=off GOFLAGS=-mod=vendor GOTOOLCHAIN=local
          for d in source source/relaykit source/tokenkit; do
            echo "===== Offline dependency graph: $d ====="
            if (cd "$d" && go list -deps -test ./... >/dev/null) 2>/tmp/tokenway-go-list.err; then
              echo "Offline dependency graph passed: $d"
            else
              status=$?
              echo "Offline dependency graph failed: $d (exit $status)"
              echo "Go diagnostic:"
              sed -E 's#(https?://)[^/@ ]+:[^/@ ]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g' /tmp/tokenway-go-list.err | tail -n 220
              exit "$status"
            fi
          done
      - name: Full Go tests, build, and vet
        id: full_go
        shell: bash
        run: |
          set -Eeuo pipefail
          export GOWORK=off GOPROXY=off GOSUMDB=off GOFLAGS=-mod=vendor GOTOOLCHAIN=local
          validation_failed=0

          sanitize_go_log() {
            sed -E \
              's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1<redacted>@#g; s#([[:alnum:]_.-]+):[^@[:space:]]+@tcp#\1:<redacted>@tcp#g; s#(postgres(ql)?://)[^:/@[:space:]]+:[^@/[:space:]]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g; s#(/home/runner/[^ ]*)#<runner-path>#g'
          }

          emit_test_failure() {
            python3 - "$1" <<'PY' | sanitize_go_log
          import json
          import sys

          events = []
          with open(sys.argv[1], encoding="utf-8", errors="replace") as stream:
              for raw in stream:
                  try:
                      events.append(json.loads(raw))
                  except json.JSONDecodeError:
                      continue

          failures = [event for event in events if event.get("Action") == "fail"]
          failed_packages = sorted({event.get("Package", "") for event in failures if event.get("Package")})
          named = {}
          for event in failures:
              package = event.get("Package", "")
              test = event.get("Test", "")
              if package and test:
                  named.setdefault(package, set()).add(test)

          if not failures:
              print("No structured Go test failure event found; final raw diagnostics:")
              for event in events[-120:]:
                  if event.get("Action") == "output":
                      print(event.get("Output", "").rstrip())
          for package in failed_packages:
              tests = sorted(named.get(package, set()))
              print(f"FAILED PACKAGE: {package}")
              if tests:
                  for test in tests:
                      print(f"FAILED TEST: {test}")
                  selected = []
                  for event in events:
                      if event.get("Package") != package or event.get("Action") != "output":
                          continue
                      test = event.get("Test", "")
                      if not test or any(
                          test == failure or test.startswith(failure + "/") or failure.startswith(test + "/")
                          for failure in tests
                      ):
                          selected.append(event.get("Output", "").rstrip())
                  for output in selected[-260:]:
                      if output:
                          print(output)
              else:
                  print("No named test event; package output follows:")
                  selected = [
                      event.get("Output", "").rstrip()
                      for event in events
                      if event.get("Package") == package and event.get("Action") == "output"
                  ]
                  for output in selected[-260:]:
                      if output:
                          print(output)
          PY
          }

          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-go-test-${label}.jsonl"
            if (cd "$d" && go test -json -p=1 ./... -count=1) >"$log" 2>&1; then
              echo "PASS: full Go tests for $d"
            else
              status=$?
              echo "FAIL: full Go tests for $d (exit $status); failing test names and associated diagnostics:"
              emit_test_failure "$log"
              validation_failed=1
            fi
          done

          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-go-build-${label}.log"
            if (cd "$d" && go build -p=3 ./...) >"$log" 2>&1; then
              echo "PASS: full Go build for $d"
            else
              status=$?
              echo "FAIL: full Go build for $d (exit $status); sanitized diagnostics:"
              tail -n 140 "$log" | sanitize_go_log
              validation_failed=1
            fi
          done

          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-go-vet-${label}.log"
            if (cd "$d" && go vet -p=3 ./...) >"$log" 2>&1; then
              echo "PASS: full Go vet for $d"
            else
              status=$?
              echo "FAIL: full Go vet for $d (exit $status); sanitized diagnostics:"
              tail -n 140 "$log" | sanitize_go_log
              validation_failed=1
            fi
          done

          if (( validation_failed != 0 )); then
            echo "One or more Go test/build/vet checks failed; all modules and check types were still executed."
            exit 1
          fi
          echo "All three Go modules passed full tests, build, and vet."
      - name: Database migration, billing, task settlement, and artifact metadata matrix
        if: ${{ always() && steps.go_vendor.outcome == 'success' && steps.offline_graph.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          export GOWORK=off GOPROXY=off GOSUMDB=off GOFLAGS=-mod=vendor GOTOOLCHAIN=local
          matrix_failed=0

          sanitize_db_log() {
            sed -E \
              's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1<redacted>@#g; s#([[:alnum:]_.-]+):[^@[:space:]]+@tcp#\1:<redacted>@tcp#g; s#(postgres(ql)?://)[^:/@[:space:]]+:[^@/[:space:]]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g; s#(/home/runner/[^ ]*)#<runner-path>#g'
          }

          run_quiet() {
            label="$1"; shift
            log="/tmp/tokenway-db-matrix-$(printf '%s' "$label" | tr ' /' '__').log"
            if "$@" >"$log" 2>&1; then
              echo "PASS: $label"
            else
              status=$?
              echo "FAIL: $label (exit $status); sanitized diagnostics:"
              {
                grep -E -B 3 -A 14 '(^--- FAIL:|^FAIL[[:space:]]|Error Trace:|Test:[[:space:]]|panic:|fatal error:|^# )' "$log" || true
                tail -n 80 "$log"
              } | sanitize_db_log
              matrix_failed=1
            fi
          }

          run_quiet "schema migration compatibility" go test ./model -run '^TestMigrationSchemaStability$' -count=1
          run_quiet "fixed-price billing database matrix" go test ./service -run '^TestFixedPriceBillingDatabaseMatrix$' -count=1
          run_quiet "wallet cache and opening balance regressions" go test ./model -run 'TestWalletDeltaPreservesReservationsAcrossUserCacheSchemaRefresh|TestBackfillWalletOpeningBalances' -count=1
          run_quiet "task settlement and capture on MySQL" env TEST_TASK_DB_DIALECT=mysql go test ./controller -run 'TestImmediateTaskSettlementDatabase|TestTaskArtifactCaptureClaimUsesFreshLeasePerSerialItem' -count=1
          run_quiet "task settlement and capture on PostgreSQL" env TEST_TASK_DB_DIALECT=postgres go test ./controller -run 'TestImmediateTaskSettlementDatabase|TestTaskArtifactCaptureClaimUsesFreshLeasePerSerialItem' -count=1
          run_quiet "task artifact metadata on MySQL" env TEST_TASK_DB_DIALECT=mysql go test ./service -run '^TestTaskArtifactMetadataDatabaseDialectRoundTrip$' -count=1
          run_quiet "task artifact metadata on PostgreSQL" env TEST_TASK_DB_DIALECT=postgres go test ./service -run '^TestTaskArtifactMetadataDatabaseDialectRoundTrip$' -count=1

          if (( matrix_failed != 0 )); then
            echo "One or more database matrix checks failed; all independent checks were still executed."
            exit 1
          fi
          echo "All database matrix checks passed."


      - name: Clean Docker Compose install and health smoke
        if: success()
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .env.ci <<'EOF'
          TOKENWAY_ENV_FILE=.env.ci
          TOKENWAY_VERSION=1.0.0-rc.52
          TOKENWAY_BIND_ADDRESS=127.0.0.1
          TOKENWAY_HOST_PORT=3000
          POSTGRES_USER=tokenway
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=tokenway_ci
          REDIS_PASSWORD=ci-redis-password
          SESSION_SECRET=ci-only-not-production-secret-0123456789abcdef
          SESSION_COOKIE_SECURE=false
          TRUSTED_PROXIES=127.0.0.1,::1
          TASK_ARTIFACT_STORE_MODE=upstream
          EOF
          cleanup() {
            docker compose --env-file .env.ci down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f .env.ci
          }
          trap cleanup EXIT
          docker compose --env-file .env.ci config --quiet
          grep -q 'dockerfile: Dockerfile' docker-compose.yml
          ! grep -q 'calciumion/new-api:latest' docker-compose.yml
          if ! docker compose --env-file .env.ci up -d --build --wait --wait-timeout 300; then
            docker compose --env-file .env.ci ps -a || true
            docker compose --env-file .env.ci logs --no-color --tail=200 || true
            exit 1
          fi
          curl --retry 15 --retry-delay 2 --retry-connrefused --fail --silent --show-error \
            http://127.0.0.1:3000/api/status | tee /tmp/tokenway-api-status.json
          grep -q '"success":true' /tmp/tokenway-api-status.json
          echo "PASS: TokenWay source Dockerfile build, PostgreSQL/Redis startup, application health, and API status."

      - name: Package exact validated first-launch source
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0"
          test "$(git -C private rev-parse HEAD)" = "36d78757e948500a4970017915f29abb3aaa233a"
          test "$(cat source/VERSION)" = "1.0.0-rc.52"
          test "$(go version | awk '{print $3}')" = "go1.26.10"
          test "$(bun --version)" = "1.4.4"
          test -s source/web/dist/index.html
          test -s source/docker-compose.yml
          test -s source/Dockerfile
          grep -q 'go build -pgo=off' source/Dockerfile
          test -s source/.env.production.example
          test -s source/docs/TOKENWAY-AI-DEPLOYMENT.md
          grep -q 'dockerfile: Dockerfile' source/docker-compose.yml
          ! grep -q 'calciumion/new-api:latest' source/docker-compose.yml
          test -s source/vendor/modules.txt
          test -s source/relaykit/vendor/modules.txt
          test -s source/tokenkit/vendor/modules.txt
          find source -type d -name node_modules -prune -exec rm -rf {} +
          rm -rf source/.git
          cat > source/TOKENWAY-FIRST-LAUNCH.md <<'EOF'
          # TokenWay RC52 — first-launch package

          ## Fixed source identity
          - Product version: 1.0.0-rc.52
          - New API upstream: QuantumNous/new-api
          - Upstream commit: 48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0
          - TokenWay integration/validation pin: shanghailaofashi001/tokenway-v11-dev@36d78757e948500a4970017915f29abb3aaa233a

          ## First-launch features retained
          - New API's native channel, model, API-key, group, usage and admin capabilities.
          - Kuaipao AI text upstream presets: Claude Messages and OpenAI Chat Completions; Responses remains restricted to explicitly verified model IDs.
          - One RMB customer wallet, durable ledger, request/token/task/subscription billing, refund idempotency, recovery journal and unknown-upstream-outcome review.
          - Personal WeChat/Alipay QR top-up submission with administrator review; no automatic credit based only on a static QR code.
          - S3-compatible task artifact storage, ownership checks, retention, expiry notice and cleanup; default upstream mode remains available when S3 is not configured.
          - Creator image/video workspace, MiniMax media adapter support and legacy task artifact retrieval/download.

          ## Keep out of the first launch
          - Automatic official WeChat Pay/Alipay merchant settlement.
          - Full user file manager with sharing/recycle-bin features.
          - Additional upstream provider pools and failover.
          - Advanced upstream cost/retail reconciliation dashboards and expanded operations analytics.
          These remain post-launch scope; they are not required to turn on the first-launch configuration.

          ## Minimal deployment
          1. Copy .env.production.example to .env; set unique PostgreSQL and Redis passwords, a strong random SESSION_SECRET, the public SESSION_COOKIE_TRUSTED_URL, and trusted proxy addresses.
          2. Put the service behind the deployment's TLS reverse proxy; retain the Compose default localhost-only bind unless the reverse proxy is intentionally colocated differently.
          3. Configure Kuaipao channel credentials and only the models/protocols actually enabled by that account. Do not enable unverified Responses models.
          4. Configure and verify an S3-compatible bucket (endpoint, bucket, region, access key, secret, prefix, read/write/delete/range access and lifecycle policy) before production media use. The production environment template selects S3 and must not be used with placeholder credentials. upstream mode is only a temporary development fallback; it does not provide durable TokenWay artifact retention after provider URLs expire.
          5. Configure the personal QR image URLs and review manual recharge submissions in the admin UI. Do not claim automated merchant settlement.
          6. Back up PostgreSQL and the .env file before the first production migration. Verify a restore before relying on production data.

          The automated validation package includes Go/frontend/database tests and a clean Docker Compose startup smoke. Live Kuaipao, a real S3 bucket, production payment accounts, production backup/restore and a real VPS/domain deployment still require deployment-specific credentials and infrastructure.
          EOF
          (
            cd source
            find . -type f ! -name 'TOKENWAY-SOURCE-MANIFEST.sha256' -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > TOKENWAY-SOURCE-MANIFEST.sha256
          )
          mkdir -p release-output
          cp source/TOKENWAY-SOURCE-MANIFEST.sha256 release-output/TOKENWAY-RC52-SOURCE-MANIFEST.sha256
          (
            cd source
            zip -qr ../release-output/TOKENWAY-RC52-FIRST-LAUNCH-VALIDATED.zip .
          )
          unzip -tq release-output/TOKENWAY-RC52-FIRST-LAUNCH-VALIDATED.zip
          sha256sum release-output/TOKENWAY-RC52-FIRST-LAUNCH-VALIDATED.zip \
            > release-output/TOKENWAY-RC52-FIRST-LAUNCH-VALIDATED.zip.sha256
          cat > release-output/TOKENWAY-RC52-FIRST-LAUNCH-VALIDATION.md <<EOF
          # TokenWay RC52 first-launch validation

          - Workflow run: $GITHUB_RUN_ID
          - Product version: 1.0.0-rc.52
          - New API upstream: 48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0
          - TokenWay integration pin: $(git -C private rev-parse HEAD)
          - Go: $(go version)
          - Bun: $(bun --version)

          ## Successful gates in this same workflow run
          - Full Go tests, build and vet: root module, relaykit and tokenkit.
          - Frontend typecheck, Vitest tests and production build.
          - MySQL 8.4 and PostgreSQL 16 migration/billing/task/artifact metadata regression matrix.
          - Docker image build and clean Compose startup with PostgreSQL, Redis and application health check.
          - Exact source pin checks, generated frontend distribution check, vendored Go module manifests and ZIP integrity.

          ## Not covered by this automated run
          - Live Kuaipao account/model/usage reconciliation.
          - Real S3 bucket credentials, lifecycle policy and byte-for-byte staging checks.
          - Production merchant payment credentials/webhooks.
          - Production VPS, public domain/TLS, reverse proxy and backup/restore rehearsal.

          This package is a validated first-launch source candidate, not proof of a live production deployment. Do not point validation or migration tests at production data.
          EOF
          (
            cd release-output
            sha256sum TOKENWAY-RC52-SOURCE-MANIFEST.sha256 TOKENWAY-RC52-FIRST-LAUNCH-VALIDATION.md \
              > TOKENWAY-RC52-RELEASE-SIDECARS.sha256
          )
          echo "PASS: exact tested source packaged; ZIP, manifest and validation report generated."

      - name: Confirm source package remains runner-local
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s release-output/TOKENWAY-RC52-FIRST-LAUNCH-VALIDATED.zip
          test -s release-output/TOKENWAY-RC52-FIRST-LAUNCH-VALIDATED.zip.sha256
          echo "PASS: validated source package exists only in the ephemeral runner workspace; no public artifact is uploaded."

# Manual validation refresh: force the pinned Go 1.26.10 full validation workflow to run.
