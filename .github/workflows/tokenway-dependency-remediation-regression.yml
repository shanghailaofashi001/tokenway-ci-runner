name: TokenWay frontend dependency-remediation regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tokenway-dependency-remediation-regression.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: tokenway-dependency-remediation-regression
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare cleaned dependency-remediated frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download remediated web and restore exact repository fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p candidate/TokenWay-V11/web original/source
          curl --fail --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14766199131/zip" -o /tmp/remediated-web.zip
          unzip -tq /tmp/remediated-web.zip
          unzip -q /tmp/remediated-web.zip -d candidate/TokenWay-V11/web
          rm -rf candidate/TokenWay-V11/web/node_modules
          curl --fail --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14741328440/zip" -o /tmp/original-source.tar.gz
          tar -tzf /tmp/original-source.tar.gz >/dev/null
          tar -xzf /tmp/original-source.tar.gz -C original/source
          fixture="$(find original/source -type f -path '*/pkg/billingexpr/testdata/frontend_simulation.json' -print -quit)"
          test -n "$fixture"
          mkdir -p candidate/TokenWay-V11/pkg/billingexpr/testdata
          cp "$fixture" candidate/TokenWay-V11/pkg/billingexpr/testdata/frontend_simulation.json
          test -s candidate/TokenWay-V11/web/package.json
          test -s candidate/TokenWay-V11/web/bun.lock
          test -s candidate/TokenWay-V11/pkg/billingexpr/testdata/frontend_simulation.json
      - uses: actions/upload-artifact@v4
        with:
          name: tokenway-v11-dependency-remediated-web
          path: candidate/TokenWay-V11/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 5
  regression:
    name: Frontend ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: TypeScript typecheck after dependency fixes
            command: typecheck
          - label: Full unit suite after dependency fixes
            command: test
          - label: Production build after dependency fixes
            command: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokenway-v11-dependency-remediated-web
          path: candidate/TokenWay-V11
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ubuntu-bun-remediated-1.4.4-${{ hashFiles('candidate/TokenWay-V11/web/bun.lock') }}
          restore-keys: |
            ubuntu-bun-remediated-1.4.4-
      - name: Install exact remediated lockfile
        working-directory: candidate/TokenWay-V11/web
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v24.10.0"
          test "$(bun --version)" = "1.4.4"
          bun install --frozen-lockfile
      - name: Run isolated regression task
        working-directory: candidate/TokenWay-V11/web
        run: bun run "${{ matrix.command }}"
