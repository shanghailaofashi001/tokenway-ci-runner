name: TokenWay V11 frontend parallel validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - tokenway-frontend-parallel-validation
    paths:
      - .github/workflows/tokenway-frontend-parallel-validation.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: tokenway-frontend-parallel-validation
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare exact TokenWay source candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the preserved TokenWay V11 source artifact with retry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p base-artifact
          curl --fail --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 900 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14741328440/zip" \
            -o /tmp/tokenway-source-artifact.zip
          if tar -tzf /tmp/tokenway-source-artifact.zip >/dev/null 2>&1; then
            cp /tmp/tokenway-source-artifact.zip base-artifact/TokenWay-V11-Kuaipao-migrated.tar.gz
          elif unzip -tq /tmp/tokenway-source-artifact.zip >/dev/null 2>&1; then
            unzip -q /tmp/tokenway-source-artifact.zip -d base-artifact
          else
            file /tmp/tokenway-source-artifact.zip
            xxd -l 32 /tmp/tokenway-source-artifact.zip
            echo "Downloaded artifact is neither a tar.gz source archive nor a ZIP artifact wrapper." >&2
            exit 1
          fi
          test -s base-artifact/TokenWay-V11-Kuaipao-migrated.tar.gz

      - name: Extract source and apply the homepage AI Chat entry
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s base-artifact/TokenWay-V11-Kuaipao-migrated.tar.gz
          mkdir -p candidate
          tar -xzf base-artifact/TokenWay-V11-Kuaipao-migrated.tar.gz -C candidate
          python3 - <<'PY'
          from pathlib import Path

          p = Path('candidate/TokenWay-V11/web/src/features/home/tokenway-landing.tsx')
          s = p.read_text(encoding='utf-8')

          old_import = "import { ArrowRight, AudioLines, Code2, Play, Rocket } from 'lucide-react'"
          new_import = "import { ArrowRight, AudioLines, Code2, MessageCircle, Play, Rocket } from 'lucide-react'"
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif new_import not in s:
              raise SystemExit('Unexpected lucide-react import; refusing an unsafe patch')

          for old, new in (
              ("explore: '探索模型',\n        begin: '开始创作',",
               "explore: '探索模型',\n        aiChat: 'AI聊天',\n        begin: '开始创作',"),
              ("explore: 'Explore Models',\n        begin: 'Start Creating',",
               "explore: 'Explore Models',\n        aiChat: 'AI Chat',\n        begin: 'Start Creating',"),
          ):
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Expected language-label anchor not found: {old!r}')

          if "to='/playground'" not in s:
              hero_anchor = "<div className='mt-11 flex flex-wrap gap-5'>"
              if s.count(hero_anchor) != 1:
                  raise SystemExit('Homepage hero CTA container is missing or ambiguous')
              hero_start = s.index(hero_anchor)
              creator = s.find("to='/creator'", hero_start)
              if creator < 0:
                  raise SystemExit('Homepage creator CTA not found after hero container')
              link_start = s.rfind("<Link", hero_start, creator)
              if link_start < 0:
                  raise SystemExit('Creator CTA Link element not found')
              line_start = s.rfind("\\n", 0, link_start) + 1
              indent = s[line_start:link_start]
              if not indent.isspace():
                  raise SystemExit('Unexpected creator CTA indentation')
              chat_link = (
                  indent + "<Link\\n"
                  + indent + "  to='/playground'\\n"
                  + indent + "  className='inline-flex h-[60px] min-w-[212px] items-center justify-center gap-3 rounded-full border border-violet-300/75 bg-[linear-gradient(110deg,rgba(75,54,170,0.55),rgba(30,52,122,0.65))] px-8 text-[17px] font-bold text-white shadow-[inset_0_0_16px_rgba(139,92,246,0.12)] transition hover:bg-violet-500/20'\\n"
                  + indent + ">\\n"
                  + indent + "  <MessageCircle className='size-5' />\\n"
                  + indent + "  {labels.aiChat}\\n"
                  + indent + "</Link>\\n"
              )
              s = s[:line_start] + chat_link + s[line_start:]


          required = (
              "MessageCircle",
              "aiChat: 'AI聊天'",
              "aiChat: 'AI Chat'",
              "to='/playground'",
              "to='/pricing'",
              "to='/creator'",
          )
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit(f'Homepage AI Chat patch verification failed: {missing}')
          p.write_text(s, encoding='utf-8')
          print('PASS: bilingual AI Chat CTA added between Explore Models and Start Creating')
          PY
          test -s candidate/TokenWay-V11/web/package.json
          test -s candidate/TokenWay-V11/web/bun.lock
          test -s candidate/TokenWay-V11/web/src/routeTree.gen.ts

      - name: Upload isolated source candidate for independent jobs
        uses: actions/upload-artifact@v4
        with:
          name: tokenway-v11-frontend-candidate
          path: candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  frontend:
    name: Frontend ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: typecheck
            label: TypeScript typecheck
            command: typecheck
          - id: test
            label: Unit tests
            command: test
          - id: lint
            label: Oxlint
            command: lint
          - id: build
            label: Production build
            command: build
    steps:
      - name: Download isolated source candidate
        uses: actions/download-artifact@v4
        with:
          name: tokenway-v11-frontend-candidate
          path: candidate

      - name: Set up Node.js 24.10.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ubuntu-bun-1.4.4-${{ hashFiles('candidate/TokenWay-V11/web/bun.lock') }}
          restore-keys: |
            ubuntu-bun-1.4.4-

      - name: Verify toolchain and install frozen dependencies
        working-directory: candidate/TokenWay-V11/web
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v24.10.0"
          test "$(bun --version)" = "1.4.4"
          bun install --frozen-lockfile

      - name: Run isolated frontend validation task
        working-directory: candidate/TokenWay-V11/web
        shell: bash
        run: |
          set -Eeuo pipefail
          bun run "${{ matrix.command }}"
