name: TokenWay autonomous CI watchdog

on:
  workflow_run:
    workflows:
      - TokenWay Finance R7 — full V11 validation on public runner
      - TokenWay self-healing security and regression matrix
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: tokenway-autonomous-watchdog-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage failed validation and perform bounded infrastructure recovery
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect failed run evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual watchdog run: provide a failed run id in the run summary if needed."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/tokenway-watchdog"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVENT_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/tokenway-watchdog/jobs.json"
          jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- " + .name + " — " + (.conclusion // "unknown") + " (job " + (.id|tostring) + ")"' "$RUNNER_TEMP/tokenway-watchdog/jobs.json" > "$RUNNER_TEMP/tokenway-watchdog/failed-jobs.txt"
          gh run view "$EVENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/tokenway-watchdog/failed.log" 2>&1 || true
          {
            echo "workflow=$EVENT_WORKFLOW"
            echo "run_id=$EVENT_RUN_ID"
            echo "attempt=$EVENT_RUN_ATTEMPT"
            echo "conclusion=$EVENT_CONCLUSION"
            echo "url=$EVENT_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Failed jobs:"
          cat "$RUNNER_TEMP/tokenway-watchdog/failed-jobs.txt" || true
          echo "Failure log collected (not copied wholesale into an issue)."

      - name: Retry one time only for recognizable transient infrastructure failures
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/tokenway-watchdog/failed.log"
          if grep -Eqi 'HTTP (429|500|502|503|504)|rate limit exceeded|connection reset by peer|TLS handshake timeout|i/o timeout|temporary failure in name resolution|runner lost communication|The hosted runner unexpectedly lost communication' "$log"; then
            echo "Recognized transient infrastructure signature; retrying failed jobs once."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
          else
            echo "No safe transient-infrastructure signature; no automatic retry."
          fi

      - name: Open deduplicated failure report for human review
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -Eeuo pipefail
          title="CI triage: $RUN_NAME run $RUN_ID"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Existing tracking issue: #$existing"
            exit 0
          fi
          jobs="$(jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- " + .name + ": " + (.conclusion // "unknown")' "$RUNNER_TEMP/tokenway-watchdog/jobs.json")"
          body="$(printf 'The unattended watchdog detected a non-success validation run.\n\n- Workflow: %s\n- Run: %s\n- Attempt: %s\n- Conclusion: %s\n- Run URL: %s\n\n## Failed or cancelled jobs\n%s\n\nThe watchdog retries only a narrow set of recognizable transient infrastructure failures, at most once. It does not automatically edit finance, payment, settlement, authentication, secrets, or brand source code. Review the failed step logs and apply a targeted root-cause fix before resuming validation.\n' "$RUN_NAME" "$RUN_ID" "$RUN_ATTEMPT" "$RUN_CONCLUSION" "$RUN_URL" "${jobs:-No failed job summary available}")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"

      - name: Publish watchdog result
        if: always()
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          {
            echo "## TokenWay unattended watchdog"
            echo
            echo "- Monitored run: ${RUN_URL:-manual invocation}"
            echo "- Run ID: ${RUN_ID:-not supplied}"
            echo "- Automatic retry: limited to recognized transient infrastructure failures, maximum one retry."
            echo "- Source edits: deliberately disabled; sensitive application changes require review."
          } >> "$GITHUB_STEP_SUMMARY"
