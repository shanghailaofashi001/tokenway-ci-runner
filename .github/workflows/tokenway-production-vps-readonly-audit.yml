name: TokenWay production VPS read-only audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-production-vps-readonly-audit.yml"
permissions:
  contents: read
concurrency:
  group: tokenway-production-vps-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_HOST: ${{ secrets.TOKENWAY_PROD_SSH_HOST }}
      PROD_USER: ${{ secrets.TOKENWAY_PROD_SSH_USER }}
      PROD_PORT: ${{ secrets.TOKENWAY_PROD_SSH_PORT }}
      PROD_SSH_KEY: ${{ secrets.TOKENWAY_PROD_SSH_PRIVATE_KEY }}
      PROD_KNOWN_HOSTS: ${{ secrets.TOKENWAY_PROD_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.TOKENWAY_PROD_DEPLOY_PATH }}
    steps:
      - name: Validate pinned SSH inputs without revealing values
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          set +x
          missing=()
          [[ -n "$PROD_HOST" ]] || missing+=("TOKENWAY_PROD_SSH_HOST")
          [[ -n "$PROD_USER" ]] || missing+=("TOKENWAY_PROD_SSH_USER")
          [[ "$PROD_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$PROD_PORT >= 1 && 10#$PROD_PORT <= 65535)) || missing+=("TOKENWAY_PROD_SSH_PORT")
          [[ -n "$PROD_SSH_KEY" ]] || missing+=("TOKENWAY_PROD_SSH_PRIVATE_KEY")
          [[ -n "$PROD_KNOWN_HOSTS" ]] || missing+=("TOKENWAY_PROD_SSH_KNOWN_HOSTS")
          if (("${#missing[@]}" > 0)); then
            echo "Production VPS audit blocked; missing secret names (values not read):"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi
          echo "Pinned SSH inputs are present; proceeding with read-only inventory."

      - name: Inspect production VPS through pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          set +x
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/tokenway_prod_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tokenway_prod_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/tokenway_prod_key"' EXIT
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          ssh -i "$HOME/.ssh/tokenway_prod_key" -p "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$PROD_USER@$PROD_HOST" bash -s -- "$DEPLOY_PATH_B64" <<'REMOTE'
          set -u
          DEPLOY_PATH="$(printf '%s' "$1" | base64 -d)"
          echo "=== HOST ==="
          hostname
          uname -srm
          echo "=== CPU / MEMORY / SWAP ==="
          nproc 2>/dev/null || true
          free -h 2>/dev/null || true
          swapon --show 2>/dev/null || true
          echo "=== DISK ==="
          df -hT / 2>/dev/null || true
          df -i / 2>/dev/null || true
          echo "=== TOKENWAY DEPLOYMENT PATHS ==="
          for p in /opt/tokenway /opt/tokenway/current /opt/tokenway/releases; do
            if [ -e "$p" ]; then stat -c '%A %U:%G %n' "$p"; else echo "MISSING $p"; fi
          done
          if [ -L /opt/tokenway/current ]; then echo "CURRENT_RELEASE=$(readlink -f /opt/tokenway/current)"; fi
          if [ -d /opt/tokenway/releases ]; then find /opt/tokenway/releases -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -10; fi
          if [ -n "$DEPLOY_PATH" ] && [ -d "$DEPLOY_PATH" ]; then
            echo "CONFIGURED_DEPLOY_PATH=present"
            find "$DEPLOY_PATH" -maxdepth 1 -type f -printf '%f\n' | sort | head -60
          elif [ -n "$DEPLOY_PATH" ]; then echo "CONFIGURED_DEPLOY_PATH=missing"; else echo "CONFIGURED_DEPLOY_PATH=not-configured"; fi
          echo "=== ACTIVE SERVICES ==="
          systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei 'tokenway|postgres|mysql|maria|redis|docker|containerd|nginx|caddy' || true
          echo "=== DOCKER ==="
          if command -v docker >/dev/null 2>&1; then
            docker version --format 'client={{.Client.Version}} server={{.Server.Version}}' 2>&1 || true
            docker compose version 2>&1 || true
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1 || true
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' 2>&1 || true
          else echo "docker=missing"; fi
          echo "=== LISTENING TCP PORTS ==="
          ss -lnt 2>/dev/null || true
          echo "=== OOM EVIDENCE ==="
          journalctl -k -b --no-pager 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process' | tail -20 || true
          echo "=== READ-ONLY AUDIT COMPLETE ==="
          echo "No files, databases, services, containers, firewall rules or persistent volumes were changed."
          echo "No environment values, credentials, database contents or private keys were read or printed."
          REMOTE
