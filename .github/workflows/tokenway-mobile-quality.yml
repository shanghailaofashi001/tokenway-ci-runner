name: TokenWay Mobile Quality and iOS Scaffold Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-mobile-quality.yml"

permissions:
  contents: read

concurrency:
  group: tokenway-mobile-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout CI runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout TokenWay mobile source
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: feat/flutter-mobile-app
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: tokenway-source
          persist-credentials: false

      - name: Checkout backend API reference
        uses: actions/checkout@v4
        with:
          repository: QuantumNous/new-api
          path: backend-reference
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native scaffolding and validate bootstrap
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap_platforms.sh
          bash scripts/bootstrap_platforms.sh
          test -s android/app/src/main/AndroidManifest.xml
          test -s ios/Runner/Info.plist
          test -s ios/Podfile
          grep -q 'TokenWay AI' android/app/src/main/AndroidManifest.xml
          grep -q 'TokenWay AI' ios/Runner/Info.plist
          grep -Fq "Image.asset('assets/brand-mark.webp', width: 176" lib/screens/dashboard_screen.dart
          grep -Fq "Image.asset('assets/brand-mark.webp', width: 236" lib/screens/dashboard_screen.dart
          ! grep -q '^const _lavender' lib/screens/dashboard_screen.dart
          if [[ -f android/build.gradle.kts ]]; then grep -Fq 'webview_flutter_android' android/build.gradle.kts; else grep -Fq 'webview_flutter_android' android/build.gradle; fi
          ! grep -Fq '\\n' android/build.gradle.kts 2>/dev/null || exit 1
          ! grep -Fq '\\n' android/build.gradle 2>/dev/null || exit 1

      - name: Resolve dependencies
        working-directory: tokenway-source/mobile
        run: flutter pub get

      - name: Generate official app icons and audit iOS scaffold
        working-directory: tokenway-source/mobile
        run: |
          dart run scripts/prepare_brand_icon.dart
          dart run flutter_launcher_icons
          python3 scripts/validate_ios_scaffold.py

      - name: Analyze Dart source
        working-directory: tokenway-source/mobile
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: tokenway-source/mobile
        run: flutter test --no-pub

      - name: Verify API modules and endpoint contract inventory
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'/api/user/login'" lib/services/tokenway_api.dart
          grep -q "'/api/user/self'" lib/services/tokenway_api.dart
          grep -q "'/api/user/models'" lib/services/tokenway_api.dart
          grep -q "'/pg/chat/completions'" lib/services/tokenway_api.dart
          grep -q "'/api/user/topup/info'" lib/services/tokenway_api.dart
          grep -q "'/api/user/topup/self'" lib/services/tokenway_api.dart
          grep -q "'/api/task/\$encoded/artifacts'" lib/services/tokenway_api.dart
          grep -q "'/api/task/self'" lib/services/tokenway_api.dart
          grep -q "'/api/user/topup'" lib/services/tokenway_api.dart
          grep -q "'/api/user/login/2fa'" lib/services/tokenway_api.dart
          grep -q "'/api/user/auth/logout'" lib/services/tokenway_api.dart
          grep -q 'data is List && data.isNotEmpty' lib/screens/media_screen.dart
          grep -q "envelope\['success'\] == false" lib/screens/media_screen.dart
          grep -q '_imagePrompt' lib/screens/media_screen.dart
          grep -q '_videoPrompt' lib/screens/media_screen.dart
          test -s lib/screens/profile_screen.dart
          grep -q 'ProfileScreen(api: widget.api' lib/screens/dashboard_screen.dart
          grep -q 'tokenWayPageTheme' lib/screens/chat_screen.dart
          grep -q 'tokenWayPageTheme' lib/screens/media_screen.dart
          grep -q 'tokenWayPageTheme' lib/screens/wallet_screen.dart
          grep -q 'tokenWayPageTheme' lib/screens/task_history_screen.dart
          grep -q '_imagePrompt' lib/screens/media_screen.dart
          grep -q '_videoPrompt' lib/screens/media_screen.dart
          grep -q "envelope['success'] == false" lib/screens/media_screen.dart
          ! grep -q 'Colors.white60' lib/screens/chat_screen.dart lib/screens/media_screen.dart lib/screens/wallet_screen.dart lib/screens/task_history_screen.dart
          grep -q 'final body = await _map(response)' lib/services/tokenway_api.dart
          grep -Fq 'taskRoute.GET("/:task_id/artifacts", middleware.UserAuth(), controller.GetDashboardTaskArtifacts)' ../../backend-reference/router/api-router.go
          grep -Fq 'common.ApiSuccess(c, response)' ../../backend-reference/controller/task.go
          grep -Fq "data: {'key': code}" lib/services/tokenway_api.dart
          grep -Fq 'type topUpRequest struct' ../../backend-reference/controller/user.go
          grep -q "'/v1/images/generations'" lib/services/tokenway_api.dart
          grep -q "'/v1/videos'" lib/services/tokenway_api.dart
          grep -q "'/v1/audio/speech'" lib/services/tokenway_api.dart
          test -s lib/screens/login_screen.dart
          test -s lib/screens/chat_screen.dart
          test -s lib/screens/wallet_screen.dart
          test -s lib/screens/media_screen.dart
          test -s lib/screens/task_history_screen.dart
