name: TokenWay Mobile Quality and iOS Scaffold Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-mobile-quality.yml"

permissions:
  contents: read

concurrency:
  group: tokenway-mobile-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout CI runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout TokenWay mobile source
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: feat/flutter-mobile-app
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: tokenway-source
          persist-credentials: false

      - name: Checkout backend API reference
        uses: actions/checkout@v4
        with:
          repository: QuantumNous/new-api
          path: backend-reference
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native scaffolding and validate bootstrap
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap_platforms.sh
          bash scripts/bootstrap_platforms.sh
          test -s android/app/src/main/AndroidManifest.xml
          test -s ios/Runner/Info.plist
          test -s ios/Podfile
          grep -q 'TokenWay AI' android/app/src/main/AndroidManifest.xml
          grep -Fq "Image.asset('assets/brand-mark.webp', width: 176" lib/screens/dashboard_screen.dart
          grep -Fq "Image.asset('assets/brand-mark.webp', width: 234" lib/screens/dashboard_screen.dart
          ! grep -q '^const _lavender' lib/screens/dashboard_screen.dart
          if [[ -f android/build.gradle.kts ]]; then grep -Fq 'webview_flutter_android' android/build.gradle.kts; else grep -Fq 'webview_flutter_android' android/build.gradle; fi
          ! grep -Fq '\\n' android/build.gradle.kts 2>/dev/null || exit 1
          ! grep -Fq '\\n' android/build.gradle 2>/dev/null || exit 1
          test -s test/dashboard_test.dart
          grep -Fq "import 'package:flutter/material.dart';" test/dashboard_test.dart

      - name: Resolve dependencies
        working-directory: tokenway-source/mobile
        run: flutter pub get

      - name: Generate official app icons and audit iOS scaffold
        working-directory: tokenway-source/mobile
        run: |
          dart run scripts/prepare_brand_icon.dart
          dart run flutter_launcher_icons
          python3 scripts/validate_ios_scaffold.py

      - name: Analyze Dart source
        working-directory: tokenway-source/mobile
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: tokenway-source/mobile
        run: flutter test --no-pub

      - name: Verify streaming and screen navigation regression coverage
        working-directory: tokenway-source/mobile
        run: |
          grep -Fq 'void dispatchEvent()' lib/services/tokenway_api.dart
          grep -Fq 'if (pending.isNotEmpty) consumeLine(pending)' lib/services/tokenway_api.dart
          grep -Fq "scrollUntilVisible(find.text('热门模型')" test/dashboard_test.dart
          grep -Fq "ProfileScreen(api: widget.api, language: widget.language)" lib/screens/dashboard_screen.dart
          grep -Fq 'initialTab: 1' lib/screens/dashboard_screen.dart
          grep -Fq 'initialTab: 2' lib/screens/dashboard_screen.dart


# Parallel audit trigger 2026-11-23: mobile platform quality, iOS scaffold, Flutter analysis/tests.
