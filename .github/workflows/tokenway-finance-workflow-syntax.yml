name: TokenWay Finance Workflow Syntax Guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-finance-r7-validation.yml"
      - ".github/workflows/tokenway-finance-workflow-syntax.yml"
      - ".github/workflows/tokenway-v11-windows-desktop-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  validate-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse finance workflow YAML
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "PASS: #{path} is valid YAML" }' .github/workflows/tokenway-finance-r7-validation.yml .github/workflows/tokenway-v11-windows-desktop-release.yml

      - name: Check targeted CNY test step boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tokenway-finance-r7-validation.yml")
          text = path.read_text(encoding="utf-8")
          cny_step = "      - name: Run targeted CNY wallet payment conversion regressions"
          chat_step = "      - name: Apply encrypted cross-device chat history sync backend"
          offline_step = "      - name: Verify offline dependency graph"
          kuaipao_step = "      - name: Run only migrated Kuaipao Go regressions"

          for marker in (cny_step, chat_step, offline_step, kuaipao_step):
              if marker not in text:
                  raise SystemExit(f"FAIL: missing workflow step: {marker}")

          start = text.index(cny_step)
          next_step = text.find("\n      - name:", start + len(cny_step))
          if next_step < 0:
              raise SystemExit("FAIL: CNY test step has no following step boundary")
          block = text[start:next_step]

          if "go test -v -timeout 3m ./controller" not in block:
              raise SystemExit("FAIL: targeted CNY controller test command is missing")
          for test_name in (
              "TestGetNowPaymentsUSDPriceUsesWalletCurrencyExchangeRate",
              "TestGetPayMoneyUsesCNYAsWalletBaseCurrency",
              "TestChatHistorySyncPayloadValidation",
          ):
              if test_name not in block:
                  raise SystemExit(f"FAIL: targeted CNY/chat-sync test missing: {test_name}")
          if "id: offline_graph" in block or "\n      - name:" in block:
              raise SystemExit("FAIL: CNY test step overlaps another workflow step")
          if text.index(chat_step) >= start:
              raise SystemExit("FAIL: encrypted chat-sync patch must precede targeted CNY/chat-sync tests")
          if text.index(offline_step) <= start or text.index(kuaipao_step) <= text.index(offline_step):
              raise SystemExit("FAIL: offline graph and Kuaipao steps are out of order")

          print("PASS: CNY, encrypted chat-sync, and offline dependency checks have distinct step boundaries")
          PY

  dispatch-windows-desktop-release:
    name: Dispatch Windows desktop build from the pinned successful Run 164
    needs: validate-workflow
    if: ${{ needs.validate-workflow.result == 'success' && contains(github.event.head_commit.message, '[resume-run-164]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch standalone Windows release with exact source run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run .github/workflows/tokenway-v11-windows-desktop-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id=45337836586
          echo "PASS: Windows desktop release dispatched from validated source Run 164; source acceptance was not rerun."
