        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, tarfile
          from pathlib import Path
          root=Path.cwd()
          stage=Path(os.environ["RUNNER_TEMP"])/"tokenway-kuaipao-release"
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir(parents=True)
          dest=stage/"TokenWay-V11"
          excluded={".git","node_modules","dist","coverage",".cache",".vite",".tanstack",".turbo",".next",".output","tmp","logs"}
          def ignore(directory,names):
              out=[]
              for name in names:
                  p=Path(directory)/name
                  if p.is_dir() and name in excluded: out.append(name)
                  elif name in {".env",".env.local",".env.production",".env.development"}: out.append(name)
                  elif name.startswith(".env.") and name not in {".env.example",".env.sample",".env.template"}: out.append(name)
                  elif p.is_file() and p.suffix.lower() in {".sqlite",".sqlite3",".db"}: out.append(name)
              return out
          shutil.copytree(root/"source",dest,ignore=ignore,symlinks=True)
          required=[
              "web/src/features/channels/lib/advanced-custom.ts",
              "web/src/features/channels/lib/__tests__/advanced-custom.test.ts",
              "relay/channel/advancedcustom/adaptor_test.go",
              "vendor/modules.txt",
              "relaykit/vendor/modules.txt",
              "tokenkit/vendor/modules.txt",
              "web/src/assets/tokenway-home/hero-scene.webp",
          ]
