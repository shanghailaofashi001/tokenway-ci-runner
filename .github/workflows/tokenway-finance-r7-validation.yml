# Root-cause fix: use gh api to follow the signed artifact redirect, avoiding urllib's 401 on Azure Blob SAS.

# CLI fix: gh api streams binary artifact bytes to stdout; capture with shell redirection (no --output flag).

# Efficiency fix: package-only mode verifies pinned audited manifests and source hashes without rerunning already-passed Bun build, typecheck, unit tests or audit.

