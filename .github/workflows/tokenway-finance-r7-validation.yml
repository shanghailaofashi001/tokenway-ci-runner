          gofmt -w source/internal/testsupport/database.go source/model/test_database_helpers_test.go source/model/wallet_ledger_dialect_test.go source/controller/access_token_audit_test.go source/controller/model_management_test.go
          test -s source/model/test_database_helpers_test.go
