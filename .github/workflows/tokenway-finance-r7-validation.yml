      - name: Package migrated Kuaipao-enabled TokenWay V11 source
        if: ${{ success() && env.TOKENWAY_KUAIPAO_ONLY == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, tarfile
          from pathlib import Path
          root=Path.cwd()
          stage=Path(os.environ["RUNNER_TEMP"])/"tokenway-kuaipao-release"
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir(parents=True)
          dest=stage/"TokenWay-V11"
          excluded={".git","node_modules","dist","coverage",".cache",".vite",".tanstack",".turbo",".next",".output","tmp","logs"}
          def ignore(directory,names):
              out=[]
              for name in names:
                  p=Path(directory)/name
                  if p.is_dir() and name in excluded: out.append(name)
                  elif name in {".env",".env.local",".env.production",".env.development"}: out.append(name)
                  elif name.startswith(".env.") and name not in {".env.example",".env.sample",".env.template"}: out.append(name)
                  elif p.is_file() and p.suffix.lower() in {".sqlite",".sqlite3",".db"}: out.append(name)
              return out
          shutil.copytree(root/"source",dest,ignore=ignore,symlinks=True)
          required=[
              "web/src/features/channels/lib/advanced-custom.ts",
              "web/src/features/channels/lib/__tests__/advanced-custom.test.ts",
              "relay/channel/advancedcustom/adaptor_test.go",
              "vendor/modules.txt",
              "relaykit/vendor/modules.txt",
              "tokenkit/vendor/modules.txt",
              "web/src/assets/tokenway-home/hero-scene.webp",
          ]
          for rel in required:
              p=dest/rel
              if not p.is_file() or p.stat().st_size==0: raise SystemExit(f"missing required migrated package file: {rel}")
          for p in dest.rglob("*"):
              if p.is_symlink():
                  try: target=p.resolve(strict=True)
                  except FileNotFoundError: raise SystemExit(f"broken symlink: {p}")
                  if not target.is_relative_to(dest.resolve()): raise SystemExit(f"external symlink: {p}")
          patch=Path(".tokenway-validation/kuaipao-v11-migration.patch")
          records=[]
          for p in sorted(x for x in dest.rglob("*") if x.is_file()):
              records.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(stage)}")
          (stage/"FILE-CHECKSUMS.sha256").write_text("\n".join(records)+"\n",encoding="utf-8")
          manifest={
              "product":"TokenWay V11",
              "package_type":"Kuaipao-migrated validated source archive",
              "source_commit":"48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0",
              "finance_validation_snapshot":"d1dd4edb3c7491f3e8b786dd455920d2e0fc5dd4",
              "branding_snapshot":"d2494da77bc59b7edb4082bb2a594f24997b6ece",
              "kuaipao_migration_patch_sha256":hashlib.sha256(patch.read_bytes()).hexdigest(),
