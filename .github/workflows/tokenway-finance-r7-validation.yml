        run: |
          set -Eeuo pipefail
          export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOMAXPROCS=1 GOFLAGS="-mod=vendor -p=1"
          log_dir="$RUNNER_TEMP/tokenway-go-targeted-logs"
          mkdir -p "$log_dir"
          : > "$log_dir/summary.txt"
          : > "$log_dir/failures.txt"
          mysql_db="tokenway_targeted"
          pg_db="tokenway_targeted"
          failed=0

          prepare_databases() {
            mysql --protocol=TCP -h127.0.0.1 -uroot -ptokenway-test -e "DROP DATABASE IF EXISTS \`$mysql_db\`; CREATE DATABASE \`$mysql_db\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            PGPASSWORD=tokenway-test psql -h127.0.0.1 -Utokenway -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$pg_db\" WITH (FORCE)" -c "CREATE DATABASE \"$pg_db\""
            export TEST_MYSQL_DSN="root:tokenway-test@tcp(127.0.0.1:3306)/$mysql_db?charset=utf8mb4&parseTime=True&loc=Local"
            export TEST_MYSQL_LOG_DSN="$TEST_MYSQL_DSN"
            export TEST_FIXED_MYSQL_DSN="$TEST_MYSQL_DSN"
            export TEST_FIXED_MYSQL_LOG_DSN="$TEST_MYSQL_DSN"
            export TEST_POSTGRES_DSN="postgres://tokenway:tokenway-test@127.0.0.1:5432/$pg_db?sslmode=disable"
            export TEST_POSTGRES_LOG_DSN="$TEST_POSTGRES_DSN"
            export TEST_FIXED_POSTGRES_DSN="$TEST_POSTGRES_DSN"
            export TEST_FIXED_POSTGRES_LOG_DSN="$TEST_POSTGRES_DSN"
          }

          # Run #50 passed every targeted package except router. Keep this retry
          # focused; a manual/full run still exercises the original package set.
          if [[ "${TOKENWAY_ROUTER_ONLY:-false}" == "true" ]]; then
            packages=(github.com/QuantumNous/new-api/router)
          else
            packages=(
              github.com/QuantumNous/new-api/router
              github.com/QuantumNous/new-api/controller
              github.com/QuantumNous/new-api/model
              github.com/QuantumNous/new-api/relay
              github.com/QuantumNous/new-api/service
            )
          fi
          for pkg in "${packages[@]}"; do
            echo "TARGETED RETEST: $pkg"
            prepare_databases
            logfile="$log_dir/${pkg##*/}.jsonl"
            if timeout --signal=TERM --kill-after=30s 17m go test -json -timeout 15m -parallel=1 -count=1 "$pkg" > "$logfile" 2>&1; then
              echo "PASS: $pkg" | tee -a "$log_dir/summary.txt"
            else
              status=$?
              echo "FAIL: $pkg (exit $status)" | tee -a "$log_dir/failures.txt" "$log_dir/summary.txt"
              echo "---- targeted failure diagnostics: $pkg ----"
              grep -E '"Action":"fail"|--- FAIL:|^FAIL|panic:|Error Trace:|Error:|no such table|database is locked|timed out|deadlock' "$logfile" | tail -n 100 || tail -n 100 "$logfile"
          if [[ "$pkg" == "github.com/QuantumNous/new-api/router" ]]; then
            python3 - "$logfile" <<'PY'
          import json, sys
          target = "TestAccessTokenRouteRulesCoverEveryDashboardRoute"
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("Test") == target and event.get("Action") == "output":
                  print("ROUTE-ASSERTION:", event.get("Output", "").rstrip())
          PY
          fi
              failed=1
            fi
          done

          # Run #50 passed both auxiliary modules; they are not part of a
          # router-only retry and remain included in a manual/full run.
          if [[ "${TOKENWAY_ROUTER_ONLY:-false}" == "true" ]]; then
            echo "SKIP: relaykit and tokenkit passed run #50 and were not changed."
          else
            for module in relaykit tokenkit; do
              prepare_databases
              logfile="$log_dir/$module.log"
              echo "MODULE TESTS: $module"
              if (cd "$module" && timeout --signal=TERM --kill-after=30s 22m go test -mod=vendor -p=2 -count=1 ./...) > "$logfile" 2>&1; then
                echo "PASS: $module full test suite" | tee -a "$log_dir/summary.txt"
              else
                status=$?
                echo "FAIL: $module full test suite (exit $status)" | tee -a "$log_dir/failures.txt" "$log_dir/summary.txt"
                tail -n 120 "$logfile" || true
                failed=1
              fi
            done
          fi

          echo "Targeted Go summary:"
          cat "$log_dir/summary.txt"
          if [ "$failed" -ne 0 ]; then
            echo "Targeted Go validation still has failures."
            exit 1
          fi
          echo "All previously failed root packages and both remaining modules passed."
      - name: Set up Bun 1.4.4
        if: ${{ env.TOKENWAY_GO_STATIC_ONLY != 'true' && env.TOKENWAY_PACKAGE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bun_dir="$RUNNER_TEMP/bun-1.4.4"
          bun_zip="$RUNNER_TEMP/bun-linux-x64.zip"
          mkdir -p "$bun_dir"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip" -o "$bun_zip"
          python3 - "$bun_zip" "$bun_dir" <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          archive, destination = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as bundle:
              candidates = [name for name in bundle.namelist() if name == "bun" or name.endswith("/bun")]
              if len(candidates) != 1:
                  raise SystemExit(f"expected one Bun executable in release archive, found {candidates}")
              target = os.path.join(destination, "bun")
              with bundle.open(candidates[0]) as source, open(target, "wb") as output:
                  shutil.copyfileobj(source, output)
          os.chmod(target, os.stat(target).st_mode | 0o111)
          link = os.path.join(destination, "bunx")
          if not os.path.exists(link):
              os.symlink("bun", link)
          print(f"Installed Bun executable: {target}")
          PY
          echo "$bun_dir" >> "$GITHUB_PATH"
          "$bun_dir/bun" --version
          test "$("$bun_dir/bun" --version)" = "1.4.4"

