          install -D private/.tokenway-patches/service/request_billing_recovery_test.go source/service/request_billing_recovery_test.go
          # The recovery CAS uses updated_at (last activity), not created_at.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/service/request_billing_recovery_test.go")
          source = path.read_text(encoding="utf-8")
          old = 'Update("created_at", now-301)'
          new = 'Update("updated_at", now-model.RequestBillingUnknownOutcomeStaleAfterSeconds-1)'
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one stale unknown-outcome fixture anchor, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("PASS: unknown-outcome fixture ages the last-activity timestamp past the R7 grace period.")
          PY
          grep -Fq 'Update("updated_at", now-model.RequestBillingUnknownOutcomeStaleAfterSeconds-1)' source/service/request_billing_recovery_test.go
          install -D private/.tokenway-patches/service/funding_source.go source/service/funding_source.go
          # The pinned R7 billing_session.go uses these SubscriptionFunding sequence fields.
          # Preserve the retry-safe wallet funding helper and merge the subscription sequence state required by the pinned R7 BillingSession.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("source/service/funding_source.go")
          source = path.read_text(encoding="utf-8")
          import re
          pattern = re.compile(r"(\tPlanId\s+int\n\tPlanTitle\s+string\n)(})")
          updated, count = pattern.subn(
              r"\1\treserveSeq        int\n\tlastReserveSeq    int\n\tlastReserveAmount int\n\2",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"expected exactly one SubscriptionFunding field block, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY
          grep -Fq 'reserveSeq        int' source/service/funding_source.go
          grep -Fq 'lastReserveSeq    int' source/service/funding_source.go
          grep -Fq 'lastReserveAmount int' source/service/funding_source.go
