          \t}
          }"""
          new = """func NormalizeBillingPreference(_ string) string {
          \treturn "wallet_only"
          }"""
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one billing preference implementation, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Wallet-only billing preference policy applied.")
          PY
          grep -Fq 'func NormalizeBillingPreference(_ string) string' source/common/str.go
          grep -Fq 'return "wallet_only"' source/common/str.go
