          subprocess.run(["tar","-tzf",str(archive)],check=True,stdout=subprocess.DEVNULL)
          print(f"PACKAGE_READY: {archive}")
          print(f"PACKAGE_SIZE_BYTES: {archive.stat().st_size}")
          print(f"PACKAGE_SHA256: {hashlib.sha256(archive.read_bytes()).hexdigest()}")
          print(f"SOURCE_FILES: {len(records)}")
