              "product": "TokenWay V11",
              "package_type": "validated source archive",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": {
                  "repository": "QuantumNous/new-api",
                  "commit": source_sha,
              },
              "finance_r7": {
                  "private_validation_repository": "shanghailaofashi001/tokenway-v11-dev",
                  "private_snapshot_commit": private_sha,
                  "migration_patch_sha256": patch_sha,
              },
              "branding": {
                  "repository": "shanghailaofashi001/tokenway-v11-dev",
                  "snapshot_commit": brand_sha,
                  "homepage_hero_asset": "web/src/assets/tokenway-home/hero-scene.webp",
                  "original_brand_media_preserved": True,
              },
              "desktop": {
                  "product_name": "TokenWay V11",
                  "version": "11.0.0",
                  "application_id": "com.tokenway.ai.desktop",
                  "electron_entry": "electron/main.js",
                  "windows_backend_binary": "tokenway-v11.exe",
                  "windows_backend_resource": "bin/tokenway-v11.exe",
                  "windows_targets": ["nsis", "portable"],
                  "original_tokenway_t_mark_used_for_icons": True,
                  "windows_installer_is_code_signed": False,
              },
              "frontend_dependencies": dependency_hashes,
              "build_environment": {
                  "go_version": subprocess.check_output(["go", "version"], text=True).strip(),
                  "vendored_modules": [
                      "TokenWay-V11/vendor",
                      "TokenWay-V11/relaykit/vendor",
                      "TokenWay-V11/tokenkit/vendor",
                  ],
              },
              "contents": {
                  "source_file_count": len(file_records),
                  "git_metadata_included": False,
                  "node_modules_included": False,
                  "generated_frontend_dist_included": False,
                  "local_env_and_database_files_included": False,
              },
              "validation_runs": verified_runs,
              "limitations": [
                  "No live merchant payment credentials or production settlement endpoints were used; live provider acceptance is not claimed."
              ],
              "packaging_workflow": {
                  "repository": repository,
                  "commit": os.environ["GITHUB_SHA"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              },
          }
          (stage / "RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          evidence = [
              "# TokenWay V11 — validation evidence",
              "",
              "This archive combines one pinned source assembly with the successful validation runs listed below.",
              "",
              "| Run | Result | Verified scope |",
              "|---|---|---|",
          ]
          for item in verified_runs:
              evidence.append(
                  f"| #{item['run_number']} ({item['url']}) | PASS | {item['coverage']} |"
              )
          evidence += [
              "",
              "## Source provenance",
              "",
              f"- Upstream source: QuantumNous/new-api@{source_sha}",
              f"- Finance/R7 validation snapshot: shanghailaofashi001/tokenway-v11-dev@{private_sha}",
              f"- Branding snapshot: shanghailaofashi001/tokenway-v11-dev@{brand_sha}",
              f"- R7 migration patch SHA-256: {patch_sha}",
              "",
              "## Package contents",
              "",
              "- Complete assembled application source under TokenWay-V11/.",
              "- Vendored Go dependencies for the root, relaykit and tokenkit modules.",
              "- Preserved TokenWay homepage media and original branding assets.",
              "- FILE-CHECKSUMS.sha256 contains SHA-256 checksums for every packaged source file.",
              "- Git metadata, local environment files, local databases, node_modules and generated frontend output are excluded.",
              "",
              "## Acceptance boundary",
              "",
              "The listed CI runs passed their stated checks. This is a source bundle, not a claim that production merchant accounts, real payment callbacks, live chain settlement or provider refunds were exercised with merchant credentials.",
              "",
          ]
          (stage / "VALIDATION-EVIDENCE.md").write_text(
              "\n".join(evidence), encoding="utf-8"
          )

          readme = [
              "# TokenWay V11 source package",
              "",
              "The complete assembled source is in TokenWay-V11/.",
              "",
              "This archive contains the R7 finance source changes, the preserved TokenWay brand/homepage assets, and vendored Go dependencies for all three Go modules.",
              "",
              "Extract and build/deploy on the target Linux server. The archive intentionally omits Git history, local secrets, database files, frontend node_modules and generated build output.",
              "",
              "Read the source tree README and VALIDATION-EVIDENCE.md before deployment. Review RELEASE-MANIFEST.json for exact pinned revisions and run references.",
              "",
          ]
          (stage / "PACKAGE-README.md").write_text("\n".join(readme), encoding="utf-8")

          archive = Path(os.environ["RUNNER_TEMP"]) / "TokenWay-V11-validated-source.tar.gz"
          if archive.exists():
              archive.unlink()
          subprocess.run(["tar", "-czf", str(archive), "-C", str(stage), "."], check=True)
          subprocess.run(["tar", "-tzf", str(archive)], check=True, stdout=subprocess.DEVNULL)

          archive_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive_size = archive.stat().st_size
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## TokenWay V11 source archive\n\n")
              out.write("- File: TokenWay-V11-validated-source.tar.gz\n")
              out.write(f"- Size: {archive_size} bytes\n")
              out.write(f"- SHA-256: {archive_sha}\n")
              out.write(f"- Source files: {len(file_records)}\n")
              out.write("- Verified prior acceptance runs: #66, #67, #68, #69 (all success)\n")
              out.write("- Verified security matrix #14 and final merged frontend checks: PASS\\n")
              out.write(f"- Security candidate artifact SHA-256: {dependency_hashes['security_artifact_sha256']}\\n")
          print(f"PACKAGE_READY: {archive}")
          print(f"PACKAGE_SIZE_BYTES: {archive_size}")
          print(f"PACKAGE_SHA256: {archive_sha}")
          PY

      - name: Upload validated TokenWay V11 source archive
        if: ${{ success() && env.TOKENWAY_PACKAGE_ONLY == 'true' && env.TOKENWAY_TARGETED_ONLY != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/TokenWay-V11-validated-source.tar.gz
          archive: false
          retention-days: 30
# [resume-full-go] targeted package continuation marker
# parallel verification trigger 2026-11-23
# second dispatch marker for the independent finance and deployment validation lane

# Package-only follow-up: all four pinned acceptance runs were independently re-verified; ensure this workflow revision includes the validated-source packaging and upload steps.
