      - name: Upload Kuaipao-migrated TokenWay V11 source archive
        if: ${{ success() && env.TOKENWAY_KUAIPAO_ONLY == 'true' && env.TOKENWAY_TARGETED_ONLY != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/TokenWay-V11-Kuaipao-migrated.tar.gz
          archive: false
          retention-days: 30

      - name: Download audited dependency artifact through GitHub CLI
        if: ${{ success() && env.TOKENWAY_PACKAGE_ONLY == 'true' && env.TOKENWAY_TARGETED_ONLY != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifact="${RUNNER_TEMP}/tokenway-dependency-candidate.zip"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/14768211653/zip" > "${artifact}"
          test -s "${artifact}"
          echo "Downloaded audited dependency artifact via authenticated GitHub CLI."
          sha256sum "${artifact}"

      - name: Verify prior acceptance and package the validated TokenWay V11 source
        if: ${{ success() && env.TOKENWAY_PACKAGE_ONLY == 'true' && env.TOKENWAY_TARGETED_ONLY != 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOKENWAY_ARTIFACT_READ_TOKEN: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import shutil
          import subprocess
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          token = os.environ.get("TOKENWAY_ARTIFACT_READ_TOKEN") or os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          api = f"https://api.github.com/repos/{repository}/actions/runs"

          expected_runs = [
              {
                  "label": "Media and strict changed-file checks",
                  "id": 44977866912,
                  "run_number": 66,
                  "head_sha": "ff5f52621ddc3802f6e7ec6bd5a44dfc293f3bda",
                  "coverage": "Changed-file Oxlint, formatting/copyright checks, 31 media-plugin assertions and 15 media-adapter safety assertions."
              },
              {
                  "label": "Full frontend verification",
                  "id": 44977979157,
                  "run_number": 67,
                  "head_sha": "0d6cb692354d17dc8f51e62cf0dc143973b28dc2",
                  "coverage": "Frontend production build, TypeScript typecheck, unit tests, strict changed-file Oxlint, formatting/copyright and retained media contracts."
              },
              {
                  "label": "Go regression and frontend regression",
                  "id": 44982871496,
                  "run_number": 68,
                  "head_sha": "221e90e255b6bb0fc45cbe5fcd5207e3310e356a",
                  "coverage": "Full package tests for router, controller, model, relay and service; full relaykit and tokenkit module tests; isolated tiered settlement regression; frontend checks."
              },
              {
                  "label": "Go static analysis and build",
                  "id": 44988366194,
                  "run_number": 69,
                  "head_sha": "dc110fab4b5502a02504761c24603fa5d5e1275c",
                  "coverage": "go vet ./... and go build ./... for root, relaykit and tokenkit; fresh vendoring and offline dependency graph."
              },
              {
                  "label": "Latest full V11 integrated validation",
                  "id": 45072900288,
                  "run_number": 106,
                  "head_sha": "6c4c93d6653d50f24fce36d45687e16cd4be3e00",
                  "coverage": "Latest integrated assembly and patch application; finance controller/model/service regressions; Go vet/build and remaining Go module tests; frontend build, typecheck, unit tests, Oxlint, format/copyright checks; retained media contract tests."
              },
          ]

          verified_runs = []
          for spec in expected_runs:
              req = urllib.request.Request(
                  f"{api}/{spec['id']}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  actual = json.load(response)
              checks = {
                  "id": actual.get("id") == spec["id"],
                  "workflow": actual.get("workflow_id") == 426185745,
                  "path": actual.get("path") == ".github/workflows/tokenway-finance-r7-validation.yml",
                  "branch": actual.get("head_branch") == "main",
                  "event": actual.get("event") == "push",
                  "sha": actual.get("head_sha") == spec["head_sha"],
                  "status": actual.get("status") == "completed",
                  "conclusion": actual.get("conclusion") == "success",
                  "run_number": actual.get("run_number") == spec["run_number"],
              }
              if not all(checks.values()):
                  raise SystemExit(
                      f"Refusing to package: acceptance run #{spec['run_number']} "
                      f"did not pass verification: {checks}"
                  )
              spec["url"] = actual["html_url"]
              spec["commit_message"] = actual.get("head_commit", {}).get("message", "")
              verified_runs.append(spec)
              print(f"VERIFIED: run #{spec['run_number']} {spec['label']}")

          security_spec = {
              "label": "Final dependency candidate — full unit, typecheck, build and zero-vulnerability audit",
              "id": 45058146919,
              "run_number": 14,
              "head_sha": "49ba8888927fcef84a9e4f0de05025ffbc9ee79d",
              "workflow_id": 427040078,
              "path": ".github/workflows/tokenway-dependency-security-matrix.yml",
              "coverage": "Full unit suite, TypeScript typecheck, production build, and bun audit with zero vulnerabilities across 1252 packages."
          }
          req = urllib.request.Request(
              f"{api}/{security_spec['id']}",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              security_run = json.load(response)
          security_checks = {
              "id": security_run.get("id") == security_spec["id"],
              "workflow": security_run.get("workflow_id") == security_spec["workflow_id"],
              "path": security_run.get("path") == security_spec["path"],
              "branch": security_run.get("head_branch") == "main",
              "event": security_run.get("event") == "push",
              "sha": security_run.get("head_sha") == security_spec["head_sha"],
              "status": security_run.get("status") == "completed",
              "conclusion": security_run.get("conclusion") == "success",
              "run_number": security_run.get("run_number") == security_spec["run_number"],
          }
          if not all(security_checks.values()):
              raise SystemExit(f"Refusing secure package: dependency acceptance run did not pass: {security_checks}")
          jobs_req = urllib.request.Request(
              f"{api}/{security_spec['id']}/jobs?per_page=100",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
          )
          with urllib.request.urlopen(jobs_req, timeout=30) as response:
              security_jobs = json.load(response).get("jobs", [])
          if not security_jobs or any(j.get("status") != "completed" or j.get("conclusion") != "success" for j in security_jobs):
              raise SystemExit(f"Refusing secure package: dependency matrix jobs not all successful: {[(j.get('name'), j.get('status'), j.get('conclusion')) for j in security_jobs]}")
          security_spec["url"] = security_run["html_url"]
          security_spec["commit_message"] = security_run.get("head_commit", {}).get("message", "")
          verified_runs.append(security_spec)
          print("VERIFIED: final dependency candidate matrix — all jobs passed")

          artifact_id = 14768211653
          artifact_path = Path(os.environ["RUNNER_TEMP"]) / "tokenway-dependency-candidate.zip"
          if not artifact_path.is_file() or artifact_path.stat().st_size == 0:
              raise SystemExit("Audited dependency artifact download is missing or empty.")
          artifact_bytes = artifact_path.read_bytes()
          artifact_sha = hashlib.sha256(artifact_bytes).hexdigest()
          expected_artifact_sha = "c46bf6ae656fc8afc08464344b4f051cbdda975e6567103efbc37a1232b5da90"
          if artifact_sha != expected_artifact_sha:
              raise SystemExit(f"Security dependency artifact digest mismatch: {artifact_sha}")
          with zipfile.ZipFile(io.BytesIO(artifact_bytes)) as zf:
              names = set(zf.namelist())
              if names != {"package.json", "bun.lock"}:
                  raise SystemExit(f"Unexpected security artifact contents: {sorted(names)}")
              candidate_package_bytes = zf.read("package.json")
              candidate_lock_bytes = zf.read("bun.lock")
          candidate_package = json.loads(candidate_package_bytes)
          source_web = root / "source/web"
          source_package_path = source_web / "package.json"
          source_lock_path = source_web / "bun.lock"
          source_package = json.loads(source_package_path.read_text(encoding="utf-8"))
          candidate_base = dict(candidate_package)
          candidate_overrides = candidate_base.pop("overrides", {})
          source_base = dict(source_package)
          source_base.pop("overrides", None)
          if candidate_base != source_base:
              raise SystemExit("Security candidate package.json differs from pinned V11 package metadata outside overrides; refusing unsafe lockfile merge.")
          expected_overrides = {"@hono/node-server": "2.1.6", "decode-uri-component": "0.5.1", "minimatch": "11.0.1", "zod": "4.6.6"}
          if any(candidate_overrides.get(k) != v for k, v in expected_overrides.items()):
              raise SystemExit(f"Security candidate overrides do not match audited matrix: {candidate_overrides}")
          source_package_path.write_bytes(candidate_package_bytes)
          source_lock_path.write_bytes(candidate_lock_bytes)
          dependency_hashes = {
              "package_json_sha256": hashlib.sha256(candidate_package_bytes).hexdigest(),
              "bun_lock_sha256": hashlib.sha256(candidate_lock_bytes).hexdigest(),
              "security_artifact_sha256": artifact_sha,
              "security_artifact_id": artifact_id,
              "security_audit": "PASS — no vulnerabilities found (1252 packages)",
          }
          print("MERGED: audited package.json and bun.lock into pinned complete V11 source")
          web_dir = source_web
          if not source_lock_path.is_file() or source_lock_path.stat().st_size == 0:
              raise SystemExit("Refusing to package: audited bun.lock is missing after the verified dependency merge.")
          if hashlib.sha256(source_package_path.read_bytes()).hexdigest() != dependency_hashes["package_json_sha256"]:
              raise SystemExit("Refusing to package: merged package.json changed after dependency artifact verification.")
          if hashlib.sha256(source_lock_path.read_bytes()).hexdigest() != dependency_hashes["bun_lock_sha256"]:
              raise SystemExit("Refusing to package: merged bun.lock changed after dependency artifact verification.")
          print("PASS: exact audited dependency manifests merged; build/typecheck/unit/audit were already passed by the pinned security matrix and are not rerun in package-only mode.")

          def git_head(folder):
              return subprocess.check_output(
                  ["git", "-C", str(root / folder), "rev-parse", "HEAD"],
                  text=True
              ).strip()

          source_sha = git_head("source")
          private_sha = git_head("private")
          brand_sha = git_head("private-validation")
          expected = {
              "source": "48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0",
              "private": "5666d4fb1a67ff545300d8ea943dcec39cec5b17",
              "brand": "d2494da77bc59b7edb4082bb2a594f24997b6ece",
          }
          actual = {"source": source_sha, "private": private_sha, "brand": brand_sha}
          if actual != expected:
              raise SystemExit(f"Refusing to package unexpected source revisions: {actual}")

          required = [
              "source/go.mod",
              "source/web/package.json",
              "source/web/src/assets/tokenway-home/hero-scene.webp",
              "source/vendor/modules.txt",
              "source/relaykit/go.mod",
              "source/relaykit/vendor/modules.txt",
              "source/tokenkit/go.mod",
              "source/tokenkit/vendor/modules.txt",
              ".tokenway-validation/R7-finance-migration.patch.b64",
          ]
          for item in required:
              path = root / item
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required source/package input missing or empty: {item}")

          stage = Path(os.environ["RUNNER_TEMP"]) / "tokenway-v11-release"
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)
          destination = stage / "TokenWay-V11"

          excluded_dirs = {
              ".git", "node_modules", "dist", "coverage", ".cache", ".vite",
              ".tanstack", ".turbo", ".next", ".output", "tmp", "logs",
          }
          env_examples = {".env.example", ".env.sample", ".env.template"}
          excluded_env = {".env", ".env.local", ".env.production", ".env.development"}
          excluded_db_suffixes = {".sqlite", ".sqlite3", ".db"}

          def ignore(directory, names):
              rejected = []
              for name in names:
                  full = Path(directory) / name
                  if full.is_dir() and name in excluded_dirs:
                      rejected.append(name)
                  elif name in excluded_env:
                      rejected.append(name)
                  elif name.startswith(".env.") and name not in env_examples:
                      rejected.append(name)
                  elif name == ".DS_Store" or name.endswith(".log"):
                      rejected.append(name)
                  elif full.is_file() and Path(name).suffix.lower() in excluded_db_suffixes:
                      rejected.append(name)
              return rejected

          shutil.copytree(root / "source", destination, ignore=ignore, symlinks=True)

          for rel in [
              "vendor/modules.txt",
              "relaykit/vendor/modules.txt",
              "tokenkit/vendor/modules.txt",
              "web/src/assets/tokenway-home/hero-scene.webp",
              "web/package.json",
              "go.mod",
          ]:
              if not (destination / rel).is_file():
                  raise SystemExit(f"Packaged source is missing required file: {rel}")

          for path in destination.rglob("*"):
              if path.is_symlink():
                  try:
                      resolved = path.resolve(strict=True)
                  except FileNotFoundError:
                      raise SystemExit(f"Broken symlink in source bundle: {path.relative_to(destination)}")
                  if not resolved.is_relative_to(destination.resolve()):
                      raise SystemExit(f"External symlink in source bundle: {path.relative_to(destination)}")

          patch_path = root / ".tokenway-validation/R7-finance-migration.patch.b64"
          patch_sha = hashlib.sha256(patch_path.read_bytes()).hexdigest()
          file_records = []
          for path in sorted(p for p in destination.rglob("*") if p.is_file()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              file_records.append(f"{digest}  {path.relative_to(stage)}")
          (stage / "FILE-CHECKSUMS.sha256").write_text(
              "\n".join(file_records) + "\n", encoding="utf-8"
          )

