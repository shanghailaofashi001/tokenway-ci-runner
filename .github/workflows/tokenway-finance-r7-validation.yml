  build-windows-desktop:
    name: Build and smoke-test TokenWay V11 Windows desktop installer
    needs: validate
    if: ${{ needs.validate.result == 'success' && (github.event_name == 'push' || (github.event.inputs.targeted_only != 'true' && github.event.inputs.go_module_scope == 'all')) }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: false

      - name: Set up Go 1.26.10
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.10"
          cache: false

      - name: Download the exact source archive produced by this acceptance run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'tokenway-source-artifact'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name tokenway-v11-validated-source --dir $download
          $archive = Join-Path $download 'TokenWay-V11-validated-source.tar.gz'
          if (-not (Test-Path $archive)) { throw "Same-run validated source archive is missing: $archive" }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "TOKENWAY_SOURCE_ARCHIVE_SHA256=$hash" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'source-archive.sha256') -Encoding ascii
          $root = Join-Path $env:RUNNER_TEMP 'tokenway-desktop-source'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar -xzf $archive -C $root
          $project = Join-Path $root 'TokenWay-V11'
          if (-not (Test-Path (Join-Path $project 'electron/package.json'))) { throw 'Extracted source does not contain the Electron project.' }
          "TOKENWAY_SOURCE_ROOT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_ARCHIVE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Install and checksum-verify Bun 1.4.4 for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-windows-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'bun-windows-x64.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = 'cd2c0fccc78f3ede1f50ca827a15f063eda13d4d150a3d0674f4f6e323d864a5'
          if ($actual -ne $expected) { throw "Bun archive checksum mismatch: $actual" }
          $bunDir = Join-Path $env:RUNNER_TEMP 'bun-1.4.4'
          Expand-Archive -Path $zip -DestinationPath $bunDir -Force
          $bunExe = Get-ChildItem -Path $bunDir -Filter bun.exe -Recurse | Select-Object -First 1
          if (-not $bunExe) { throw 'Bun executable was not found in the verified archive.' }
          Copy-Item $bunExe.FullName (Join-Path $bunDir 'bun.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bunDir
          $env:PATH = "$bunDir;$env:PATH"
          $version = (& (Join-Path $bunDir 'bun.exe') --version).Trim()
          if ($version -ne '1.4.4') { throw "Expected Bun 1.4.4, found $version" }
          Write-Host "Verified Bun $version ($actual)"

      - name: Build frontend from the validated TokenWay source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:TOKENWAY_SOURCE_ROOT 'web')
          $env:DISABLE_ESLINT_PLUGIN = 'true'
          $env:VITE_REACT_APP_VERSION = '11.0.0'
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "bun install failed with exit code $LASTEXITCODE" }
          bun run build
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:TOKENWAY_SOURCE_ROOT 'web/dist/index.html'))) { throw 'Frontend build output is missing.' }

      - name: Build the Windows TokenWay V11 backend binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:TOKENWAY_SOURCE_ROOT
          $env:CGO_ENABLED = '0'
          $env:GOFLAGS = '-mod=vendor'
          go version
          go build -pgo=vendor/github.com/Calcium-Ion/moejs/default.pgo -trimpath -ldflags='-s -w -X github.com/QuantumNous/new-api/common.Version=11.0.0' -o tokenway-v11.exe .
          if ($LASTEXITCODE -ne 0) { throw "Go Windows build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:TOKENWAY_SOURCE_ROOT 'tokenway-v11.exe'))) { throw 'Windows backend binary was not produced.' }

      - name: Package NSIS installer and portable Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:TOKENWAY_SOURCE_ROOT 'electron')
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }
          node --check main.js
          node --check preload.js
          npm run build:win
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }
          $dist = Join-Path (Get-Location) 'dist'
          $executables = @(Get-ChildItem -Path $dist -Filter '*.exe' -File)
          if ($executables.Count -lt 2) { throw "Expected NSIS installer and portable executable; found $($executables.Count)." }
          $installer = $executables | Where-Object { $_.Name -match '(?i)Setup.*\.exe
 } | Select-Object -First 1
          if (-not $installer) { throw "NSIS setup executable not found among: $($executables.Name -join ', ')" }
          $portable = $executables | Where-Object { $_.FullName -ne $installer.FullName } | Select-Object -First 1
          if (-not $portable) { throw 'Portable executable is missing.' }
          "TOKENWAY_INSTALLER=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TOKENWAY_PORTABLE=$($portable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-FileHash -Algorithm SHA256 $installer.FullName
          Get-FileHash -Algorithm SHA256 $portable.FullName

      - name: Silently install and launch the packaged Windows desktop app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerProcess = Start-Process -FilePath $env:TOKENWAY_INSTALLER -ArgumentList '/S' -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "NSIS installer exited with code $($installerProcess.ExitCode)" }
          $roots = @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles)
          $installed = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $installed = Get-ChildItem -Path $root -Filter 'TokenWay V11.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($installed) { break }
            }
          }
          if (-not $installed) { throw 'Installed TokenWay V11.exe was not found in the per-user or Program Files application directory.' }
          $resource = Join-Path $installed.Directory.FullName 'resources/bin/tokenway-v11.exe'
          if (-not (Test-Path $resource)) {
            $resource = Join-Path $installed.Directory.Parent.FullName 'resources/bin/tokenway-v11.exe'
          }
          if (-not (Test-Path $resource)) { throw 'Installed backend resource bin/tokenway-v11.exe is missing.' }
          $env:APPDATA = $env:APPDATA
          $appProcess = Start-Process -FilePath $installed.FullName -PassThru
          $connected = $false
          for ($i = 0; $i -lt 90; $i++) {
            $client = [System.Net.Sockets.TcpClient]::new()
            try {
              $client.Connect('127.0.0.1', 3000)
              $connected = $client.Connected
            } catch {
              $connected = $false
            } finally {
              $client.Dispose()
            }
            if ($connected) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $connected) {
            if ($appProcess -and -not $appProcess.HasExited) { taskkill /PID $appProcess.Id /T /F | Out-Null }
            throw 'TokenWay desktop app did not start its embedded backend on 127.0.0.1:3000 within 90 seconds.'
          }
          $database = Join-Path $env:APPDATA 'TokenWay V11/data/tokenway-v11.db'
          if (-not (Test-Path $database)) {
            if ($appProcess -and -not $appProcess.HasExited) { taskkill /PID $appProcess.Id /T /F | Out-Null }
            throw "TokenWay user database was not created at the expected isolated path: $database"
          }
          $dbInfo = Get-Item $database
          if ($dbInfo.Length -le 0) { throw 'TokenWay database exists but is empty.' }
          $report = @(
            'PASS: NSIS installer completed silently with exit code 0',
            "PASS: installed Electron executable: $($installed.FullName)",
            "PASS: installed backend resource: $resource",
            'PASS: packaged app launched the local backend on 127.0.0.1:3000',
            "PASS: isolated database created: $database ($($dbInfo.Length) bytes)",
            "App process PID: $($appProcess.Id)"
          )
          $report | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'WINDOWS-DESKTOP-SMOKE-TEST.txt') -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }
          if ($appProcess -and -not $appProcess.HasExited) { taskkill /PID $appProcess.Id /T /F | Out-Null }

      - name: Prepare checksums and desktop acceptance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'tokenway-v11-windows-desktop-release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $env:TOKENWAY_INSTALLER $out
          Copy-Item $env:TOKENWAY_PORTABLE $out
          Copy-Item (Join-Path $env:RUNNER_TEMP 'WINDOWS-DESKTOP-SMOKE-TEST.txt') $out
          $hashes = Get-ChildItem $out -Filter '*.exe' | Get-FileHash -Algorithm SHA256
          $hashes | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content (Join-Path $out 'SHA256SUMS.txt')
          $sourceHash = Get-Content (Join-Path $env:RUNNER_TEMP 'source-archive.sha256') -Raw
          @(
            '# TokenWay V11 Windows desktop acceptance',
            '',
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Source archive SHA-256: $sourceHash",
            "Installer: $(Split-Path -Leaf $env:TOKENWAY_INSTALLER)",
            "Portable: $(Split-Path -Leaf $env:TOKENWAY_PORTABLE)",
            '',
            'The NSIS installer was installed silently and the installed Electron app launched its bundled Go backend on 127.0.0.1:3000. The isolated per-user SQLite file was verified.',
            'The Windows executables are not code-signed; production distribution should sign them with the distributor certificate.'
          ) | Set-Content (Join-Path $out 'WINDOWS-ACCEPTANCE.md')
          "Desktop package hashes and acceptance evidence prepared." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "TOKENWAY_WINDOWS_RELEASE_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows installer, portable executable and smoke-test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenway-v11-windows-desktop
          path: ${{ runner.temp }}/tokenway-v11-windows-desktop-release/
          if-no-files-found: error
          retention-days: 30

