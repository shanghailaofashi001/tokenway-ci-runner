          grep -Fq 'reserveSeq        int' source/service/funding_source.go
          # Keep the recovery implementation from the pinned R7 finance patch.
          grep -Fq 'const requestBillingUnknownOutcomeGrace' source/service/request_billing_recovery.go
          grep -Fq 'SettleRequestBillingWithTokenQuota' source/service/request_billing_recovery.go
          grep -Fq 'RefundRequestBillingWithTokenQuota' source/service/request_billing_recovery.go
          grep -Fq 'MarkRequestBillingReviewIfStale' source/service/request_billing_recovery.go
          python3 - <<'PY'
          from pathlib import Path
          path = Path("source/common/str.go")
          source = path.read_text(encoding="utf-8")
          old = """func NormalizeBillingPreference(pref string) string {
          \tswitch strings.TrimSpace(pref) {
          \tcase "subscription_first", "wallet_first", "subscription_only", "wallet_only":
          \t\treturn strings.TrimSpace(pref)
          \tdefault:
