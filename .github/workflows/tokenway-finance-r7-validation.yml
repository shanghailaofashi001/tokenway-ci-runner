          (stage/"FILE-CHECKSUMS.sha256").write_text("\n".join(records)+"\n",encoding="utf-8")
          manifest={
              "product":"TokenWay V11",
              "package_type":"Kuaipao-migrated validated source archive",
              "source_commit":"48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0",
              "finance_validation_snapshot":"5666d4fb1a67ff545300d8ea943dcec39cec5b17",
              "branding_snapshot":"d2494da77bc59b7edb4082bb2a594f24997b6ece",
              "kuaipao_migration_patch_sha256":hashlib.sha256(patch.read_bytes()).hexdigest(),
              "kuaipao_channels":["kuaipao_anthropic","kuaipao_openai_chat","kuaipao_openai_responses"],
              "focused_tests":{
                  "go":"TestKuaipaoPresetRoutesJoinBaseURLWithoutDuplicateV1; TestKuaipaoModelListManagementRoutesJoinBaseURLAndUseBearerAuth",
                  "frontend":"Kuaipao Advanced Custom templates"
              },
              "source_file_count":len(records),
              "contains_vendored_go_dependencies":True,
              "contains_original_tokenway_brand_assets":True,
              "secrets_or_database_files_included":False,
              "live_upstream_credentials_tested":False,
              "packaging_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "packaging_run_number":int(os.environ["GITHUB_RUN_NUMBER"]),
          }
          (stage/"RELEASE-MANIFEST.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (stage/"PACKAGE-README.md").write_text(
              "# TokenWay V11 — Kuaipao migrated source\n\n"
