      - name: Verify Go formatting on all changed and added files
        if: ${{ env.TOKENWAY_FRONTEND_VERIFY != 'true' && env.TOKENWAY_LINT_ONLY != 'true' && env.TOKENWAY_KUAIPAO_FRONTEND_ONLY != 'true' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <({ git diff --name-only -- '*.go'; git ls-files --others --exclude-standard -- '*.go'; } | sort -u)
          if (("${#go_files[@]}")); then
            gofmt -w "${go_files[@]}"
          fi
          mapfile -t go_files < <({ git diff --name-only -- '*.go'; git ls-files --others --exclude-standard -- '*.go'; } | sort -u)
          if (("${#go_files[@]}")); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\n%s\n' "$unformatted"
