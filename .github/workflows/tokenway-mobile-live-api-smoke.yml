name: TokenWay Mobile Live API Reachability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-mobile-live-api-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check TokenWay API DNS, TLS and public status endpoint
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/tokenway-api-status.json"
          http_code="$(curl --silent --show-error --max-time 20 --output "$status_file" --write-out '%{http_code}' https://api.tokenway.cc/api/status)"
          if [[ "$http_code" != "200" ]]; then
            echo "TokenWay API status endpoint returned HTTP $http_code"
            exit 1
          fi
          python3 - "$status_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              payload = json.load(f)
          if not isinstance(payload, dict):
              raise SystemExit("API status response is not a JSON object")
          print("TokenWay API DNS/TLS/HTTP reachability: OK")
          print("JSON envelope keys:", ", ".join(sorted(payload.keys())))
          PY
