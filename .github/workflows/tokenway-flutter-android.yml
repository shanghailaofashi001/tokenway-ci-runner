name: TokenWay Flutter Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-flutter-android.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: tokenway-flutter-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CI runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout TokenWay mobile source
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: feat/flutter-mobile-app
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: tokenway-source
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform projects
        working-directory: tokenway-source/mobile
        shell: bash
        run: bash scripts/bootstrap_platforms.sh

      - name: Verify original TokenWay brand asset is retained
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/brand-mark.webp.b64
          grep -q "assets/brand-mark.webp" lib/screens/login_screen.dart

      - name: Verify mobile API and chat modules are present
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'/api/user/self'" lib/services/tokenway_api.dart
          grep -q "'/api/user/models'" lib/services/tokenway_api.dart
          grep -q "'/pg/chat/completions'" lib/services/tokenway_api.dart
          test -s lib/screens/chat_screen.dart
          grep -q "'/api/user/topup/info'" lib/services/tokenway_api.dart
          grep -q "'/api/user/topup/self'" lib/services/tokenway_api.dart
          test -s lib/screens/wallet_screen.dart
          grep -q 'AppLanguageController' lib/language.dart
          grep -q 'Switch to Chinese' lib/screens/dashboard_screen.dart
          test -s lib/screens/media_screen.dart
          test -s lib/screens/task_history_screen.dart
          grep -Fq "'/api/task/\$encoded/artifacts'" lib/services/tokenway_api.dart
          grep -q 'url_launcher' pubspec.yaml
          grep -q "session_id" lib/main.dart
          grep -q "'/api/user/auth/refresh'" lib/services/tokenway_api.dart
          grep -q 'TokenWay AI' scripts/bootstrap_platforms.sh
          grep -q 'turnstile_site_key' lib/screens/login_screen.dart
          test -s lib/widgets/turnstile_challenge.dart
          grep -q 'webview_flutter' pubspec.yaml
          grep -q 'GlobalMaterialLocalizations.delegate' lib/main.dart
          grep -q 'LoginScreen(api: widget.api' lib/screens/dashboard_screen.dart
          test -s assets/brand-mark.webp.b64
          grep -q "'/v1/images/generations'" lib/services/tokenway_api.dart
          grep -q "'/v1/videos'" lib/services/tokenway_api.dart
          grep -q "'/v1/audio/speech'" lib/services/tokenway_api.dart

      - name: Resolve dependencies
        working-directory: tokenway-source/mobile
        run: flutter pub get

      - name: Generate Android and iOS launcher icons
        working-directory: tokenway-source/mobile
        run: dart run flutter_launcher_icons

      - name: Analyze Dart source
        working-directory: tokenway-source/mobile
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: tokenway-source/mobile
        run: flutter test --no-pub

      - name: Build Android APK
        working-directory: tokenway-source/mobile
        run: flutter build apk --release --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tokenway-android-apk
          path: tokenway-source/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish build status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success'
              ? 'success'
              : process.env.JOB_STATUS === 'cancelled'
                ? 'error'
                : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'tokenway/flutter-android',
              description: 'Flutter analyze, tests and Android APK build',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
