name: TokenWay Flutter Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-flutter-android.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: tokenway-flutter-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CI runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout TokenWay mobile source
        uses: actions/checkout@v4
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: feat/flutter-mobile-app
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: tokenway-source
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform projects
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          bash -n scripts/bootstrap_platforms.sh
          bash scripts/bootstrap_platforms.sh
          grep -Fq 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          name = "{http://schemas.android.com/apk/res/android}name"
          if not any(node.attrib.get(name) == "android.permission.INTERNET" for node in root.findall("uses-permission")):
              raise SystemExit("Android INTERNET permission missing from valid manifest XML")
          print("PASS: valid Android manifest includes INTERNET permission.")
          PY
          if [[ -f android/build.gradle.kts ]]; then grep -Fq 'webview_flutter_android' android/build.gradle.kts; else grep -Fq 'webview_flutter_android' android/build.gradle; fi

      - name: Verify original TokenWay brand asset is retained
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/brand-mark.webp.b64
          grep -q "assets/brand-mark.webp" lib/screens/login_screen.dart
          grep -Fq "Image.asset('assets/brand-mark.webp'" lib/screens/dashboard_screen.dart
          grep -Fq "Image.asset('assets/brand-mark.webp', width: 176" lib/screens/dashboard_screen.dart
          grep -Fq "fit: BoxFit.contain, alignment: Alignment.centerLeft" lib/screens/dashboard_screen.dart
          ! grep -Fq "fit: BoxFit.fill)))" lib/screens/dashboard_screen.dart
          ! grep -q '^const _lavender' lib/screens/dashboard_screen.dart

      - name: Verify exact official TokenWay brand asset and dimensions
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          encoded = Path("assets/brand-mark.webp.b64").read_text().strip()
          data = base64.b64decode(encoded, validate=True)
          if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("BLOCKED: mobile brand source is not WebP")

          width = height = None
          offset = 12
          while offset + 8 <= len(data):
              kind = data[offset:offset + 4]
              size = int.from_bytes(data[offset + 4:offset + 8], "little")
              chunk = data[offset + 8:offset + 8 + size]
              if kind == b"VP8X" and len(chunk) >= 10:
                  width = 1 + int.from_bytes(chunk[4:7], "little")
                  height = 1 + int.from_bytes(chunk[7:10], "little")
                  break
              if kind == b"VP8 " and len(chunk) >= 10 and chunk[3:6] == bytes((0x9D, 0x01, 0x2A)):
                  width = int.from_bytes(chunk[6:8], "little") & 0x3FFF
                  height = int.from_bytes(chunk[8:10], "little") & 0x3FFF
                  break
              if kind == b"VP8L" and len(chunk) >= 5 and chunk[0] == 0x2F:
                  width = 1 + chunk[1] + ((chunk[2] & 0x3F) << 8)
                  height = 1 + ((chunk[2] >> 6) | (chunk[3] << 2) | ((chunk[4] & 0x0F) << 10))
                  break
              offset += 8 + size + (size & 1)

          if (width, height) != (225, 60):
              raise SystemExit(
                  f"BLOCKED: unexpected brand source dimensions {width}x{height}; "
                  "expected the verified official website asset 225x60"
              )
          print("Verified official TokenWay website brand source: 225x60")
          PY

      - name: Confirm mobile feature modules are included
        working-directory: tokenway-source/mobile
        run: |
          test -s lib/services/tokenway_api.dart
          test -s lib/screens/chat_screen.dart
          test -s lib/screens/media_screen.dart
          test -s lib/screens/wallet_screen.dart
          test -s lib/screens/task_history_screen.dart
          test -s lib/screens/access_tokens_screen.dart
          grep -Fq "import 'access_tokens_screen.dart';" lib/screens/profile_screen.dart
          grep -Fq "'/api/user/access_tokens/catalog'" lib/services/tokenway_api.dart
          grep -Fq "'/api/user/access_tokens'" lib/services/tokenway_api.dart
          grep -Fq "access token creation obtains operation-bound proof" test/tokenway_api_contract_test.dart
          test -s lib/screens/profile_screen.dart
          test -s test/dashboard_test.dart
          grep -Fq "import 'package:flutter/material.dart';" test/dashboard_test.dart
          test -s test/tokenway_api_contract_test.dart
          grep -Fq 'file_picker:' pubspec.yaml
          grep -Fq 'FilePicker.platform.pickFiles' lib/screens/chat_screen.dart
          grep -Fq 'downloadTaskArtifact' lib/services/tokenway_api.dart
          grep -Fq 'TokenWayDownloads' lib/services/tokenway_api.dart
          grep -Fq "requestNowPaymentsTopup" lib/services/tokenway_api.dart
          grep -Fq "requestSubscriptionEpay" lib/services/tokenway_api.dart
          test -s lib/screens/subscriptions_screen.dart
          test -s lib/screens/payment_webview_screen.dart
          test -s lib/services/chat_history_sync_service.dart
          test -s test/chat_history_sync_service_test.dart
          grep -Fq "PBKDF2-HMAC-SHA256" lib/services/chat_history_sync_service.dart
          grep -Fq "chat-history-sync" lib/services/tokenway_api.dart
          grep -Fq "video submission uses multipart form fields" test/tokenway_api_contract_test.dart
          grep -Fq "chat stream decodes split SSE events" test/tokenway_api_contract_test.dart
          grep -Fq "text/event-stream" test/tokenway_api_contract_test.dart
          grep -Fq "200," test/tokenway_api_contract_test.dart
          grep -Fq "task artifacts decode the backend success/data envelope" test/tokenway_api_contract_test.dart
          test -s lib/widgets/turnstile_challenge.dart
          grep -Fq "_turnstileChallengeGeneration++" lib/screens/login_screen.dart
          grep -Fq "ValueKey(_turnstileChallengeGeneration)" lib/screens/login_screen.dart
          grep -Fq "_refreshTurnstile" lib/screens/login_screen.dart
          test -s LOGO_SOURCE_AUDIT.md
          grep -Fq "不是矢量路径" LOGO_SOURCE_AUDIT.md
          grep -Fq "turnstileToken" lib/services/tokenway_api.dart
          grep -Fq "_openPrivacyPolicy" lib/screens/profile_screen.dart
          grep -Fq "privacy-policy" lib/screens/profile_screen.dart

      - name: Resolve dependencies
        working-directory: tokenway-source/mobile
        run: flutter pub get

      - name: Prepare original TokenWay app icon
        working-directory: tokenway-source/mobile
        run: dart run scripts/prepare_brand_icon.dart

      - name: Verify generated TokenWay icon crop and PNG dimensions
        working-directory: tokenway-source/mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '64 / 60' scripts/prepare_brand_icon.dart
          ! grep -Fq 'source.height * 1.2' scripts/prepare_brand_icon.dart
          python3 - <<'PY'
          from pathlib import Path
          import struct

          data = Path("assets/brand-icon.png").read_bytes()
          if data[:8].hex() != "89504e470d0a1a0a":
              raise SystemExit("Generated TokenWay app icon is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (512, 512):
              raise SystemExit(f"Unexpected app icon dimensions: {width}x{height}")
          print("Verified 512x512 app icon generated with the wordmark excluded from the T-symbol crop.")
          PY

      - name: Generate Android and iOS launcher icons
        working-directory: tokenway-source/mobile
        run: dart run flutter_launcher_icons

      - name: Audit generated iOS project without macOS/Xcode
        working-directory: tokenway-source/mobile
        run: python3 scripts/validate_ios_scaffold.py

# Flutter analyze and regression tests are gated by tokenway-mobile-targeted-tests.yml; avoid rerunning passed tests here.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-gradle-${{ hashFiles('tokenway-source/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: ubuntu-gradle-

      - name: Confirm task artifact response decoding is awaited
        working-directory: tokenway-source/mobile
        run: grep -q 'final body = await _map(response)' lib/services/tokenway_api.dart

      - name: Build Android APK
        working-directory: tokenway-source/mobile
        run: flutter build apk --release --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tokenway-android-apk
          path: tokenway-source/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish build status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success'
              ? 'success'
              : process.env.JOB_STATUS === 'cancelled'
                ? 'error'
                : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'tokenway/flutter-android',
              description: 'Flutter analyze, tests, iOS static audit and Android APK build',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
