name: TokenWay full dependency remediation (isolated parallel strategies)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tokenway-dependency-full-remediation.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: tokenway-dependency-full-remediation
  cancel-in-progress: false
jobs:
  remediation:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Semver-compatible security fixes
            key: compatible
            command: bun audit fix
          - label: Latest security fixes isolated compatibility experiment
            key: latest
            command: bun audit fix --latest
    steps:
      - name: Download exact audited source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p candidate
          curl --fail --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14767406608/zip" -o /tmp/tokenway-source.zip
          unzip -tq /tmp/tokenway-source.zip
          unzip -q /tmp/tokenway-source.zip -d candidate
          test -s candidate/web/package.json
          test -s candidate/web/bun.lock
          rm -rf candidate/web/node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact baseline
        working-directory: candidate/web
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile
      - name: Apply remediation strategy (capture partial progress)
        id: remediate
        working-directory: candidate/web
        run: |
          set +e
          ${{ matrix.command }} 2>&1 | tee ../../remediation-${{ matrix.key }}.log
          repair_status=${PIPESTATUS[0]}
          echo "REMEDIATION_EXIT=${repair_status}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$repair_status" -ne 0 ]; then
            echo "Remediation command returned non-zero; continue to audit and retain partial candidate evidence."
            echo "partial=true" >> "$GITHUB_OUTPUT"
          else
            echo "partial=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Apply targeted security overrides
        working-directory: candidate/web
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.overrides={...(p.overrides||{}),'@hono/node-server':'2.1.3','decode-uri-component':'0.5.1','minimatch':'11.0.1','zod':'4.6.6'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"
          bun install
      - name: Produce full audit report (do not hide remaining findings)
        if: always()
        working-directory: candidate/web
        run: |
          set +e
          bun audit 2>&1 | tee ../../audit-${{ matrix.key }}.log
          audit_status=${PIPESTATUS[0]}
          echo "BUN_AUDIT_EXIT=${audit_status}" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'vulnerabilities remaining|^[0-9]+ vulnerabilities|^(@hono/node-server|decode-uri-component|minimatch|zod)@' ../../audit-${{ matrix.key }}.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit 0
      - name: Upload isolated remediation candidate and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokenway-full-remediation-${{ matrix.key }}
          path: |
            candidate/web/package.json
            candidate/web/bun.lock
            remediation-${{ matrix.key }}.log
            audit-${{ matrix.key }}.log
          if-no-files-found: error
          retention-days: 7
