name: TokenWay remediated frontend typecheck with root fixtures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tokenway-typecheck-root-fixture.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: tokenway-typecheck-root-fixture
  cancel-in-progress: false
jobs:
  typecheck:
    name: Retest TypeScript with complete repository fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download remediated frontend and restore root fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p candidate/TokenWay-V11/web original
          curl --fail --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14766199131/zip" -o /tmp/remediated.zip
          unzip -q /tmp/remediated.zip -d candidate/TokenWay-V11/web
          rm -rf candidate/TokenWay-V11/web/node_modules
          curl --fail --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14741328440/zip" -o /tmp/original.tar.gz
          tar -xzf /tmp/original.tar.gz -C original
          mkdir -p candidate/TokenWay-V11/pkg/billingexpr/testdata
          cp original/TokenWay-V11/pkg/billingexpr/testdata/frontend_simulation.json candidate/TokenWay-V11/pkg/billingexpr/testdata/
          test -s candidate/TokenWay-V11/pkg/billingexpr/testdata/frontend_simulation.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install frozen remediated dependencies
        working-directory: candidate/TokenWay-V11/web
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v24.10.0"
          test "$(bun --version)" = "1.4.4"
          bun install --frozen-lockfile
      - name: Run typecheck only
        working-directory: candidate/TokenWay-V11/web
        run: bun run typecheck
