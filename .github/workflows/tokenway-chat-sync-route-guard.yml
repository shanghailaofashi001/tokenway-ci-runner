name: TokenWay encrypted chat sync route guard

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply_encrypted_chat_history_sync.py"
      - ".github/workflows/tokenway-chat-sync-route-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokenway-chat-sync-route-guard-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  chat-sync-route-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Checkout pinned TokenWay validation materials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: d1dd4edb3c7491f3e8b786dd455920d2e0fc5dd4
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned brand and route baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: d2494da77bc59b7edb4082bb2a594f24997b6ece
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: private-validation
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned upstream source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: QuantumNous/new-api
          ref: 48a6c87f9e7757fdc58e5be9bcb4f8281ad0dfd0
          path: source
          fetch-depth: 1

      - name: Restore access-token baseline and apply encrypted sync
        shell: bash
        run: |
          set -euo pipefail
          test -d private/.tokenway-validation
          cp -a private/.tokenway-validation .tokenway-validation
          cp -a private-validation/.tokenway-validation/. .tokenway-validation/
          test -s .tokenway-validation/add-playground-access-token-rules.py
          python3 -m py_compile .github/scripts/apply_encrypted_chat_history_sync.py .tokenway-validation/add-playground-access-token-rules.py
          cd source
          python3 ../.tokenway-validation/add-playground-access-token-rules.py
          python3 ../.github/scripts/apply_encrypted_chat_history_sync.py
          gofmt -w relaykit/dto/user_settings.go model/user.go router/api-router.go middleware/access_token_routes.go controller/chat_history_sync.go controller/chat_history_sync_test.go router/access_token_scope_test.go
          git diff --check
          grep -Fq '"GET /api/user/chat-history-sync": accessTokenSessionRule' middleware/access_token_routes.go
          grep -Fq '"PUT /api/user/chat-history-sync": accessTokenSessionRule' middleware/access_token_routes.go

      - name: Set up isolated Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.10"
          cache: false

      - name: Verify encrypted chat-sync access-token route coverage
        working-directory: source
        env:
          GOWORK: "off"
          GOTOOLCHAIN: "local"
          GOMAXPROCS: "2"
          GOFLAGS: "-p=2"
        run: go test ./router -run '^TestAccessTokenRouteRulesCoverEveryDashboardRoute$' -count=1

      - name: Verify encrypted payload validation
        working-directory: source
        env:
          GOWORK: "off"
          GOTOOLCHAIN: "local"
          GOMAXPROCS: "2"
          GOFLAGS: "-p=2"
        run: go test ./controller -run '^TestChatHistorySyncPayloadValidation$' -count=1
