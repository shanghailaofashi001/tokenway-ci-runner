          python3 -m py_compile ../.github/scripts/apply_encrypted_chat_history_sync.py
          python3 ../.github/scripts/apply_encrypted_chat_history_sync.py
          git diff --check
          grep -Eq 'ChatHistorySync[[:space:]]+string' relaykit/dto/user_settings.go
          grep -Fq 'UpdateUserChatHistorySync' model/user.go
          grep -Fq 'selfRoute.Use(middleware.DisableCache(), middleware.UserAuth())' router/api-router.go
          grep -Fq 'selfRoute.GET("/chat-history-sync", controller.GetChatHistorySync)' router/api-router.go
          grep -Fq 'selfRoute.PUT("/chat-history-sync", middleware.UserCriticalRateLimit("chat-history-sync"), controller.UpdateChatHistorySync)' router/api-router.go
          grep -Fq 'func GetChatHistorySync(c *gin.Context)' controller/chat_history_sync.go
          grep -Fq 'func UpdateChatHistorySync(c *gin.Context)' controller/chat_history_sync.go
          test -s controller/chat_history_sync_test.go
          echo "PASS: authenticated, no-cache, rate-limited E2E encrypted chat sync API and row-locked settings update applied."

      - name: Apply TokenWay owner-scoped file library backend and UI
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ../.github/scripts/apply_tokenway_file_library.py ../.github/scripts/apply_tokenway_file_library_web.py
          python3 ../.github/scripts/apply_tokenway_file_library.py
          python3 ../.github/scripts/apply_tokenway_file_library_web.py
          git diff --check
          grep -Fq 'httpRouter.GET("/files", controller.ListUserFiles)' router/relay-router.go
          grep -Fq 'httpRouter.POST("/files", controller.UploadUserFile)' router/relay-router.go
          grep -Fq 'selfRoute.GET("/files", middleware.DisableCache(), controller.ListUserFiles)' router/api-router.go
          grep -Fq '"GET /api/user/files":' middleware/access_token_routes.go
          grep -Fq 'func UploadUserFile(c *gin.Context)' controller/user_file.go
          grep -Fq 'func DeleteUserFile(c *gin.Context)' controller/user_file.go
          grep -Fq 'func GetUserFileContent(c *gin.Context)' controller/user_file.go
          test -s model/user_file_test.go
          test -s controller/user_file_test.go
          test -s web/src/features/profile/components/file-library-card.tsx
          grep -Fq 'TOKENWAY_FILE_STORAGE_DIR' docker-compose.yml
          echo "PASS: owner-scoped file library API, web UI and persistent-volume config applied."

      - name: Apply pinned Kuaipao AI migration to V11
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch="../.tokenway-validation/kuaipao-v11-migration.patch"
          printf '%s  %s\n' 'a9d194b0ad5f8f5950118789cb0baa85868cc6301295ad9444509d12cfd52aa2' "$patch" | sha256sum -c -
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          grep -Fq "kuaipao_anthropic" web/src/features/channels/lib/advanced-custom.ts
          grep -Fq "kuaipao_openai_chat" web/src/features/channels/lib/advanced-custom.ts
          grep -Fq "kuaipao_openai_responses" web/src/features/channels/lib/advanced-custom.ts
          grep -Fq "TestKuaipaoPresetRoutesJoinBaseURLWithoutDuplicateV1" relay/channel/advancedcustom/adaptor_test.go
          grep -Fq "TestKuaipaoModelListManagementRoutesJoinBaseURLAndUseBearerAuth" relay/channel/advancedcustom/adaptor_test.go
          echo "PASS: exact prior Kuaipao implementation and its focused tests migrated."

      - name: Repair NOWPayments refunded-order regression fixture scope
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.tokenway-validation/apply-finance-regression-fixtures.py
          python3 ../.tokenway-validation/apply-transactional-db-timestamp.py
          python3 ../.tokenway-validation/apply-payment-quota-error-compat.py
          python3 ../.tokenway-validation/apply-nowpayments-access-token-rules.py
          git diff --check

      - name: Guard task quota persistence for unpersisted billing fixtures
        working-directory: source
        run: python3 ../.tokenway-validation/apply-task-quota-persistence-guard.py

      - name: Apply Root regression fixtures before freezing source
        working-directory: source
        shell: bash
        run: python3 ../.github/scripts/apply-root-test-regressions.py

      - name: Set up isolated Go 1.26.10 toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.10"
          cache: false

      - name: Enforce Go toolchain isolation
        shell: bash
        run: |
          set -euo pipefail
          command -v go
          go version
          test "$(go env GOVERSION)" = "go1.26.10"
          test "$(go env GOTOOLCHAIN)" = "local"
          echo "Go 1.26.10 is active; system Go 1.23 is not used."

      - name: Verify Go formatting on all changed and added files
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <({ git diff --name-only -- '*.go'; git ls-files --others --exclude-standard -- '*.go'; } | sort -u)
          if (("${#go_files[@]}")); then
            gofmt -w "${go_files[@]}"
          fi
          mapfile -t go_files < <({ git diff --name-only -- '*.go'; git ls-files --others --exclude-standard -- '*.go'; } | sort -u)
          if (("${#go_files[@]}")); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\n%s\n' "$unformatted"
              gofmt -d "${go_files[@]}" || true
              exit 1
            fi
          fi
          echo "Changed/new Go files are gofmt-clean."

      - name: Restore and vendor Go modules
        id: go_vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          for d in source source/relaykit source/tokenkit; do
            label="${d//\//-}"
            log="/tmp/tokenway-vendor-${label}.log"
            echo "===== Go module: ${d} ====="
            rm -rf "${d}/vendor"
            if (
              cd "${d}"
              export GOWORK=off GOFLAGS='' GOTOOLCHAIN=local
              echo "+ go mod download all"
              go mod download all || { status=$?; echo "FAILED: go mod download all (${status})"; exit "${status}"; }
              echo "+ go mod verify"
              go mod verify || { status=$?; echo "FAILED: go mod verify (${status})"; exit "${status}"; }
              echo "+ go mod vendor"
              go mod vendor || { status=$?; echo "FAILED: go mod vendor (${status})"; exit "${status}"; }
              test -s vendor/modules.txt || { echo "FAILED: vendor/modules.txt missing or empty after go mod vendor"; exit 1; }
            ) >"${log}" 2>&1; then
              echo "PASS: fresh vendor generated for ${d}"
            else
              status=$?
              echo "FAIL: Go dependency restore/vendor for ${d} (exit ${status}). Diagnostics:"
              tail -n 180 "${log}" | sed -E 's#(https?://)[^/@ ]+:[^/@ ]+@#\1<redacted>@#g; s#(gh[pousr]_[A-Za-z0-9_]+)#<redacted>#g; s#(Bearer )[A-Za-z0-9._~-]+#\1<redacted>#g'
              exit "${status}"
            fi
          done
          test -s source/vendor/modules.txt

      - name: Set up Bun 1.4.4
        shell: bash
        run: |
          set -euo pipefail
          bun_dir="$RUNNER_TEMP/bun-1.4.4"
          bun_zip="$RUNNER_TEMP/bun-linux-x64.zip"
          mkdir -p "$bun_dir"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip" -o "$bun_zip"
          python3 - "$bun_zip" "$bun_dir" <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          archive, destination = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as bundle:
              candidates = [name for name in bundle.namelist() if name == "bun" or name.endswith("/bun")]
              if len(candidates) != 1:
                  raise SystemExit(f"expected one Bun executable in release archive, found {candidates}")
              target = os.path.join(destination, "bun")
              with bundle.open(candidates[0]) as source, open(target, "wb") as output:
                  shutil.copyfileobj(source, output)
          os.chmod(target, os.stat(target).st_mode | 0o111)
          link = os.path.join(destination, "bunx")
          if not os.path.exists(link):
              os.symlink("bun", link)
          print(f"Installed Bun executable: {target}")
          PY
          echo "$bun_dir" >> "$GITHUB_PATH"
          "$bun_dir/bun" --version
          test "$("$bun_dir/bun" --version)" = "1.4.4"

      - name: Install frontend dependencies
        working-directory: source/web
        run: bun install --frozen-lockfile

      - name: Format changed frontend files with protected headers
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          mapfile -t format_files < <(
            {
              git -C .. diff --name-only --diff-filter=ACMRT HEAD -- web
              git -C .. ls-files --others --exclude-standard
            } | awk '/^web\/.*\.(cjs|cts|css|html|js|jsx|json|md|mjs|mts|ts|tsx|yaml|yml)$/ {
              sub(/^web\//, "")
              print
            }' | sort -u
          )
          if [ "${#format_files[@]}" -eq 0 ]; then
            echo "No changed frontend files require formatting."
          else
            printf 'Formatting %s changed frontend files only\n' "${#format_files[@]}"
            node ../../.tokenway-validation/format-changed-with-protected-headers.mjs --write "${format_files[@]}"
            node ../../.tokenway-validation/format-changed-with-protected-headers.mjs --check "${format_files[@]}"
            node ../../.tokenway-validation/apply-changed-copyright-headers.mjs --write "${format_files[@]}"
            node ../../.tokenway-validation/apply-changed-copyright-headers.mjs --check "${format_files[@]}"
          fi

      - name: Remove transient frontend dependencies before snapshot freeze
        shell: bash
        run: rm -rf source/web/node_modules source/web/dist

      - name: Validate snapshot tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/tokenway-source-snapshot.py
          bash -n .github/scripts/run-tokenway-integration-suites.sh
          python3 -m py_compile .github/scripts/classify-tokenway-go-failures.py

      - name: Freeze immutable TokenWay source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/web/node_modules source/web/dist
          python3 .github/scripts/tokenway-source-snapshot.py freeze source source-snapshot.json

      - name: Upload immutable source snapshot for all acceptance layers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenway-v11-source-snapshot-${{ github.run_id }}
          path: |
            source/
            source-snapshot.json
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  layer1_go_static:
    name: "Layer 1 — Go format, dependencies, vet and build"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: assemble_source
    env:
      GOWORK: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
      GOFLAGS: "-mod=vendor -p=2"
      TOKENWAY_ROUTER_ONLY: "false"
      TOKENWAY_FRONTEND_ONLY: "false"
      TOKENWAY_LINT_ONLY: "false"
      TOKENWAY_FRONTEND_VERIFY: "false"
      TOKENWAY_GO_STATIC_ONLY: "false"
      TOKENWAY_PACKAGE_ONLY: "false"
      TOKENWAY_KUAIPAO_ONLY: "false"
      TOKENWAY_KUAIPAO_FRONTEND_ONLY: "false"
      TOKENWAY_RECOVERY_ONLY: "false"
      TOKENWAY_FINANCE_TARGETED_ONLY: "false"
      TOKENWAY_GO_MODULE_SCOPE: "all"
      TOKENWAY_ROOT_TEST_PACKAGES: ""
      TOKENWAY_ROOT_TEST_PATTERN: ""
      TOKENWAY_TARGETED_ONLY: "false"
      TOKENWAY_RUN_DATABASE_MATRIX: "true"
      TOKENWAY_TASK_DB_DIALECT: "all"
      TEST_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
    steps:
      - name: Checkout public CI orchestrator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download immutable source snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tokenway-v11-source-snapshot-${{ github.run_id }}
          path: .

      - name: Verify immutable source snapshot digest
        run: python3 .github/scripts/tokenway-source-snapshot.py verify source source-snapshot.json
      - name: Set up isolated Go 1.26.10 toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.10"
          cache: false

      - name: Enforce Go toolchain isolation
        shell: bash
        run: |
          set -euo pipefail
          command -v go
          go version
          test "$(go env GOVERSION)" = "go1.26.10"
          test "$(go env GOTOOLCHAIN)" = "local"
          echo "Go 1.26.10 is active; system Go 1.23 is not used."
      - name: Verify Go formatting without modifying frozen source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <({ git diff --name-only -- '*.go'; git ls-files --others --exclude-standard -- '*.go'; } | sort -u)
          if (("${#go_files[@]}")); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\\n%s\\n' "$unformatted"
              exit 1
            fi
          fi
          echo "PASS: frozen Go source is gofmt-clean."
      - name: Verify offline dependency graph
        id: offline_graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/web/dist
          printf '<!doctype html><html></html>\\n' > source/web/dist/index.html
          export GOPROXY=off GOSUMDB=off GOFLAGS="-mod=vendor -p=1" GOTOOLCHAIN=local
          for d in source source/relaykit source/tokenkit; do
            echo "===== Offline dependency graph: ${d} ====="
            if (cd "${d}" && go list -deps -test ./... >/dev/null) 2>/tmp/tokenway-go-list.err; then
              echo "PASS: offline dependency graph for ${d}"
            else
              status=$?
              echo "FAIL: offline dependency graph for ${d} (exit ${status})"
              tail -n 180 /tmp/tokenway-go-list.err
              exit "${status}"
            fi
          done
      - name: Vet and build root, relaykit, and tokenkit modules concurrently
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/tokenway-go-validation-logs"
          mkdir -p "$log_dir"

          # Vet and build read the already-assembled source tree. Run them concurrently,
          # but cap each Go process so the ubuntu-latest runner is not oversubscribed.
          (
            export GOMAXPROCS=1
            export GOFLAGS="-p=1"
            go vet ./... &&
              (cd relaykit && go vet ./...) &&
              (cd tokenkit && go vet ./...)
          ) >"$log_dir/go-vet.log" 2>&1 &
          vet_pid=$!

          (
            export GOMAXPROCS=1
            export GOFLAGS="-p=1"
            go build ./... &&
              (cd relaykit && go build ./...) &&
              (cd tokenkit && go build ./...)
          ) >"$log_dir/go-build.log" 2>&1 &
          build_pid=$!

          vet_status=0
          wait "$vet_pid" || vet_status=$?
          build_status=0
          wait "$build_pid" || build_status=$?

          echo "===== go vet output ====="
          cat "$log_dir/go-vet.log"
          echo "===== go build output ====="
          cat "$log_dir/go-build.log"

          if [ "$vet_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            echo "Go static validation failed: vet=$vet_status build=$build_status"
            exit 1
          fi
          echo "PASS: go vet and go build completed for root, relaykit, and tokenkit."

