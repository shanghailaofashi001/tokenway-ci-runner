            if ! grep -Fxq "$name" <<<"$listing"; then
              printf 'FAIL: %s/%s was not discovered by go test\n' "$package" "$name" >&2
              exit 1
            fi
            printf 'PASS: discovered %s/%s\n' "$package" "$name"
          }
          if [[ "${TOKENWAY_RECOVERY_ONLY:-false}" == "true" ]]; then
            check_test service TestProcessRequestBillingRecoverySettlesRefundsAndReviewsUnknownOutcomes
          else
            check_test common TestNormalizeBillingPreferenceAlwaysUsesWalletBalance
            check_test model TestCreditTopUpQuotaWritesIdempotentWalletLedger
            check_test model TestAdjustUserQuotaWritesImmutableWalletLedger
            check_test service TestWalletFundingReservationRetryKeepsIdempotencySequence
            check_test service TestProcessRequestBillingRecoverySettlesRefundsAndReviewsUnknownOutcomes
          fi
      - name: Run all discovered Root test packages and parallel isolated Go modules
        working-directory: source
        shell: bash
        run: bash ../.github/scripts/run-go-test-modules.sh
      - name: Classify Go failures by module, package and failed test
        if: always()
        shell: bash
        run: python3 .github/scripts/classify-tokenway-go-failures.py "$RUNNER_TEMP/tokenway-go-validation-logs"
      - name: Upload failed Go package diagnostics for targeted follow-up
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenway-go-failure-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/tokenway-go-validation-logs/
          if-no-files-found: ignore
          retention-days: 14

  layer3_integration:
    name: "Layer 3 — Wallet, refunds, task settlement and WebSocket integration"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: assemble_source
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tokenway-test
          MYSQL_DATABASE: tokenway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptokenway-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokenway
          POSTGRES_PASSWORD: tokenway-test
          POSTGRES_DB: tokenway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tokenway -d tokenway_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      GOWORK: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
      GOFLAGS: "-mod=vendor -p=2"
      TOKENWAY_ROUTER_ONLY: "false"
      TOKENWAY_FRONTEND_ONLY: "false"
      TOKENWAY_LINT_ONLY: "false"
      TOKENWAY_FRONTEND_VERIFY: "false"
      TOKENWAY_GO_STATIC_ONLY: "false"
      TOKENWAY_PACKAGE_ONLY: "false"
      TOKENWAY_KUAIPAO_ONLY: "false"
      TOKENWAY_KUAIPAO_FRONTEND_ONLY: "false"
      TOKENWAY_RECOVERY_ONLY: "false"
      TOKENWAY_FINANCE_TARGETED_ONLY: "false"
      TOKENWAY_GO_MODULE_SCOPE: "all"
      TOKENWAY_ROOT_TEST_PACKAGES: ""
      TOKENWAY_ROOT_TEST_PATTERN: ""
      TOKENWAY_TARGETED_ONLY: "false"
      TOKENWAY_RUN_DATABASE_MATRIX: "true"
      TOKENWAY_TASK_DB_DIALECT: "all"
      TEST_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_MYSQL_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_MYSQL_LOG_DSN: root:tokenway-test@tcp(127.0.0.1:3306)/tokenway_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_FIXED_POSTGRES_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
      TEST_FIXED_POSTGRES_LOG_DSN: postgres://tokenway:tokenway-test@127.0.0.1:5432/tokenway_test?sslmode=disable
    steps:
      - name: Checkout public CI orchestrator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download immutable source snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tokenway-v11-source-snapshot-${{ github.run_id }}
          path: .

      - name: Verify immutable source snapshot digest
        run: python3 .github/scripts/tokenway-source-snapshot.py verify source source-snapshot.json
      - name: Set up isolated Go 1.26.10 toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.10"
          cache: false

      - name: Enforce Go toolchain isolation
        shell: bash
        run: |
          set -euo pipefail
          command -v go
          go version
          test "$(go env GOVERSION)" = "go1.26.10"
          test "$(go env GOTOOLCHAIN)" = "local"
          echo "Go 1.26.10 is active; system Go 1.23 is not used."
      - name: Prepare temporary Go embed directory
        working-directory: source
        shell: bash
        run: |
          mkdir -p web/dist
          printf '<!doctype html><html></html>\\n' > web/dist/index.html
      - name: Run targeted CNY wallet payment conversion regressions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export GOPROXY=off GOSUMDB=off GOFLAGS="-mod=vendor -p=1" GOTOOLCHAIN=local
          mkdir -p web/dist
          printf '<!doctype html><html></html>\\n' > web/dist/index.html
          go test -v -timeout 3m ./controller -count=1 -run '^(TestGetNowPaymentsUSDPriceUsesWalletCurrencyExchangeRate|TestGetPayMoneyUsesCNYAsWalletBaseCurrency|TestChatHistorySyncPayloadValidation)$'
      - name: Run only migrated Kuaipao Go regressions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export GOPROXY=off GOSUMDB=off GOFLAGS="-mod=vendor -p=1" GOTOOLCHAIN=local
          mkdir -p web/dist
          printf '<!doctype html><html></html>\n' > web/dist/index.html
          go test -v -timeout 3m ./relay/channel/advancedcustom -count=1 -run '^(TestKuaipaoPresetRoutesJoinBaseURLWithoutDuplicateV1|TestKuaipaoModelListManagementRoutesJoinBaseURLAndUseBearerAuth)$'
      - name: Run tagged SQLite MySQL PostgreSQL wallet and Epay integration regressions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOMAXPROCS=1
          export GOFLAGS="-mod=vendor -p=1 -tags=tokenway_test"
          mkdir -p web/dist
          printf '<!doctype html><html></html>\\n' > web/dist/index.html
          model_tests="$(go test -list '^TestWalletLedgerAcrossSupportedDatabases$' ./model)"
          printf '%s\n' "$model_tests"
          grep -Fxq 'TestWalletLedgerAcrossSupportedDatabases' <<<"$model_tests"
          controller_tests="$(go test -list '^TestEpaySuccessfulTopUpCallbackIsSignedAndIdempotentAcrossDatabases$' ./controller)"
          printf '%s\n' "$controller_tests"
          grep -Fxq 'TestEpaySuccessfulTopUpCallbackIsSignedAndIdempotentAcrossDatabases' <<<"$controller_tests"
          echo "PASS: both tagged integration tests were discovered before execution."
          echo "===== Wallet ledger database matrix ====="
          go test -v -timeout 8m ./model -run TestWalletLedgerAcrossSupportedDatabases -count=1
          echo "===== Signed Epay callback database matrix ====="
          go test -v -timeout 8m ./controller -run TestEpaySuccessfulTopUpCallbackIsSignedAndIdempotentAcrossDatabases -count=1
      - name: Run refund, task settlement and WebSocket integration suites
        if: ${{ env.TOKENWAY_FRONTEND_VERIFY != 'true' && env.TOKENWAY_LINT_ONLY != 'true' && env.TOKENWAY_ROUTER_ONLY != 'true' && env.TOKENWAY_GO_STATIC_ONLY != 'true' && env.TOKENWAY_PACKAGE_ONLY != 'true' && env.TOKENWAY_KUAIPAO_ONLY != 'true' && env.TOKENWAY_FINANCE_TARGETED_ONLY != 'true' && (env.TOKENWAY_GO_MODULE_SCOPE == 'all' || env.TOKENWAY_GO_MODULE_SCOPE == 'root') && (env.TOKENWAY_TARGETED_ONLY != 'true' || env.TOKENWAY_RUN_DATABASE_MATRIX == 'true') }}
        working-directory: source
        shell: bash
        env:
          GOPROXY: off
          GOSUMDB: off
          GOTOOLCHAIN: local
          GOMAXPROCS: '1'
          GOFLAGS: -mod=vendor -p=1
        run: bash ../.github/scripts/run-tokenway-integration-suites.sh
      - name: Upload integration suite logs and failure classification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenway-integration-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/tokenway-integration-validation-logs/
          if-no-files-found: ignore
          retention-days: 14

  layer4_frontend:
    name: "Layer 4 — Frontend build, typecheck, tests and interface contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: assemble_source
    env:
      GOWORK: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
      GOFLAGS: "-mod=vendor -p=2"
      TOKENWAY_GO_STATIC_ONLY: "false"
      TOKENWAY_PACKAGE_ONLY: "false"
      TOKENWAY_FINANCE_TARGETED_ONLY: "false"
      TOKENWAY_TARGETED_ONLY: "false"
    steps:
      - name: Checkout public CI orchestrator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Checkout pinned private TokenWay source and validation materials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: 6cf1038df263f7bcc64f351b1b0523f4608142ce
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned complete TokenWay validation and brand snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: shanghailaofashi001/tokenway-v11-dev
          ref: d2494da77bc59b7edb4082bb2a594f24997b6ece
          token: ${{ secrets.TOKENWAY_SOURCE_READ_TOKEN }}
          path: private-validation
          fetch-depth: 1
          persist-credentials: false

      - name: Restore private build materials into ephemeral runner workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d private/.tokenway-validation
          test -d private/.tokenway-patches
          cp -a private/.tokenway-validation .
          cp private/.tokenway-validation/apply-transactional-db-timestamp.py .tokenway-validation/apply-transactional-db-timestamp.py
          cp private/.tokenway-validation/apply-payment-quota-error-compat.py .tokenway-validation/apply-payment-quota-error-compat.py
          cp private/.tokenway-validation/apply-nowpayments-access-token-rules.py .tokenway-validation/apply-nowpayments-access-token-rules.py
          cp -a private-validation/.tokenway-validation/. .tokenway-validation/
          cp private/.tokenway-validation/apply-frontend-oxlint-fixes.py .tokenway-validation/apply-frontend-oxlint-fixes.py
          cp private/.tokenway-validation/format-changed-with-protected-headers.mjs .tokenway-validation/format-changed-with-protected-headers.mjs
          cp private/.tokenway-validation/apply-changed-copyright-headers.mjs .tokenway-validation/apply-changed-copyright-headers.mjs
          cp -a private/.tokenway-patches .
          mkdir -p web/src/routes web/src/assets/tokenway-home
          test -s private-validation/web/src/routes/docs.tsx
          cp private-validation/web/src/routes/docs.tsx web/src/routes/docs.tsx
          test -s private-validation/web/src/assets/tokenway-home/hero-scene.webp
          cp private-validation/web/src/assets/tokenway-home/hero-scene.webp web/src/assets/tokenway-home/hero-scene.webp
          test -s .tokenway-validation/R7-finance-migration.patch.b64
          test -s .tokenway-validation/kuaipao-v11-migration.patch
          test -s .tokenway-validation/apply-task-quota-persistence-guard.py
          test -s .tokenway-validation/apply-nowpayments-access-token-rules.py
          python3 -m py_compile .tokenway-validation/apply-nowpayments-access-token-rules.py
          python3 -m py_compile .tokenway-validation/apply-shared-test-db-harness.py
          bash -n .github/scripts/run-go-test-modules.sh
          bash -n .github/scripts/run-tokenway-integration-suites.sh
          python3 -m py_compile .github/scripts/tokenway-source-snapshot.py
          python3 -m py_compile .github/scripts/classify-tokenway-go-failures.py
          test -s .tokenway-validation/apply-transactional-db-timestamp.py
          echo "Private validation inputs restored; source remains runner-local."
      - name: Download immutable source snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tokenway-v11-source-snapshot-${{ github.run_id }}
          path: .

      - name: Verify immutable source snapshot digest
        run: python3 .github/scripts/tokenway-source-snapshot.py verify source source-snapshot.json
      - name: Set up Bun 1.4.4
        shell: bash
        run: |
          set -euo pipefail
          bun_dir="$RUNNER_TEMP/bun-1.4.4"
          bun_zip="$RUNNER_TEMP/bun-linux-x64.zip"
          mkdir -p "$bun_dir"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip" -o "$bun_zip"
          python3 - "$bun_zip" "$bun_dir" <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          archive, destination = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as bundle:
              candidates = [name for name in bundle.namelist() if name == "bun" or name.endswith("/bun")]
              if len(candidates) != 1:
                  raise SystemExit(f"expected one Bun executable in release archive, found {candidates}")
              target = os.path.join(destination, "bun")
              with bundle.open(candidates[0]) as source, open(target, "wb") as output:
                  shutil.copyfileobj(source, output)
          os.chmod(target, os.stat(target).st_mode | 0o111)
          link = os.path.join(destination, "bunx")
          if not os.path.exists(link):
              os.symlink("bun", link)
          print(f"Installed Bun executable: {target}")
          PY
          echo "$bun_dir" >> "$GITHUB_PATH"
          "$bun_dir/bun" --version
          test "$("$bun_dir/bun" --version)" = "1.4.4"
      - name: Install frontend dependencies
        working-directory: source/web
        run: bun install --frozen-lockfile
      - name: Format changed frontend files with protected headers
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          mapfile -t format_files < <(
            {
              git -C .. diff --name-only --diff-filter=ACMRT HEAD -- web
              git -C .. ls-files --others --exclude-standard
            } | awk '/^web\/.*\.(cjs|cts|css|html|js|jsx|json|md|mjs|mts|ts|tsx|yaml|yml)$/ {
              sub(/^web\//, "")
              print
            }' | sort -u
          )
          if [ "${#format_files[@]}" -eq 0 ]; then
            echo "No changed frontend files require formatting."
          else
            printf 'Formatting %s changed frontend files only\n' "${#format_files[@]}"
            node ../../.tokenway-validation/format-changed-with-protected-headers.mjs --check "${format_files[@]}"
            node ../../.tokenway-validation/format-changed-with-protected-headers.mjs --check "${format_files[@]}"
            node ../../.tokenway-validation/apply-changed-copyright-headers.mjs --check "${format_files[@]}"
            node ../../.tokenway-validation/apply-changed-copyright-headers.mjs --check "${format_files[@]}"
          fi
      - name: Run only migrated Kuaipao frontend regressions
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail
          bun run test -- src/features/channels/lib/__tests__/advanced-custom.test.ts -t "Kuaipao Advanced Custom templates"
      - name: Generate routes and build frontend
        working-directory: source/web
        run: bun run build
      - name: Frontend typecheck
        working-directory: source/web
        run: bun run typecheck
      - name: Frontend unit tests
        working-directory: source/web
        run: TOKIO_WORKER_THREADS=1 RAYON_NUM_THREADS=1 bun run test --maxWorkers=1
      - name: Frontend Oxlint
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail

          # Full upstream lint is a diagnostic; changed frontend files are a hard gate.
          if bun run lint; then
            echo "PASS: full frontend Oxlint scan"
          else
            echo "::warning::Pinned upstream full-tree Oxlint baseline has existing violations; changed-file lint remains mandatory."
          fi

          mapfile -t changed_files < <(
            {
              git -C .. diff --name-only --diff-filter=ACMRT HEAD -- web | awk '/^web\/.*\.(js|jsx|ts|tsx|mjs|cjs)$/ { sub(/^web\//, ""); print }'
              git -C .. ls-files --others --exclude-standard | awk '/^web\/.*\.(js|jsx|ts|tsx|mjs|cjs)$/ { sub(/^web\//, ""); print }'
            } | sort -u
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed frontend source files to lint."
          else
            printf 'Linting %s changed/new frontend source files\n' "${#changed_files[@]}"
            printf '%s\n' "${changed_files[@]}"
            echo '--- Creator route source context (diagnostic) ---'
          if [ -f src/routes/_authenticated/creator/index.tsx ]; then nl -ba src/routes/_authenticated/creator/index.tsx | sed -n '1,45p'; else echo 'Creator route file missing'; fi
          echo '--- end Creator route source context ---'
          bunx oxlint -c .oxlintrc.json --format agent "${changed_files[@]}"
          fi
      - name: Frontend format and copyright checks
        working-directory: source/web
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          if bun run format:check; then
            echo "PASS: full-tree Oxfmt scan"
          else
            echo "::warning::Pinned upstream source has existing full-tree Oxfmt drift; changed-file formatting is enforced below."
          fi

          mapfile -t format_files < <(
            {
              git -C .. diff --name-only --diff-filter=ACMRT HEAD -- web
              git -C .. ls-files --others --exclude-standard
            } | awk '/^web\/.*\.(cjs|cts|css|html|js|jsx|json|md|mjs|mts|ts|tsx|yaml|yml)$/ {
              sub(/^web\//, "")
              print
            }' | sort -u
          )
          if [ "${#format_files[@]}" -gt 0 ]; then
            node ../../.tokenway-validation/format-changed-with-protected-headers.mjs --check "${format_files[@]}"
          fi
          if bun run copyright:check; then
            echo "PASS: full-tree copyright header scan"
          else
            echo "::warning::Pinned upstream contains pre-existing copyright-header drift; changed-file headers are strictly enforced below."
          fi

          mapfile -t copyright_files < <(
            {
              git -C .. diff --name-only --diff-filter=ACMRT HEAD -- web
              git -C .. ls-files --others --exclude-standard
            } | awk '/^web\/.*\.(cjs|css|js|jsx|mjs|scss|ts|tsx)$/ {
              sub(/^web\//, "")
              print
            }' | sort -u
          )
          if [ "${#copyright_files[@]}" -gt 0 ]; then
            node ../../.tokenway-validation/apply-changed-copyright-headers.mjs --check "${copyright_files[@]}"
          fi
      - name: Retained TokenWay media contract tests
        working-directory: source
        run: |
          set -euo pipefail
          node ../private/.tokenway-validation/test-media-plugin-contracts.mjs
          node ../private/.tokenway-validation/test-rc52-media-adapters.mjs
      - name: Upload frontend build output for same-run evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenway-frontend-dist-${{ github.run_id }}
          path: source/web/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

