          python3 -m py_compile .github/scripts/tokenway-source-snapshot.py
          python3 -m py_compile .github/scripts/classify-tokenway-go-failures.py
          test -s .tokenway-validation/apply-transactional-db-timestamp.py
          echo "Private validation inputs restored; source remains runner-local."

      - name: Download immutable source snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tokenway-v11-source-snapshot-${{ github.run_id }}
          path: .

      - name: Verify source snapshot before packaging
        run: python3 .github/scripts/tokenway-source-snapshot.py verify source source-snapshot.json

      - name: Package the exact source tree validated by this run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import tarfile
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          source = root / "source"
          if not source.is_dir():
              raise SystemExit("Refusing to package: assembled source directory is missing.")

          def git_head(folder):
              return subprocess.check_output(
                  ["git", "-C", str(root / folder), "rev-parse", "HEAD"],
                  text=True,
              ).strip()

          source_commit = git_head("source")
          source_snapshot = json.loads(Path("source-snapshot.json").read_text(encoding="utf-8"))
          if source_snapshot.get("source_commit") != source_commit:
              raise SystemExit("Refusing to package: source commit differs from the immutable validated snapshot")
          private_commit = git_head("private")
          brand_commit = git_head("private-validation")
          finance_patch = root / ".tokenway-validation/R7-finance-migration.patch.b64"
          kuaipao_patch = root / ".tokenway-validation/kuaipao-v11-migration.patch"
          for required_input in (finance_patch, kuaipao_patch):
              if not required_input.is_file() or required_input.stat().st_size == 0:
                  raise SystemExit(f"Refusing to package: required patch input is missing: {required_input}")

          stage = Path(os.environ["RUNNER_TEMP"]) / "tokenway-v11-same-run-release"
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)
          destination = stage / "TokenWay-V11"

          excluded_dirs = {
              ".git", "node_modules", "dist", "coverage", ".cache", ".vite",
              ".tanstack", ".turbo", ".next", ".output", "tmp", "logs",
          }
          env_examples = {".env.example", ".env.sample", ".env.template"}
          excluded_env = {".env", ".env.local", ".env.production", ".env.development"}

          def ignore(directory, names):
              rejected = []
              for name in names:
                  full = Path(directory) / name
                  if full.is_dir() and name in excluded_dirs:
                      rejected.append(name)
                  elif name in excluded_env:
                      rejected.append(name)
                  elif name.startswith(".env.") and name not in env_examples:
                      rejected.append(name)
                  elif name == ".DS_Store" or name.endswith(".log"):
                      rejected.append(name)
                  elif full.is_file() and Path(name).suffix.lower() in {".sqlite", ".sqlite3", ".db"}:
                      rejected.append(name)
              return rejected

          shutil.copytree(source, destination, ignore=ignore, symlinks=True)

          required_files = [
              "go.mod",
              "vendor/modules.txt",
              "relaykit/go.mod",
              "relaykit/vendor/modules.txt",
              "tokenkit/go.mod",
              "tokenkit/vendor/modules.txt",
              "web/package.json",
              "web/src/assets/tokenway-home/hero-scene.webp",
              "electron/main.js",
              "electron/preload.js",
              "electron/package.json",
              "electron/package-lock.json",
              "electron/icon.png",
              "electron/tokenway.ico",
              "electron/tray-icon-windows.png",
              ".github/workflows/electron-build.yml",
              "controller/nowpayments.go",
              "model/wallet_ledger.go",
              "model/request_billing_journal.go",
              "service/request_billing_recovery.go",
              "common/billing_preference_test.go",
              "model/topup_ledger_test.go",
              "model/user_quota_adjustment_test.go",
              "service/funding_source_test.go",
              "service/request_billing_recovery_test.go",
              "model/wallet_ledger_dialect_test.go",
              "controller/epay_callback_dialect_test.go",
              "internal/testsupport/database.go",
              "model/test_database_helpers_test.go",
              "controller/access_token_audit_test.go",
              "controller/model_management_test.go",
              "service/task_billing_test.go",
              "service/task_polling_test.go",
              "controller/relay_task_plugin_test.go",
              "controller/responses_websocket_test.go",
              "relay/responses_websocket_test.go",
              "pkg/wsmanager/wsmanager_test.go",
          ]
          for relative in required_files:
              path = destination / relative
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Refusing to package: required validated source file missing or empty: {relative}")

          for path in destination.rglob("*"):
              if path.is_symlink():
                  try:
                      resolved = path.resolve(strict=True)
                  except FileNotFoundError:
                      raise SystemExit(f"Broken symlink in validated source: {path.relative_to(destination)}")
                  if not resolved.is_relative_to(destination.resolve()):
                      raise SystemExit(f"External symlink in validated source: {path.relative_to(destination)}")

          file_records = []
          tree_digest = hashlib.sha256()
          for path in sorted(destination.rglob("*")):
              relative = path.relative_to(destination).as_posix()
              if path.is_symlink():
                  target = os.readlink(path)
                  file_records.append(f"SYMLINK {target}  TokenWay-V11/{relative}")
                  tree_digest.update(b"L" + bytes([0]) + relative.encode("utf-8") + bytes([0]) + target.encode("utf-8") + bytes([10]))
              elif path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  file_records.append(f"{digest}  TokenWay-V11/{relative}")
                  tree_digest.update(b"F" + bytes([0]) + relative.encode("utf-8") + bytes([0]) + bytes.fromhex(digest) + bytes([10]))

          source_tree_sha256 = tree_digest.hexdigest()
          if source_tree_sha256 != source_snapshot["source_tree_sha256"]:
              raise SystemExit("Refusing to package: source tree differs from the immutable snapshot validated by all four layers")
          (stage / "FILE-CHECKSUMS.sha256").write_text(
              "\n".join(file_records) + "\n", encoding="utf-8"
          )

          manifest = {
              "product": "TokenWay V11",
              "package_type": "same-run validated source archive",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "acceptance": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
                  "workflow_commit": os.environ["GITHUB_SHA"],
                  "ref": os.environ.get("GITHUB_REF", ""),
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
                  "result": "success — package step runs only after every required acceptance step succeeds",
              },
              "source": {
                  "repository": "QuantumNous/new-api",
                  "commit": source_commit,
                  "assembled_source_tree_sha256": source_tree_sha256,
                  "source_snapshot_sha256": source_snapshot["source_tree_sha256"],
              },
              "tokenway_validation": {
                  "repository": "shanghailaofashi001/tokenway-v11-dev",
                  "private_snapshot_commit": private_commit,
                  "branding_snapshot_commit": brand_commit,
                  "finance_migration_patch_sha256": hashlib.sha256(finance_patch.read_bytes()).hexdigest(),
                  "kuaipao_migration_patch_sha256": hashlib.sha256(kuaipao_patch.read_bytes()).hexdigest(),
              },
              "validated_layers": [
                  "Go formatting, dependency verification, offline dependency graph, vet and build",
                  "All discovered Root Go test packages (including e2e and channel adapters), plus Relaykit and Tokenkit module test suites",
                  "Machine-readable Go failure routing by module, package and exact failing test names, with targeted rerun selectors",
                  "Root test packages run in isolated processes with package-specific disposable SQL databases; Relaykit and Tokenkit run as independent parallel modules",
                  "A shared loopback-only SQL test harness creates per-test databases and applies production model migrations for schema-sensitive tests",
                  "Wallet ledger and signed Epay callback integration tests on SQLite, MySQL and PostgreSQL",
                  "Request billing recovery, task refunds and terminal-state settlement, submission durability, Responses WebSocket lifecycle and Redis channel-close isolation regressions; task settlement also runs on SQLite, MySQL and PostgreSQL",
                  "Frontend production build, TypeScript typecheck, unit tests, Oxlint, format/copyright and TokenWay media contracts",
              ],
              "contents": {
                  "source_file_count": len(file_records),
                  "vendored_go_dependencies": True,
                  "original_tokenway_brand_assets": True,
                  "git_metadata_included": False,
                  "node_modules_included": False,
                  "generated_frontend_dist_included": False,
                  "local_env_and_database_files_included": False,
              },
              "limitations": [
                  "No live merchant payment credentials or production settlement endpoints were used; live provider acceptance is not claimed."
              ],
          }
          (stage / "RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          evidence = [
              "# TokenWay V11 — same-run validation evidence",
              "",
              f"- Acceptance run: {run_url}",
              f"- CI workflow commit: {os.environ['GITHUB_SHA']}",
              f"- Upstream source commit: {source_commit}",
              f"- Assembled source tree SHA-256: {source_tree_sha256}",
              f"- Private validation snapshot: {private_commit}",
              f"- Branding snapshot: {brand_commit}",
              "",
              "The archive was created from the exact assembled source directory used by this successful workflow run. No source or dependency manifest was merged from a different acceptance run after tests completed.",
              "",
              "The package contains vendored Go dependencies and preserved TokenWay branding assets. It excludes Git metadata, local secrets, local databases, node_modules and generated frontend output.",
              "",
              "Live merchant credentials, production payment callbacks, live chain settlement and production refunds were not exercised.",
          ]
          (stage / "VALIDATION-EVIDENCE.md").write_text("\n".join(evidence) + "\n", encoding="utf-8")
          (stage / "PACKAGE-README.md").write_text(
              "# TokenWay V11 validated source package\n\n"
              "The complete assembled source is in TokenWay-V11/.\n\n"
              "Read RELEASE-MANIFEST.json, VALIDATION-EVIDENCE.md and FILE-CHECKSUMS.sha256. "
              "The manifest binds the archive to the same successful CI run and exact assembled source-tree digest.\n",
              encoding="utf-8",
          )

          archive = Path(os.environ["RUNNER_TEMP"]) / "TokenWay-V11-validated-source.tar.gz"
          if archive.exists():
              archive.unlink()
          with tarfile.open(archive, "w:gz") as bundle:
              bundle.add(stage, arcname=".")
          subprocess.run(["tar", "-tzf", str(archive)], check=True, stdout=subprocess.DEVNULL)
          archive_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive_size = archive.stat().st_size

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              output.write("## TokenWay V11 same-run validated source archive\n\n")
              output.write(f"- Acceptance run: {run_url}\n")
              output.write(f"- Upstream source commit: {source_commit}\n")
              output.write(f"- Assembled source tree SHA-256: {source_tree_sha256}\n")
              output.write(f"- Archive size: {archive_size} bytes\n")
              output.write(f"- Archive SHA-256: {archive_sha256}\n")
              output.write(f"- Source files and symlinks: {len(file_records)}\n")
          print(f"PACKAGE_READY: {archive}")
          print(f"SOURCE_TREE_SHA256: {source_tree_sha256}")
          print(f"PACKAGE_SIZE_BYTES: {archive_size}")
          print(f"PACKAGE_SHA256: {archive_sha256}")
          print(f"SOURCE_FILES_AND_SYMLINKS: {len(file_records)}")
          PY

      - name: Upload same-run validated TokenWay V11 source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenway-v11-validated-source
          path: ${{ runner.temp }}/TokenWay-V11-validated-source.tar.gz
          if-no-files-found: error
          retention-days: 30

  validate:
    name: "Five-layer TokenWay V11 acceptance complete"
    runs-on: ubuntu-latest
    needs: [assemble_source, layer1_go_static, layer2_unit, layer3_integration, layer4_frontend, layer5_package]
    steps:
      - name: Confirm all five layers and same-run SHA-256 package passed
        run: echo "PASS: all five independent acceptance layers used the same immutable source snapshot; final source archive was packaged and checksummed."
