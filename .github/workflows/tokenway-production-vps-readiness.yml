name: TokenWay Production VPS Readiness Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokenway-production-vps-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokenway-production-vps-readiness
  cancel-in-progress: false

jobs:
  read-only-production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_HOST: ${{ secrets.TOKENWAY_PROD_SSH_HOST }}
      PROD_USER: ${{ secrets.TOKENWAY_PROD_SSH_USER }}
      PROD_PORT: ${{ secrets.TOKENWAY_PROD_SSH_PORT }}
      PROD_SSH_KEY: ${{ secrets.TOKENWAY_PROD_SSH_PRIVATE_KEY }}
      PROD_KNOWN_HOSTS: ${{ secrets.TOKENWAY_PROD_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.TOKENWAY_PROD_DEPLOY_PATH }}
    steps:
      - name: Check pinned SSH access configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          set +x
          missing=()
          [[ -n "$PROD_HOST" ]] || missing+=("TOKENWAY_PROD_SSH_HOST")
          [[ -n "$PROD_USER" ]] || missing+=("TOKENWAY_PROD_SSH_USER")
          [[ "$PROD_PORT" =~ ^[0-9]{1,5}$ ]] && ((PROD_PORT >= 1 && PROD_PORT <= 65535)) || missing+=("TOKENWAY_PROD_SSH_PORT")
          [[ -n "$PROD_SSH_KEY" ]] || missing+=("TOKENWAY_PROD_SSH_PRIVATE_KEY")
          [[ -n "$PROD_KNOWN_HOSTS" ]] || missing+=("TOKENWAY_PROD_SSH_KNOWN_HOSTS")
          {
            echo "## TokenWay production VPS read-only readiness audit"
            echo
            echo "Target OS expectation: Ubuntu 22.04 LTS (will be detected, not assumed)."
            echo "No deployment path is assumed; an optional path is inspected only if supplied."
            echo
            if (("${#missing[@]}" > 0)); then
              echo "**BLOCKED — pinned SSH configuration is incomplete.**"
              echo
              for item in "${missing[@]}"; do printf -- '- %s
' "$item"; done
              echo
              echo "No SSH connection or remote command was attempted."
            else
              echo "Pinned SSH inputs are present. The remote operation is read-only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (("${#missing[@]}" > 0)); then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"

      - name: Run Ubuntu VPS inventory over pinned SSH
        if: steps.preflight.outputs.blocked == 'false'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          install -d -m 700 "$HOME/.ssh"
          printf '%s
' "$PROD_SSH_KEY" > "$HOME/.ssh/tokenway_prod_key"
          printf '%s
' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tokenway_prod_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/tokenway_prod_key"' EXIT
          ssh -i "$HOME/.ssh/tokenway_prod_key" -p "$PROD_PORT"             -o BatchMode=yes -o ConnectTimeout=12             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             "$PROD_USER@$PROD_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -u
          DEPLOY_PATH="$1"
          section() { printf '
===== %s =====
' "$1"; }
          section 'OS release'
          if [ -r /etc/os-release ]; then cat /etc/os-release; else uname -a; fi
          section 'CPU and load'
          nproc 2>/dev/null || true
          uptime 2>/dev/null || true
          section 'Memory and swap'
          free -h 2>/dev/null || true
          swapon --show 2>/dev/null || true
          section 'Disk and inode capacity'
          df -hT / 2>/dev/null || true
          df -i / 2>/dev/null || true
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT 2>/dev/null || true
          section 'Relevant installed Ubuntu packages (versions only)'
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query -W -f='${binary:Package} ${Version}
' 'docker*' 'containerd*' 'postgresql*' 'redis*' 'nginx*' 'caddy*' 2>/dev/null || true
          fi
          section 'Relevant active systemd service names'
          if command -v systemctl >/dev/null 2>&1; then
            systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei 'tokenway|postgres|redis|docker|containerd|nginx|caddy' || true
          fi
          section 'Docker and Compose (only if installed)'
          if command -v docker >/dev/null 2>&1; then
            docker version --format 'client={{.Client.Version}} server={{.Server.Version}}' 2>&1 || true
            docker compose version 2>&1 || true
            docker ps --format 'table {{.Names}}	{{.Image}}	{{.Status}}	{{.Ports}}' 2>&1 || true
            docker stats --no-stream --format 'table {{.Name}}	{{.CPUPerc}}	{{.MemUsage}}	{{.MemPerc}}' 2>&1 || true
          else
            echo 'Docker is not installed; no installation attempted.'
          fi
          section 'Listening TCP sockets'
          ss -lnt 2>/dev/null || true
          section 'Kernel OOM evidence (current boot; may require journal permission)'
          if command -v journalctl >/dev/null 2>&1; then
            journalctl -k -b --no-pager 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process' | tail -30 || true
          fi
          section 'Optional deployment directory'
          if [ -n "$DEPLOY_PATH" ]; then
            if [ -d "$DEPLOY_PATH" ]; then
              printf 'Directory exists: %s
' "$DEPLOY_PATH"
              find "$DEPLOY_PATH" -maxdepth 1 -type f -printf '%f
' 2>/dev/null | sort | head -80
              if [ -f "$DEPLOY_PATH/docker-compose.yml" ] && command -v docker >/dev/null 2>&1; then
                docker compose -f "$DEPLOY_PATH/docker-compose.yml" ps 2>&1 || true
              fi
            else
              printf 'Configured deployment path does not exist: %s
' "$DEPLOY_PATH"
            fi
          else
            echo 'No deployment path secret supplied; no path assumed or entered.'
          fi
          section 'Safety boundary'
          echo 'Read-only inventory only: no environment variables, secret values, database contents, payment credentials, or private keys were read or printed.'
          echo 'No packages, services, containers, firewall rules, files, database schemas, or persistent volumes were changed.'
          REMOTE

      - name: Record audit safety boundary
        if: always()
        run: |
          {
            echo
            echo "This workflow performs inventory only. It does not install Docker, migrate databases, change Compose/systemd configuration, restart services, alter firewall rules, or deploy."
            echo "SSH host identity is pinned from TOKENWAY_PROD_SSH_KNOWN_HOSTS; ssh-keyscan trust-on-first-use is not used."
            echo "The remote inventory detects the current OS and deployment method rather than assuming Debian, Docker, a fixed directory, or a fixed PostgreSQL/Redis layout."
            echo "No payment credentials are inspected and no charge, refund, callback, or blockchain transaction is initiated."
          } >> "$GITHUB_STEP_SUMMARY"
