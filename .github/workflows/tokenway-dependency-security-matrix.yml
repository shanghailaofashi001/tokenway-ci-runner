name: TokenWay self-healing security and regression matrix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tokenway-dependency-security-matrix.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: tokenway-dependency-security-matrix-v3
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare complete source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restore complete source and clean dependency-remediated web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p source/TokenWay-V11 original/source
          curl --fail --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14741328440/zip" -o /tmp/original-source.tar.gz
          tar -tzf /tmp/original-source.tar.gz >/dev/null
          tar -xzf /tmp/original-source.tar.gz -C original/source
          original_root="$(find original/source -type f -path '*/web/package.json' -print -quit | sed 's#/web/package.json##')"
          test -n "$original_root"
          cp -a "$original_root/." source/TokenWay-V11/
          curl --fail --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14767259375/zip" -o /tmp/remediated-web.zip
          unzip -tq /tmp/remediated-web.zip
          rm -rf /tmp/remediated-web source/TokenWay-V11/web
          mkdir -p /tmp/remediated-web source/TokenWay-V11/web
          unzip -oq /tmp/remediated-web.zip -d /tmp/remediated-web
          test -s /tmp/remediated-web/candidate/web/package.json
          test -s /tmp/remediated-web/candidate/web/bun.lock
          cp /tmp/remediated-web/candidate/web/package.json source/TokenWay-V11/web/package.json
          cp /tmp/remediated-web/candidate/web/bun.lock source/TokenWay-V11/web/bun.lock
          test -s source/TokenWay-V11/web/package.json
          test -s source/TokenWay-V11/web/bun.lock
          test -s source/TokenWay-V11/pkg/billingexpr/testdata/frontend_simulation.json
      - uses: actions/upload-artifact@v4
        with:
          name: tokenway-source-final-security-candidate
          path: source/TokenWay-V11/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  validate:
    name: Final dependency candidate - ${{ matrix.task }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: security-audit
            command: audit
          - task: typescript-typecheck
            command: typecheck
          - task: full-unit-suite
            command: test
          - task: production-build
            command: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokenway-source-final-security-candidate
          path: candidate/TokenWay-V11
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Apply verified security overrides and install
        working-directory: candidate/TokenWay-V11/web
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.overrides={...(p.overrides||{}),'@hono/node-server':'1.19.18','decode-uri-component':'0.5.1','minimatch':'11.0.1','zod':'4.6.6'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8')); console.log('package.json valid JSON')"
          bun install
      - name: Run isolated validation
        working-directory: candidate/TokenWay-V11/web
        env:
          TASK: ${{ matrix.command }}
        run: |
          set -Eeuo pipefail
          if [ "$TASK" = "audit" ]; then
            bun audit
          else
            bun run "$TASK"
          fi
      - name: Preserve exact final dependency candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokenway-final-dependency-candidate-${{ matrix.command }}
          path: |
            candidate/TokenWay-V11/web/package.json
            candidate/TokenWay-V11/web/bun.lock
          if-no-files-found: error
          retention-days: 7
